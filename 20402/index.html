<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>10초 등교 준비물 체크리스트</title>
<meta name="description" content="요일과 날씨를 고르면 오늘 챙길 준비물을 보여 주고, 챙긴 것을 눌러 하나씩 지우는 등교 준비물 체크리스트">
<meta name="class" content="M반 (2-8)">
<meta name="status" content="2회 개선">
<meta name="design" content="컬러셋 C8 분홍과 민트 · 트렌드 T06 스크롤 3D · #ffb3d1">
<style>
  :root {
    --bg: #f5f7f7;
    --card: #ffffff;
    --text: #1d2426;
    --muted: #56636a;
    --line: #d6dde0;
    --accent: #0f766e;
    --accent-weak: #e3f3f1;
    --ok: #1a7f37;
    --ok-weak: #e9f6ec;
    --err: #b42318;
    --err-weak: #fdecea;
    --warn: #8a5a00;
    --warn-weak: #fff6e0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    font-size: 17px;
    line-height: 1.7;
    word-break: keep-all;
    overflow-wrap: anywhere;
  }
  .wrap { max-width: 42rem; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; line-height: 1.3; }
  h2 { font-size: 1.1rem; margin: 0 0 10px; }
  .intro { color: var(--muted); margin: 0 0 12px; }

  /* 상단 경고 안내: 기본 목록만 믿지 않도록 눈에 띄게 */
  .notice {
    margin: 0 0 20px; padding: 12px 14px; border-radius: 8px;
    background: var(--warn-weak); color: var(--warn); border-left: 4px solid var(--warn);
    font-weight: 600;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 20px 16px;
    margin-bottom: 20px;
  }

  button {
    font: inherit;
    min-height: 48px;
    padding: 8px 16px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--text);
    cursor: pointer;
  }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* 요일·날씨 선택 버튼: 크게, 눌린 상태는 색 + ✓ 글자로 같이 표시 */
  .choice-group { margin: 0 0 16px; }
  .choice-group:last-of-type { margin-bottom: 0; }
  .choice-label { font-weight: 600; margin: 0 0 6px; }
  .choices { display: grid; gap: 8px; }
  .choices.days { grid-template-columns: repeat(5, 1fr); }
  .choices.weather { grid-template-columns: repeat(2, 1fr); }
  .choices button { min-height: 56px; font-size: 1.1rem; font-weight: 600; padding: 8px 4px; }
  .choices button[aria-pressed="true"] {
    background: var(--accent); border-color: var(--accent); color: #fff;
  }
  .choices button[aria-pressed="true"]::before { content: "✓ "; }
  .small-note { font-size: 0.92rem; color: var(--muted); margin: 8px 0 0; }
  .small-note:empty { display: none; }

  /* 준비물 목록 */
  .list-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
  .list-head h2 { margin: 0; }
  .remain { font-weight: 700; color: var(--accent); font-size: 1.05rem; }
  .how { font-size: 0.92rem; color: var(--muted); margin: 0 0 12px; }
  .items { list-style: none; margin: 0; padding: 0; }
  .items li { margin: 0 0 8px; }
  .item-btn {
    width: 100%; min-height: 56px; text-align: left;
    display: flex; align-items: center; gap: 12px;
    font-size: 1.15rem; padding: 10px 14px;
    border: 2px solid var(--line);
  }
  .item-btn:hover { border-color: var(--accent); background: var(--accent-weak); }
  .item-name { flex: 1; min-width: 0; }
  .box { width: 24px; height: 24px; border: 2px solid var(--muted); border-radius: 6px; flex: none; }
  /* 기본 / 추가 표시: 글자 배지로 구분 */
  .tag { flex: none; font-size: 0.8rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
  .tag.base { background: #eef1f3; color: var(--muted); }
  .tag.custom { background: var(--accent-weak); color: var(--accent); }
  .item-btn.custom { border-style: dashed; border-color: var(--accent); }
  /* 요일·날씨 때문에 생긴 준비물은 배지를 진하게 해서 눈에 띄게 */
  .tag.cond { background: var(--accent); color: #fff; }

  /* 직접 추가한 준비물 줄: [챙김 버튼][✕ 삭제 버튼] — 두 버튼을 떨어뜨리고 모양을 다르게 */
  .items li.custom-row { display: flex; gap: 8px; }
  .items li.custom-row .item-btn { flex: 1; min-width: 0; }
  .del-btn {
    flex: none; width: 56px; min-height: 56px; padding: 0;
    border: 2px solid var(--err); color: var(--err); background: #fff;
    font-size: 1.3rem; font-weight: 700; line-height: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  }
  .del-btn small { font-size: 0.7rem; font-weight: 600; }
  .del-btn:hover { background: var(--err-weak); }

  /* 고른 조건으로 생긴 준비물을 버튼 바로 아래에 요약 (휴대폰에서 목록이 화면 밖이어도 보이게) */
  .cond-summary {
    margin: 14px 0 0; padding: 10px 12px; border-radius: 8px;
    background: var(--accent-weak); color: var(--text); font-size: 0.95rem;
  }
  .cond-summary strong { color: var(--accent); }

  /* 되돌리기 줄: 자리를 항상 차지해서 목록이 위아래로 밀리지 않게 */
  .undo-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 0 0 12px; }
  .undo-btn { border-color: var(--accent); color: var(--accent); font-weight: 700; }
  .undo-btn:disabled { border-color: var(--line); color: var(--muted); cursor: default; opacity: 0.7; }
  .undo-hint { font-size: 0.9rem; color: var(--muted); flex: 1; min-width: 0; }
  .save-note { font-size: 0.88rem; color: var(--muted); margin: 10px 0 0; }
  .save-note:empty { display: none; }

  .done-msg {
    padding: 18px 14px; border-radius: 8px; text-align: center;
    background: var(--ok-weak); color: var(--ok); font-weight: 700; font-size: 1.1rem;
    border: 1px solid #b7e1c1;
  }
  .done-msg[hidden] { display: none; }

  /* 직접 추가 */
  .add-row { display: flex; gap: 8px; }
  .add-row input {
    flex: 1; min-width: 0; font: inherit; padding: 10px 12px; min-height: 48px;
    border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--text);
  }
  .add-row input[aria-invalid="true"] { border-color: var(--err); border-width: 2px; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; flex: none; padding: 8px 20px; }
  .custom-count { font-size: 0.92rem; color: var(--muted); margin: 8px 0 0; }

  .msg { margin-top: 10px; padding: 10px 12px; border-radius: 8px; font-size: 0.95rem; }
  .msg:empty { display: none; }
  .msg-error { background: var(--err-weak); color: var(--err); border-left: 4px solid var(--err); }
  .msg-ok { background: var(--ok-weak); color: var(--ok); border-left: 4px solid var(--ok); }
  .msg-warn { background: var(--warn-weak); color: var(--warn); border-left: 4px solid var(--warn); }

  .reset-area { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .btn-reset { border-color: var(--err); color: var(--err); }
  .footer-note { font-size: 0.88rem; color: var(--muted); margin: 0; }

  @media (max-width: 400px) {
    .choices button { font-size: 1rem; }
    .choices.days button[aria-pressed="true"]::before { content: ""; }
  }

  /* ===== 디자인: C8 분홍과 민트 + T06 스크롤 3D ===== */
  @font-face { font-family: "Wanted Sans"; src: url("../assets/fonts/WantedSansVariable.woff2") format("woff2"); font-weight: 400 1000; font-display: swap; }
  :root {
    --bg: #fff5fa;
    --card: #ffffff;
    --text: #3b2a4d;
    --muted: #6a5679;
    --line: #f3d6ea;
    --accent: #ffb3d1;
    --accent-ink: #b4236a;   /* 바탕 위에 강조 글자를 쓸 때 */
    --accent-weak: #d7f5ec;  /* 결과·요약 색 블록 */
  }
  body { font-family: "Wanted Sans", system-ui, -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
  .card {
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,.12);
  }
  .notice { border-radius: 12px; }
  /* 버튼·입력칸: 모서리 12px, 보조 버튼·입력칸은 진한 보조색 테두리 */
  button { border-radius: 12px; border: 1px solid var(--muted); background: var(--card); }
  button:focus-visible, input:focus-visible { outline-color: var(--accent-ink); }
  .add-row input { border: 1px solid var(--muted); border-radius: 12px; background: var(--card); }
  .choices button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent-ink); color: #111111; }
  .btn-primary { background: var(--accent); border-color: var(--accent-ink); color: #111111; }
  .remain { color: var(--accent-ink); }
  .item-btn { border: 1px solid var(--muted); }
  .item-btn:hover { border-color: var(--accent-ink); background: var(--bg); }
  .item-btn.custom { border-style: dashed; border-color: var(--accent-ink); }
  .box { border-color: var(--muted); }
  .tag.base { background: var(--bg); color: var(--muted); }
  .tag.custom { background: var(--accent-weak); color: var(--accent-ink); }
  .tag.cond { background: var(--accent); color: #111111; }
  .del-btn { border-radius: 12px; }
  .cond-summary { background: var(--accent-weak); border-radius: 12px; }
  .cond-summary strong { color: var(--accent-ink); }
  .undo-btn { border-color: var(--muted); color: var(--accent-ink); }
  .undo-btn:disabled { border-color: var(--line); color: var(--muted); }
  .done-msg, .msg { border-radius: 12px; }

  /* 3D 등장(짧게): 준비물 줄이 새로 나타날 때만 0.35초 동안 뒤로 누웠다가 똑바로 선다.
     처음 열 때, 요일·날씨를 바꿔 새로 생긴 줄, 직접 추가한 줄, 되돌린 줄만 움직이고
     이미 있던 줄은 다시 움직이지 않는다. 움직임이 끝나면 기울기 없이 똑바로 서 있어서
     누를 수 있는 영역이 화면에 보이는 그대로다. (마지막 줄까지 0.5초 안에 끝남) */
  .items { perspective: 900px; --tilt: 40deg; }
  @media (max-width: 600px) { .items { --tilt: 30deg; } }
  @keyframes stand-up {
    from { transform: rotateX(var(--tilt)) translateY(10px); opacity: 0.35; }
    to { transform: none; opacity: 1; }
  }
  .items li.enter {
    transform-origin: 50% 100%;
    animation: stand-up 0.35s cubic-bezier(.2, .8, .3, 1) backwards;
  }
  @media (prefers-reduced-motion: reduce) {
    .items li.enter { animation: none !important; }
  }
</style>
</head>
<body>
<main class="wrap">
  <!-- [상단] 제목과 안내 -->
  <h1>10초 등교 준비물 체크리스트</h1>
  <p class="intro">요일과 날씨를 고르고, 챙긴 준비물을 눌러 하나씩 지워 보세요.</p>
  <p class="notice" role="note">⚠️ 기본 준비물은 참고용입니다. 오늘만의 특별한 준비물은 아래에서 직접 추가하세요!</p>

  <!-- [중단 1] 요일·날씨 선택 -->
  <section class="card" aria-labelledby="condTitle">
    <h2 id="condTitle">오늘 조건 고르기</h2>
    <div class="choice-group">
      <p class="choice-label" id="dayLabel">요일</p>
      <div class="choices days" role="group" aria-labelledby="dayLabel" id="dayButtons">
        <button type="button" data-day="월">월</button>
        <button type="button" data-day="화">화</button>
        <button type="button" data-day="수">수</button>
        <button type="button" data-day="목">목</button>
        <button type="button" data-day="금">금</button>
      </div>
      <p class="small-note" id="dayNote"></p>
    </div>
    <div class="choice-group">
      <p class="choice-label" id="weatherLabel">날씨</p>
      <div class="choices weather" role="group" aria-labelledby="weatherLabel" id="weatherButtons">
        <button type="button" data-weather="맑음">☀️ 맑음</button>
        <button type="button" data-weather="비/눈">☔ 비·눈</button>
      </div>
    </div>
    <p class="cond-summary" id="condSummary" aria-live="polite"></p>
  </section>

  <!-- [중단 2] 챙겨야 할 준비물 목록 -->
  <section class="card" aria-labelledby="listTitle">
    <div class="list-head">
      <h2 id="listTitle">챙겨야 할 준비물</h2>
      <span class="remain" id="remainText" aria-live="polite"></span>
    </div>
    <p class="how">챙긴 준비물을 누르면 목록에서 바로 사라져요. 잘못 눌렀으면 ‘되돌리기’를 누르세요.</p>
    <div class="undo-row">
      <button type="button" class="undo-btn" id="undoButton" disabled>↶ 되돌리기</button>
      <span class="undo-hint" id="undoHint" aria-live="polite"></span>
    </div>
    <ul class="items" id="itemList"></ul>
    <p class="done-msg" id="doneMsg" role="status" hidden>모든 준비물을 챙겼습니다! 완벽한 하루 되세요!</p>
    <p class="save-note" id="saveNote"></p>
  </section>

  <!-- [하단] 직접 추가 + 초기화 -->
  <section class="card" aria-labelledby="addTitle">
    <h2 id="addTitle">오늘만의 특수 준비물 추가</h2>
    <form id="addForm" novalidate>
      <div class="add-row">
        <input type="text" id="addInput" maxlength="30" autocomplete="off"
               aria-label="추가할 준비물 이름" placeholder="예: 수행평가 보고서">
        <button type="submit" class="btn-primary">추가</button>
      </div>
    </form>
    <p class="custom-count" id="customCount"></p>
    <p class="msg" id="addMsg" aria-live="polite"></p>
    <p class="msg msg-warn" id="storageMsg"></p>
  </section>

  <section class="card" aria-label="초기화">
    <div class="reset-area">
      <button type="button" class="btn-reset" id="resetButton">초기화</button>
      <p class="footer-note">요일·날씨 선택, 체크한 내역, 직접 추가한 준비물을 모두 처음 상태로 되돌려요. (저장된 내역도 지워요)</p>
    </div>
    <p class="msg" id="resetMsg" aria-live="polite"></p>
  </section>
</main>

<script>
// ===== 기본 준비물 가상 데이터 =====
// 조건(공통, 요일, 날씨)마다 챙길 준비물을 배열로 적어 둔다.
const BASE_DATA = {
  common: ["학생증", "텀블러"],          // 매일 챙기는 것
  day: { 월: ["실내화"], 수: ["체육복"] },  // 요일별 (없는 요일은 빈 배열로 취급)
  weather: { "비/눈": ["우산"] }           // 날씨별
};
const DAYS = ["월", "화", "수", "목", "금"];
const MAX_CUSTOM = 10;                       // 직접 추가는 최대 10개
const MAX_UNDO = 20;                         // 되돌리기는 최근 20번까지 기억
// 이 프로그램만 쓰는 저장 키 (다른 데이터와 겹치지 않도록 접두사 사용)
const STORAGE_KEY = "sih26:20402:customItems"; // 직접 추가한 준비물 (예전 버전과 같은 키·같은 모양)
const TODAY_KEY = "sih26:20402:today";         // 오늘의 요일·날씨·체크 내역 (이번에 새로 추가)

// 전시판 미리보기처럼 "주소(출처)가 없는" 상자 안에서 열리면 origin이 "null"이 된다.
// 이런 곳에서는 저장이 막히거나, 새로고침하면 사라진다.
// (내려받은 파일을 직접 연 file:// 주소도 origin이 "null"이지만 저장은 되므로 제외)
const IN_PREVIEW_BOX = (window.origin === "null" && location.protocol !== "file:");

// ===== 상태 =====
let selectedDay = "월";
let selectedWeather = "맑음";
let customItems = [];   // 직접 추가한 준비물 이름 배열 (✕로 지우기 전까지 계속 남는다)
let checkedNames = [];  // 오늘 이미 챙겨서 지운 준비물 이름 (요일·날씨를 바꿔도 유지)
let undoStack = [];     // 챙긴 순서대로 쌓아 두는 이름 (맨 끝 = 가장 최근)
let shownNames = null;  // 바로 전 화면에 있던 준비물 이름 (새로 나타난 줄에만 등장 효과를 주려고)
let checklist = [];     // 지금 화면에 남아 있는 준비물: { name, type: "day" | "weather" | "common" | "custom" }

// 화면 요소
const dayButtons = document.querySelectorAll("#dayButtons button");
const weatherButtons = document.querySelectorAll("#weatherButtons button");
const dayNote = document.getElementById("dayNote");
const condSummary = document.getElementById("condSummary");
const itemList = document.getElementById("itemList");
const remainText = document.getElementById("remainText");
const doneMsg = document.getElementById("doneMsg");
const undoButton = document.getElementById("undoButton");
const undoHint = document.getElementById("undoHint");
const saveNote = document.getElementById("saveNote");
const addForm = document.getElementById("addForm");
const addInput = document.getElementById("addInput");
const addMsg = document.getElementById("addMsg");
const customCount = document.getElementById("customCount");
const storageMsg = document.getElementById("storageMsg");
const resetButton = document.getElementById("resetButton");
const resetMsg = document.getElementById("resetMsg");

const SAVED_TEXT = "💾 저장됨 — 새로고침하거나 다시 열어도 오늘 체크한 내역이 남아 있어요.";

// ===== 기본값 정하기 =====
// 기기 시계로 오늘 요일을 구한다. 토·일요일이면 월요일로 정하고 안내한다.
function getDefaultDay() {
  const names = ["일", "월", "화", "수", "목", "금", "토"];
  const today = names[new Date().getDay()];
  if (DAYS.includes(today)) {
    return { day: today, note: "" };
  }
  return { day: "월", note: "오늘은 " + today + "요일이라 월요일 준비물을 먼저 보여 줘요. 다른 요일이면 위에서 골라 주세요." };
}

// 오늘 날짜를 "2026-10-16" 같은 글자로 만든다 (날짜가 바뀌면 체크 내역을 새로 시작하려고)
function todayString() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

// 이름 배열만 남기는 도우미: 글자이고 비어 있지 않은 것만 (filter), 앞뒤 공백 제거 (map)
function cleanNames(data) {
  if (!Array.isArray(data)) return [];
  return data.filter(function (n) {
    return typeof n === "string" && n.trim() !== "";
  }).map(function (n) { return n.trim(); });
}

// ===== 저장 =====
// 저장 시도: 두 키 모두 쓰고, 다시 읽어서 같은지까지 확인한다. 성공하면 true.
function saveAll() {
  if (IN_PREVIEW_BOX) return false;
  try {
    const customText = JSON.stringify(customItems);
    const todayText = JSON.stringify({
      date: todayString(),
      day: selectedDay,
      weather: selectedWeather,
      checked: checkedNames,
      undo: undoStack
    });
    localStorage.setItem(STORAGE_KEY, customText);
    localStorage.setItem(TODAY_KEY, todayText);
    return localStorage.getItem(STORAGE_KEY) === customText &&
           localStorage.getItem(TODAY_KEY) === todayText;
  } catch (e) {
    return false;
  }
}

// 저장하고 결과를 화면에 알려 준다 (실제로 다시 읽어 확인된 경우에만 "저장됨")
function saveAndReport() {
  const ok = saveAll();
  if (ok) {
    saveNote.textContent = SAVED_TEXT;
    storageMsg.textContent = "";
  } else {
    saveNote.textContent = "";
    showStorageProblem(IN_PREVIEW_BOX ? "preview" : "unavailable");
  }
  return ok;
}

// 저장된 내용 불러오기. 결과에 따라 "loaded" / "none" / "unavailable" / "preview"
function loadAll() {
  if (IN_PREVIEW_BOX) return "preview";
  let customText, todayText;
  try {
    customText = localStorage.getItem(STORAGE_KEY);
    todayText = localStorage.getItem(TODAY_KEY);
  } catch (e) {
    return "unavailable";
  }
  let loaded = false;

  // 1) 직접 추가한 준비물 (예전 버전이 저장한 것도 같은 모양이라 그대로 읽힌다)
  if (customText !== null) {
    try {
      customItems = cleanNames(JSON.parse(customText)).slice(0, MAX_CUSTOM); // 혹시 많으면 10개까지만
      loaded = true;
    } catch (e) { /* 망가진 값이면 무시 (지우지는 않는다) */ }
  }

  // 2) 오늘의 체크 내역: 날짜가 오늘과 같을 때만 이어서 쓴다. 다른 날이면 새로 시작.
  if (todayText !== null) {
    try {
      const data = JSON.parse(todayText);
      if (data && data.date === todayString()) {
        if (DAYS.includes(data.day)) { selectedDay = data.day; dayNote.textContent = ""; }
        if (data.weather === "맑음" || data.weather === "비/눈") selectedWeather = data.weather;
        checkedNames = cleanNames(data.checked);
        undoStack = cleanNames(data.undo).slice(-MAX_UNDO);
        loaded = true;
      }
    } catch (e) { /* 망가진 값이면 무시하고 기본값으로 */ }
  }
  return loaded ? "loaded" : "none";
}

function showStorageProblem(reason) {
  if (reason === "preview") {
    storageMsg.textContent = "저장 안 됨: 이 미리보기 화면에서는 저장이 막혀 있어서 새로고침하면 체크 내역과 추가한 준비물이 사라져요. 계속 남기려면 ‘새 탭 실행’으로 열어 주세요.";
  } else {
    storageMsg.textContent = "저장 안 됨: 이 브라우저에서는 저장할 수 없어요. 목록 확인과 체크는 그대로 쓸 수 있어요.";
  }
}

// 지금 고른 조건의 기본 준비물 이름 배열
function currentBaseNames() {
  return BASE_DATA.common
    .concat(BASE_DATA.day[selectedDay] || [])
    .concat(BASE_DATA.weather[selectedWeather] || []);
}

// ===== 목록 만들기 =====
// 선택한 조건에 맞는 기본 준비물 + 직접 추가한 준비물을 하나의 배열로 합친 뒤,
// 이미 챙긴(checkedNames) 것은 filter로 빼서 "남은 목록"만 만든다.
function buildChecklist() {
  const list = [];
  // 요일 준비물 → 날씨 준비물 → 매일 준비물 순서로 push(배열 끝에 넣기)
  // (조건 때문에 생긴 준비물을 맨 위에 두어야 휴대폰에서 바로 눈에 띈다)
  (BASE_DATA.day[selectedDay] || []).forEach(function (n) { list.push({ name: n, type: "day" }); });
  (BASE_DATA.weather[selectedWeather] || []).forEach(function (n) { list.push({ name: n, type: "weather" }); });
  BASE_DATA.common.forEach(function (n) { list.push({ name: n, type: "common" }); });

  // 직접 추가한 것은 맨 아래에. 기본 목록과 이름이 같은 것은 빼서 두 번 나오지 않게 한다.
  customItems.forEach(function (n) {
    const same = list.some(function (item) { return item.name === n; });
    if (!same) list.push({ name: n, type: "custom" });
  });

  // filter: 이미 챙긴 이름은 남은 목록에서 뺀다
  checklist = list.filter(function (item) { return !checkedNames.includes(item.name); });
}

// 항목 옆 배지 글자: 왜 이 준비물이 나왔는지 보여 준다
function tagText(type) {
  if (type === "day") return selectedDay + "요일";
  if (type === "weather") return "비·눈";
  if (type === "custom") return "직접 추가";
  return "매일";
}

// ===== 화면 그리기 (DOM 변경) =====
function render() {
  // 선택 버튼: 고른 것만 aria-pressed="true"
  dayButtons.forEach(function (b) {
    b.setAttribute("aria-pressed", String(b.dataset.day === selectedDay));
  });
  weatherButtons.forEach(function (b) {
    b.setAttribute("aria-pressed", String(b.dataset.weather === selectedWeather));
  });

  // 조건 요약: 버튼 바로 아래에 "이 조건이라 생긴 준비물"을 보여 준다
  // (휴대폰에서는 목록이 화면 아래에 있어서, 요일·날씨를 바꿔도 결과가 안 보일 수 있기 때문)
  const condNames = (BASE_DATA.day[selectedDay] || []).concat(BASE_DATA.weather[selectedWeather] || []);
  const weatherWord = selectedWeather === "비/눈" ? "비·눈" : "맑음";
  condSummary.innerHTML = "";
  const head = document.createElement("strong");
  head.textContent = selectedDay + "요일 · " + weatherWord + " → ";
  // 이미 챙겨서 목록에서 지운 것은 "(챙김 ✓)"를 붙여, 아래 목록에 왜 없는지 알 수 있게 한다
  const condText = condNames.map(function (n) {
    return checkedNames.includes(n) ? n + "(챙김 ✓)" : n;
  });
  condSummary.append(head,
    (condNames.length > 0 ? "추가로 챙길 것: " + condText.join(", ") : "추가로 챙길 것 없음") +
    " / 매일: " + BASE_DATA.common.join(", "));

  // 목록을 비우고 배열 내용대로 다시 만든다
  itemList.innerHTML = "";
  let newCount = 0;
  checklist.forEach(function (item, index) {
    const li = document.createElement("li");
    // 바로 전 화면에 없던 줄만 3D 등장 효과 (줄마다 0.05초씩 늦게, 최대 0.15초까지만)
    if (shownNames === null || !shownNames.has(item.name)) {
      li.classList.add("enter");
      li.style.animationDelay = (Math.min(newCount, 3) * 50) + "ms";
      newCount++;
    }
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "item-btn" + (item.type === "custom" ? " custom" : "");
    btn.setAttribute("aria-label", item.name + " 챙김 (누르면 목록에서 지워져요)");

    const box = document.createElement("span");
    box.className = "box";
    box.setAttribute("aria-hidden", "true");
    const name = document.createElement("span");
    name.className = "item-name";
    name.textContent = item.name;     // textContent: 입력한 글자를 그대로 글자로만 보여 준다
    const tag = document.createElement("span");
    const isCond = item.type === "day" || item.type === "weather";
    tag.className = "tag " + (item.type === "custom" ? "custom" : (isCond ? "cond" : "base"));
    tag.textContent = tagText(item.type);

    btn.append(box, name, tag);
    btn.addEventListener("click", function () { checkItem(index); });
    li.appendChild(btn);

    // 직접 추가한 준비물에만 ✕(완전히 삭제) 버튼을 따로 붙인다
    if (item.type === "custom") {
      li.classList.add("custom-row");
      const del = document.createElement("button");
      del.type = "button";
      del.className = "del-btn";
      del.setAttribute("aria-label", "‘" + item.name + "’ 직접 추가 준비물 완전히 삭제");
      del.innerHTML = '<span aria-hidden="true">✕</span><small aria-hidden="true">삭제</small>';
      del.addEventListener("click", function () { deleteCustom(item.name); });
      li.appendChild(del);
    }
    itemList.appendChild(li);
  });
  shownNames = new Set(checklist.map(function (item) { return item.name; }));

  // 남은 개수와 완료 메시지
  remainText.textContent = "남은 준비물 " + checklist.length + "개";
  doneMsg.hidden = checklist.length !== 0;
  customCount.textContent = "직접 추가한 준비물 " + customItems.length + " / " + MAX_CUSTOM + "개 (✕ 삭제를 누르기 전까지 계속 남아요)";

  // 되돌리기 버튼: 되돌릴 것이 있을 때만 누를 수 있다
  if (undoStack.length > 0) {
    const last = undoStack[undoStack.length - 1];
    undoButton.disabled = false;
    undoHint.textContent = "방금 챙긴 ‘" + last + "’" +
      (undoStack.length > 1 ? "부터 " + undoStack.length + "개를 차례로 되살릴 수 있어요." : "을(를) 되살릴 수 있어요.");
  } else {
    undoButton.disabled = true;
    undoHint.textContent = "";
  }
}

// ===== 준비물 체크 =====
// 누른 항목을 splice로 배열에서 빼고, 챙긴 목록과 되돌리기 목록에 push한다 → 남은 개수가 1 줄어든다
function checkItem(index) {
  const removed = checklist.splice(index, 1)[0];   // index 위치에서 1개 지우기
  if (!removed) return;
  checkedNames.push(removed.name);
  undoStack.push(removed.name);
  if (undoStack.length > MAX_UNDO) undoStack.shift();  // 너무 많으면 가장 오래된 것부터 버린다
  addMsg.textContent = "";
  resetMsg.textContent = "";
  saveAndReport();
  render();
  // 다음 항목(없으면 되돌리기 버튼)으로 키보드 초점을 옮겨 준다
  const buttons = itemList.querySelectorAll(".item-btn");
  if (buttons.length > 0) {
    buttons[Math.min(index, buttons.length - 1)].focus();
  } else {
    undoButton.focus();
  }
}

// ===== 되돌리기 =====
// 가장 최근에 챙긴 이름을 pop으로 꺼내 "챙긴 목록"에서 빼면 다시 남은 목록에 나타난다.
// 여러 번 누르면 챙긴 순서의 반대로 하나씩 되살아난다.
undoButton.addEventListener("click", function () {
  const name = undoStack.pop();
  if (name === undefined) return;
  const pos = checkedNames.lastIndexOf(name);
  if (pos !== -1) checkedNames.splice(pos, 1);
  buildChecklist();
  saveAndReport();
  render();
  const visible = checklist.some(function (item) { return item.name === name; });
  undoHint.textContent = visible
    ? "‘" + name + "’을(를) 목록에 다시 넣었어요."
    : "‘" + name + "’을(를) 되살렸지만 지금 고른 요일·날씨 목록에는 없는 준비물이에요.";
  if (undoButton.disabled) {
    const first = itemList.querySelector(".item-btn");
    if (first) first.focus();
  }
});

// ===== 직접 추가 준비물 삭제 (✕) =====
// 챙김(오늘 목록에서만 사라짐)과 달리, 직접 추가 목록에서 완전히 지운다.
function deleteCustom(name) {
  customItems = customItems.filter(function (n) { return n !== name; });
  // 같은 이름의 체크·되돌리기 기록도 지운다 (지운 준비물이 되살아나지 않게)
  checkedNames = checkedNames.filter(function (n) { return n !== name; });
  undoStack = undoStack.filter(function (n) { return n !== name; });
  buildChecklist();
  saveAndReport();
  render();
  setAddMessage("‘" + name + "’을(를) 직접 추가 목록에서 삭제했어요.", "ok");
  addInput.focus();
}

// ===== 조건 바꾸기 =====
// 요일이나 날씨를 바꾸면 목록을 다시 만든다. 이미 챙긴 준비물은 그대로 빠져 있다.
dayButtons.forEach(function (b) {
  b.addEventListener("click", function () {
    selectedDay = b.dataset.day;
    dayNote.textContent = "";
    buildChecklist();
    saveAndReport();
    render();
  });
});
weatherButtons.forEach(function (b) {
  b.addEventListener("click", function () {
    selectedWeather = b.dataset.weather;
    buildChecklist();
    saveAndReport();
    render();
  });
});

// ===== 직접 추가 =====
function setAddMessage(text, kind) {
  addMsg.textContent = text;
  addMsg.className = "msg " + (kind ? "msg-" + kind : "");
}

addForm.addEventListener("submit", function (event) {
  event.preventDefault();               // 페이지가 새로고침되지 않게 막기
  resetMsg.textContent = "";
  const name = addInput.value.trim();   // 앞뒤 공백 제거 (공백만 쓰면 빈 칸)

  if (name === "") {
    addInput.setAttribute("aria-invalid", "true");
    setAddMessage("준비물 이름을 입력해 주세요", "error");
    addInput.focus();
    return;                             // 빈 항목은 추가하지 않는다
  }
  if (customItems.length >= MAX_CUSTOM) {
    addInput.setAttribute("aria-invalid", "true");
    setAddMessage("직접 추가는 " + MAX_CUSTOM + "개까지만 할 수 있어요. 필요 없는 준비물을 ✕ 삭제로 지운 뒤 추가해 주세요.", "error");
    return;
  }
  // 이미 목록에 있거나(이미 챙겨서 지운 기본 준비물 포함) 이미 추가한 이름이면 막는다
  const inList = checklist.some(function (item) { return item.name === name; }) ||
    currentBaseNames().includes(name);
  const inCustom = customItems.includes(name);
  if (inList || inCustom) {
    addInput.setAttribute("aria-invalid", "true");
    setAddMessage("‘" + name + "’은(는) 이미 목록에 있거나 이미 추가한 준비물이에요.", "error");
    return;
  }

  addInput.removeAttribute("aria-invalid");
  customItems.push(name);                        // 직접 추가 배열 끝에 넣기
  // 예전에 같은 이름을 챙김 처리한 기록이 있으면 풀어 준다 (새로 추가했으니 목록에 보여야 함)
  checkedNames = checkedNames.filter(function (n) { return n !== name; });
  undoStack = undoStack.filter(function (n) { return n !== name; });
  buildChecklist();
  addInput.value = "";

  const saved = saveAndReport();
  setAddMessage("‘" + name + "’을(를) 목록 맨 아래에 추가했어요." + (saved ? "" : " (저장 안 됨)"), "ok");
  render();
});

// 입력을 다시 시작하면 빨간 테두리를 지운다
addInput.addEventListener("input", function () {
  addInput.removeAttribute("aria-invalid");
});

// ===== 초기화 =====
function setDefaults() {
  const def = getDefaultDay();
  selectedDay = def.day;
  dayNote.textContent = def.note;
  selectedWeather = "맑음";
}

resetButton.addEventListener("click", function () {
  setDefaults();
  customItems = [];
  checkedNames = [];
  undoStack = [];
  // 이 프로그램의 키만 지운다 (localStorage.clear()는 쓰지 않음)
  let removed = true;
  if (!IN_PREVIEW_BOX) {
    try {
      localStorage.removeItem(STORAGE_KEY);
      localStorage.removeItem(TODAY_KEY);
    } catch (e) { removed = false; }
  }
  buildChecklist();
  setAddMessage("", "");
  addInput.value = "";
  addInput.removeAttribute("aria-invalid");
  saveNote.textContent = "";
  render();
  resetMsg.className = "msg msg-ok";
  resetMsg.textContent = removed
    ? "처음 상태로 되돌렸어요. 체크 내역과 직접 추가한 준비물도 지웠어요."
    : "처음 상태로 되돌렸어요.";
});

// ===== 시작 =====
setDefaults();
const loadResult = loadAll();
if (loadResult === "preview" || loadResult === "unavailable") {
  showStorageProblem(loadResult);
}
buildChecklist();
render();
</script>
</body>
</html>
