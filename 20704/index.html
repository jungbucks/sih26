<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>은행 대기표 호출 시스템</title>
<meta name="description" content="번호표를 뽑으면 큐(선입선출)에 줄을 서고, 직원이 호출하면 맨 앞 번호를 큰 글씨로 불러 주는 은행 창구 대기표 시스템">
<meta name="class" content="O반 (2-5)">
<meta name="status" content="PRD">
<style>
  /* ===== 색과 기본 글꼴 ===== */
  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --text: #1d2330;
    --muted: #5d6573;
    --line: #dde1e7;
    --accent: #1f4fa3;        /* 딥블루: 버튼·강조 하나만 */
    --accent-soft: #e8eefa;
    --call-bg: #fff4c2;       /* 호출 순간 바뀌는 바탕색 */
    --call-border: #c79400;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    font-size: 17px;
    line-height: 1.7;
    word-break: keep-all;
  }
  main { max-width: 44rem; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .lead { color: var(--muted); margin: 0 0 24px; }
  h2 { font-size: 1.1rem; margin: 0 0 12px; }

  .panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 16px;
  }

  /* ===== 호출 안내판 (화면 중앙, 아주 큰 글씨) ===== */
  .board {
    text-align: center;
    border: 3px solid var(--line);
    padding: 28px 16px;
    min-height: 11rem;
    display: flex; flex-direction: column; justify-content: center;
    transition: background-color .3s, border-color .3s;
  }
  .board-label { color: var(--muted); font-size: 1rem; margin: 0 0 8px; }
  .call-text {
    margin: 0;
    font-size: clamp(2.4rem, 11vw, 4rem);
    font-weight: 800;
    line-height: 1.3;
  }
  .call-text .num { color: var(--accent); }
  .board.is-calling { background: var(--call-bg); border-color: var(--call-border); }
  .board.is-empty .call-text { font-size: clamp(1.4rem, 6vw, 2rem); color: var(--text); }

  /* 반짝임: 움직임 줄이기 설정이 없을 때만 깜빡임 3번 */
  @media (prefers-reduced-motion: no-preference) {
    .board.flash { animation: blink .5s ease-in-out 3; }
    @keyframes blink {
      0%, 100% { background: var(--call-bg); }
      50% { background: #ffe066; }
    }
  }

  /* ===== 버튼 두 개 (고객용 / 직원용) ===== */
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  .actions .panel { margin-bottom: 0; }
  @media (max-width: 560px) { .actions { grid-template-columns: 1fr; } }
  .role { color: var(--muted); font-size: .95rem; margin: 0 0 8px; }
  button {
    font: inherit;
    font-size: 1.15rem;
    font-weight: 700;
    width: 100%;
    min-height: 56px;
    border-radius: 10px;
    cursor: pointer;
  }
  .btn-primary { background: var(--accent); color: #fff; border: 2px solid var(--accent); }
  .btn-primary:hover { background: #183f84; }
  .btn-outline { background: var(--surface); color: var(--accent); border: 2px solid var(--accent); }
  .btn-outline:hover { background: var(--accent-soft); }
  button:focus-visible { outline: 3px solid #f0b400; outline-offset: 2px; }
  .result { margin: 12px 0 0; min-height: 1.7em; }
  .result strong { font-size: 1.3rem; }

  /* ===== 현재 상태 ===== */
  .stats { display: flex; flex-wrap: wrap; gap: 8px 24px; margin: 0 0 8px; }
  .stats div { font-size: 1.05rem; }
  .stats b { font-size: 1.4rem; }
  .queue-line { color: var(--muted); margin: 0; overflow-wrap: anywhere; }

  /* ===== 최근 호출 목록 ===== */
  .recent { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 8px; }
  .recent li {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 4px 14px;
    font-weight: 700;
  }
  .recent li:first-child { border-color: var(--accent); color: var(--accent); }
  .empty-note { color: var(--muted); margin: 0; }
</style>
</head>
<body>
<main>
  <!-- ===== 화면 구조 ===== -->
  <h1>은행 대기표 호출 시스템</h1>
  <p class="lead">먼저 번호표를 뽑은 사람이 먼저 불려요. 줄 서기(큐, 선입선출)를 그대로 옮긴 프로그램입니다.</p>

  <section class="panel board is-empty" id="board" aria-labelledby="boardLabel">
    <p class="board-label" id="boardLabel">호출 안내</p>
    <p class="call-text" id="callText" role="status" aria-live="assertive">아직 호출한 고객이 없습니다</p>
  </section>

  <div class="actions">
    <section class="panel" aria-labelledby="customerTitle">
      <h2 id="customerTitle">고객용</h2>
      <p class="role">창구 이용 전에 번호표를 뽑아 주세요.</p>
      <button type="button" class="btn-primary" id="issueBtn">번호표 뽑기</button>
      <p class="result" id="issueResult" aria-live="polite"></p>
    </section>

    <section class="panel" aria-labelledby="staffTitle">
      <h2 id="staffTitle">직원용</h2>
      <p class="role">줄의 맨 앞 고객을 창구로 부릅니다.</p>
      <button type="button" class="btn-outline" id="callBtn">다음 고객 호출</button>
      <p class="result" id="callResult" aria-live="polite"></p>
    </section>
  </div>

  <section class="panel" aria-labelledby="statusTitle">
    <h2 id="statusTitle">현재 대기 상태</h2>
    <div class="stats">
      <div>남은 대기 인원 <b id="waitingCount">0</b>명</div>
      <div>마지막 발급 번호 <b id="lastIssued">-</b></div>
    </div>
    <p class="queue-line" id="queueLine">대기열(앞 → 뒤): 비어 있음</p>
  </section>

  <section class="panel" aria-labelledby="recentTitle">
    <h2 id="recentTitle">최근 호출 목록 <span class="role">(최대 5개, 왼쪽이 가장 최근)</span></h2>
    <p class="empty-note" id="recentEmpty">아직 호출 기록이 없습니다.</p>
    <ol class="recent" id="recentList"></ol>
  </section>
</main>

<script>
  // ===== 설정 =====
  const RECENT_MAX = 5;          // 최근 호출 목록에 보여 줄 최대 개수
  const FIRST_NUMBER = 1;        // 번호표 시작 번호

  // ===== 큐(Queue) 자료구조 =====
  // 뒤에 넣고(enqueue) 앞에서 꺼내는(dequeue) 선입선출 구조.
  // 배열 맨 앞을 지우는 대신 head(앞 위치)만 한 칸씩 옮겨서 빠르게 꺼낸다.
  class Queue {
    constructor() {
      this.items = [];
      this.head = 0;
    }
    enqueue(value) { this.items.push(value); }
    dequeue() {
      if (this.isEmpty()) return null;
      const value = this.items[this.head];
      this.head++;
      return value;
    }
    size() { return this.items.length - this.head; }
    isEmpty() { return this.size() === 0; }
    toArray() { return this.items.slice(this.head); }
  }

  // ===== 데이터·상태 =====
  const waitingQueue = new Queue();  // 기다리는 번호들
  let nextNumber = FIRST_NUMBER;     // 다음에 발급할 번호
  let lastIssued = null;             // 마지막으로 발급한 번호
  const recentCalls = [];            // 최근 호출 번호 (앞쪽이 최신)

  // ===== 처리 함수 =====
  // 번호표 발급: 번호를 하나 만들고 큐 뒤에 넣는다.
  // 자바스크립트는 클릭을 하나씩 차례로 처리하므로 연타해도 번호가 겹치거나 빠지지 않는다.
  function issueTicket() {
    const number = nextNumber;
    nextNumber++;
    waitingQueue.enqueue(number);
    lastIssued = number;
    return number;
  }

  // 다음 고객 호출: 큐 맨 앞 번호를 꺼낸다. 비어 있으면 null.
  function callNextCustomer() {
    const number = waitingQueue.dequeue();
    if (number === null) return null;
    recentCalls.unshift(number);
    if (recentCalls.length > RECENT_MAX) recentCalls.pop();
    return number;
  }

  // ===== 화면 갱신 =====
  const board = document.getElementById("board");
  const callText = document.getElementById("callText");
  const issueResult = document.getElementById("issueResult");
  const callResult = document.getElementById("callResult");
  const waitingCountEl = document.getElementById("waitingCount");
  const lastIssuedEl = document.getElementById("lastIssued");
  const queueLine = document.getElementById("queueLine");
  const recentList = document.getElementById("recentList");
  const recentEmpty = document.getElementById("recentEmpty");

  function renderStatus() {
    waitingCountEl.textContent = waitingQueue.size();
    lastIssuedEl.textContent = lastIssued === null ? "-" : lastIssued + "번";
    const list = waitingQueue.toArray();
    queueLine.textContent = list.length === 0
      ? "대기열(앞 → 뒤): 비어 있음"
      : "대기열(앞 → 뒤): " + list.map(n => n + "번").join(", ");
  }

  function renderRecent() {
    recentList.replaceChildren();
    recentCalls.forEach(n => {
      const li = document.createElement("li");
      li.textContent = n + "번";
      recentList.appendChild(li);
    });
    recentEmpty.hidden = recentCalls.length > 0;
  }

  // 호출 안내판에 큰 글씨로 표시하고 반짝이게 한다.
  function showCall(number) {
    callText.replaceChildren();
    const num = document.createElement("span");
    num.className = "num";
    num.textContent = number + "번";
    callText.append(num, " 고객님 창구로 오세요!");
    board.classList.remove("is-empty", "flash");
    board.classList.add("is-calling");
    void board.offsetWidth;          // 애니메이션을 처음부터 다시 시작하기 위한 트릭
    board.classList.add("flash");
  }

  function showNoCustomer() {
    board.classList.remove("is-calling", "flash");
    board.classList.add("is-empty");
    callText.textContent = "대기 중인 고객이 없습니다";
  }

  // ===== 이벤트 연결 =====
  document.getElementById("issueBtn").addEventListener("click", () => {
    const number = issueTicket();
    issueResult.replaceChildren();
    const strong = document.createElement("strong");
    strong.textContent = number + "번";
    issueResult.append("발급된 번호: ", strong, " (앞에 " + (waitingQueue.size() - 1) + "명 대기)");
    renderStatus();
  });

  document.getElementById("callBtn").addEventListener("click", () => {
    const number = callNextCustomer();
    if (number === null) {
      showNoCustomer();
      callResult.textContent = "안내: 대기 중인 고객이 없습니다. 번호표가 발급되면 다시 눌러 주세요.";
    } else {
      showCall(number);
      callResult.textContent = number + "번을 호출했습니다. 남은 대기 " + waitingQueue.size() + "명";
    }
    renderStatus();
    renderRecent();
  });

  renderStatus();
  renderRecent();
</script>
</body>
</html>
