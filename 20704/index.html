<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>은행 대기표 호출 시스템</title>
<meta name="description" content="번호표를 뽑으면 큐(선입선출)에 줄을 서고, 직원이 호출하면 맨 앞 번호를 전광판에 큰 글씨로 불러 주는 은행 창구 대기표 시스템">
<meta name="class" content="O반 (2-5)">
<meta name="status" content="1회 개선">
<style>
  /* ===== 색과 기본 글꼴 (은행 콘셉트: 네이비·블루) ===== */
  :root {
    --bg: #eef2f8;
    --surface: #ffffff;
    --text: #1d2330;
    --muted: #5d6573;
    --line: #d5dce8;
    --navy: #0f2b5c;          /* 은행 주 색상 */
    --accent: #1f4fa3;        /* 블루: 버튼·강조 */
    --accent-soft: #e8eefa;
    --led-bg: #05070d;        /* 전광판 바탕 (아주 어두움) */
    --led-text: #ffd23f;      /* 전광판 글자 (밝은 노랑) */
    --led-dim: #9fb3d9;
    --staff-bg: #2a2f3a;      /* 직원용 구역 (어두운 회색) */
    --staff-text: #eef1f6;
    --danger: #c0392b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    font-size: 17px;
    line-height: 1.7;
    word-break: keep-all;
  }
  main { max-width: 44rem; margin: 0 auto; padding: 16px 16px 48px; }
  h2 { font-size: 1.1rem; margin: 0 0 12px; }

  /* ===== 은행 헤더 ===== */
  .bank-header {
    background: var(--navy);
    color: #fff;
    display: flex; align-items: center; gap: 12px;
    padding: 14px 16px;
    border-radius: 14px;
    margin-bottom: 16px;
  }
  .bank-header svg { flex: none; }
  .bank-name { margin: 0; font-size: 1.35rem; line-height: 1.3; }
  .bank-name small { display: block; font-size: .9rem; font-weight: 400; color: #c7d4ee; }

  .panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 16px;
  }

  /* ===== 호출 전광판 (어두운 바탕 + 밝은 글자, 아주 큰 글씨) ===== */
  .board {
    text-align: center;
    background: var(--led-bg);
    border: 4px solid var(--navy);
    padding: 28px 16px;
    min-height: 11rem;
    display: flex; flex-direction: column; justify-content: center;
    transition: background-color .3s, border-color .3s;
  }
  .board-label { color: var(--led-dim); font-size: 1rem; margin: 0 0 8px; letter-spacing: .1em; }
  .call-text {
    margin: 0;
    font-size: clamp(2.4rem, 11vw, 4rem);
    font-weight: 800;
    line-height: 1.3;
    color: #ffffff;
  }
  .call-text .num { color: var(--led-text); font-variant-numeric: tabular-nums; }
  .board.is-calling { border-color: var(--led-text); }
  .board.is-empty .call-text { font-size: clamp(1.4rem, 6vw, 2rem); color: var(--led-dim); }

  /* 반짝임: 움직임 줄이기 설정이 없을 때만 깜빡임 3번 */
  @media (prefers-reduced-motion: no-preference) {
    .board.flash { animation: blink .5s ease-in-out 3; }
    @keyframes blink {
      0%, 100% { background: var(--led-bg); }
      50% { background: #1c3d7a; }
    }
  }

  /* ===== 고객용 구역 ===== */
  .zone-title { display: flex; align-items: center; gap: 8px; }
  .tag {
    font-size: .85rem; font-weight: 700;
    padding: 2px 10px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent);
  }
  .role { color: var(--muted); font-size: .95rem; margin: 0 0 8px; }
  button {
    font: inherit;
    font-size: 1.15rem;
    font-weight: 700;
    width: 100%;
    min-height: 56px;
    border-radius: 10px;
    cursor: pointer;
  }
  .btn-primary { background: var(--accent); color: #fff; border: 2px solid var(--accent); }
  .btn-primary:hover { background: #183f84; }
  button:focus-visible { outline: 3px solid #f0b400; outline-offset: 2px; }
  .result { margin: 12px 0 0; min-height: 1.7em; }
  .result strong { font-size: 1.3rem; }

  .stats { display: flex; flex-wrap: wrap; gap: 8px 24px; margin: 12px 0 8px; padding-top: 12px; border-top: 1px solid var(--line); }
  .stats div { font-size: 1.05rem; }
  .stats b { font-size: 1.4rem; }
  .queue-line { color: var(--muted); margin: 0; overflow-wrap: anywhere; }

  /* ===== 최근 호출 목록 ===== */
  .recent { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 8px; }
  .recent li {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 4px 14px;
    font-weight: 700;
  }
  .recent li:first-child { border-color: var(--accent); color: var(--accent); }
  .empty-note { color: var(--muted); margin: 0; }

  /* ===== 직원용 구역 (어두운 회색 박스로 확실히 구분) ===== */
  .staff {
    background: var(--staff-bg);
    color: var(--staff-text);
    border: 2px dashed #6b7487;
  }
  .staff .tag { background: #444b5a; color: #fff; }
  .staff .role { color: #b9c0cc; }
  .staff-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 560px) { .staff-buttons { grid-template-columns: 1fr; } }
  .btn-staff { background: #ffffff; color: var(--navy); border: 2px solid #ffffff; }
  .btn-staff:hover { background: #dfe6f3; }
  .btn-reset { background: transparent; color: #ffb4a8; border: 2px solid #ffb4a8; font-size: 1rem; }
  .btn-reset:hover { background: #3a2f33; }
  .staff .result { color: var(--staff-text); }

  /* 초기화 확인 상자 (confirm 창 대신 화면 안에서 묻기) */
  .confirm-box {
    margin-top: 12px;
    padding: 14px;
    border-radius: 10px;
    background: #3a2f33;
    border: 2px solid #ffb4a8;
  }
  .confirm-box p { margin: 0 0 10px; font-weight: 700; }
  .confirm-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn-danger { background: var(--danger); color: #fff; border: 2px solid var(--danger); min-height: 48px; font-size: 1rem; }
  .btn-cancel { background: transparent; color: var(--staff-text); border: 2px solid #8a93a5; min-height: 48px; font-size: 1rem; }

  .save-note { font-size: .9rem; color: var(--muted); margin: 8px 0 0; }
</style>
</head>
<body>
<main>
  <!-- ===== 은행 헤더 (로고 + 타이틀) ===== -->
  <header class="bank-header">
    <!-- 로고: 은행 건물 모양을 SVG로 직접 그림 -->
    <svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true">
      <circle cx="22" cy="22" r="21" fill="#ffffff"/>
      <path d="M22 9 L35 16 H9 Z" fill="#0f2b5c"/>
      <rect x="12" y="18" width="3" height="12" fill="#0f2b5c"/>
      <rect x="18" y="18" width="3" height="12" fill="#0f2b5c"/>
      <rect x="23" y="18" width="3" height="12" fill="#0f2b5c"/>
      <rect x="29" y="18" width="3" height="12" fill="#0f2b5c"/>
      <rect x="9" y="31" width="26" height="4" fill="#0f2b5c"/>
    </svg>
    <h1 class="bank-name">상일 은행 <small>순서 대기 안내</small></h1>
  </header>

  <!-- ===== 호출 전광판 ===== -->
  <section class="panel board is-empty" id="board" aria-labelledby="boardLabel">
    <p class="board-label" id="boardLabel">호출 안내</p>
    <p class="call-text" id="callText" role="status" aria-live="assertive">아직 호출한 고객이 없습니다</p>
  </section>

  <!-- ===== 고객용 구역 ===== -->
  <section class="panel" aria-labelledby="customerTitle">
    <h2 class="zone-title" id="customerTitle"><span class="tag">고객용</span> 번호표 발급</h2>
    <p class="role">창구 이용 전에 번호표를 뽑아 주세요.</p>
    <button type="button" class="btn-primary" id="issueBtn">번호표 뽑기</button>
    <p class="result" id="issueResult" aria-live="polite"></p>
    <div class="stats">
      <div>남은 대기 인원 <b id="waitingCount">0</b>명</div>
      <div>마지막 발급 번호 <b id="lastIssued">-</b></div>
    </div>
    <p class="queue-line" id="queueLine">대기열(앞 → 뒤): 비어 있음</p>
  </section>

  <!-- ===== 최근 호출 목록 ===== -->
  <section class="panel" aria-labelledby="recentTitle">
    <h2 id="recentTitle">최근 호출 목록 <span class="role">(최대 5개, 왼쪽이 가장 최근)</span></h2>
    <p class="empty-note" id="recentEmpty">아직 호출 기록이 없습니다.</p>
    <ol class="recent" id="recentList"></ol>
  </section>

  <!-- ===== 직원용 구역 (하단, 어두운 박스) ===== -->
  <section class="panel staff" aria-labelledby="staffTitle">
    <h2 class="zone-title" id="staffTitle"><span class="tag">직원 전용</span> 창구 관리</h2>
    <p class="role">고객은 누르지 마세요. 줄의 맨 앞 고객을 창구로 부릅니다.</p>
    <div class="staff-buttons">
      <button type="button" class="btn-staff" id="callBtn">다음 고객 호출</button>
      <button type="button" class="btn-reset" id="resetBtn" aria-controls="confirmBox" aria-expanded="false">영업 마감 / 대기열 초기화</button>
    </div>
    <!-- 초기화 확인: 전시판(iframe)에서는 confirm 창이 막혀서 화면 안에서 묻는다 -->
    <div class="confirm-box" id="confirmBox" role="alertdialog" aria-labelledby="confirmMsg" hidden>
      <p id="confirmMsg">정말 대기열을 초기화하시겠습니까? 대기 중인 번호와 호출 기록이 모두 지워지고 1번부터 다시 시작합니다.</p>
      <div class="confirm-buttons">
        <button type="button" class="btn-danger" id="confirmYes">초기화</button>
        <button type="button" class="btn-cancel" id="confirmNo">취소</button>
      </div>
    </div>
    <p class="result" id="callResult" aria-live="polite"></p>
  </section>

  <p class="save-note" id="saveNote" aria-live="polite"></p>
</main>

<script>
  // ===== 설정 =====
  const RECENT_MAX = 5;          // 최근 호출 목록에 보여 줄 최대 개수
  const FIRST_NUMBER = 1;        // 번호표 시작 번호
  const STORAGE_KEY = "sih26:20704:state";  // 저장 이름표 (다른 작품과 겹치지 않게 학번을 붙임)

  // ===== 큐(Queue) 자료구조 =====
  // 뒤에 넣고(enqueue) 앞에서 꺼내는(dequeue) 선입선출 구조.
  // 배열 맨 앞을 지우는 대신 head(앞 위치)만 한 칸씩 옮겨서 빠르게 꺼낸다.
  class Queue {
    constructor() {
      this.items = [];
      this.head = 0;
    }
    enqueue(value) { this.items.push(value); }
    dequeue() {
      if (this.isEmpty()) return null;
      const value = this.items[this.head];
      this.head++;
      return value;
    }
    size() { return this.items.length - this.head; }
    isEmpty() { return this.size() === 0; }
    toArray() { return this.items.slice(this.head); }
    clear() { this.items = []; this.head = 0; }
  }

  // ===== 데이터·상태 =====
  const waitingQueue = new Queue();  // 기다리는 번호들
  let nextNumber = FIRST_NUMBER;     // 다음에 발급할 번호
  let lastIssued = null;             // 마지막으로 발급한 번호
  const recentCalls = [];            // 최근 호출 번호 (앞쪽이 최신)

  // ===== 저장·불러오기 (localStorage) =====
  // 전시판 미리보기(sandbox iframe)에서는 저장이 막힌다. 그래도 프로그램은 그대로 작동한다.
  const saveNote = document.getElementById("saveNote");
  const inSandboxPreview = window.origin === "null" && location.protocol !== "file:";
  const BLOCKED_MSG = "이 미리보기 화면에서는 저장이 막혀 있어 새로고침하면 처음부터 시작해요. 저장하려면 '새 탭 실행'으로 열어 주세요.";

  // 양의 정수인지 검사 (저장 데이터가 이상할 때 대비)
  function isPositiveInt(n) { return Number.isInteger(n) && n > 0; }

  function saveState() {
    const data = {
      queue: waitingQueue.toArray(),
      nextNumber: nextNumber,
      lastIssued: lastIssued,
      recentCalls: recentCalls.slice()
    };
    const text = JSON.stringify(data);
    try {
      localStorage.setItem(STORAGE_KEY, text);
      // 정말 저장됐는지 다시 읽어서 확인
      if (localStorage.getItem(STORAGE_KEY) === text) {
        saveNote.textContent = "자동 저장됨: 새로고침해도 대기 상태가 유지돼요.";
      } else {
        saveNote.textContent = "저장을 확인하지 못했어요. 새로고침하면 대기 상태가 사라질 수 있어요.";
      }
    } catch (e) {
      saveNote.textContent = inSandboxPreview ? BLOCKED_MSG : "이 브라우저에서는 저장할 수 없어요. 새로고침하면 대기 상태가 사라져요.";
    }
  }

  // 저장된 상태를 불러온다. 빠진 값은 기본값으로, 이상한 값은 버린다.
  function loadState() {
    let text = null;
    try {
      text = localStorage.getItem(STORAGE_KEY);
    } catch (e) {
      saveNote.textContent = inSandboxPreview ? BLOCKED_MSG : "이 브라우저에서는 저장할 수 없어요. 새로고침하면 대기 상태가 사라져요.";
      return false;
    }
    if (text === null) return false;   // 저장된 것이 없음 → 처음 상태로 시작
    let data;
    try {
      data = JSON.parse(text);
    } catch (e) {
      data = null;
    }
    if (!data || typeof data !== "object") {
      saveNote.textContent = "저장된 기록을 읽지 못해 처음 상태로 보여 줘요. 번호표를 뽑으면 새 기록으로 저장돼요.";
      return false;
    }
    const queue = Array.isArray(data.queue) ? data.queue.filter(isPositiveInt) : [];
    const recent = Array.isArray(data.recentCalls) ? data.recentCalls.filter(isPositiveInt).slice(0, RECENT_MAX) : [];
    // 다음 번호는 이미 나온 번호들보다 커야 중복이 생기지 않는다
    const maxSeen = Math.max(0, ...queue, ...recent, isPositiveInt(data.lastIssued) ? data.lastIssued : 0);
    nextNumber = isPositiveInt(data.nextNumber) ? Math.max(data.nextNumber, maxSeen + 1) : maxSeen + 1;
    lastIssued = isPositiveInt(data.lastIssued) ? data.lastIssued : (maxSeen > 0 ? maxSeen : null);
    queue.forEach(n => waitingQueue.enqueue(n));
    recentCalls.push(...recent);
    saveNote.textContent = "저장된 대기 상태를 불러왔어요.";
    return true;
  }

  // 저장된 데이터를 지운다 (영업 마감 때만)
  function clearSaved() {
    try {
      localStorage.removeItem(STORAGE_KEY);
      return localStorage.getItem(STORAGE_KEY) === null;
    } catch (e) {
      return false;
    }
  }

  // ===== 처리 함수 =====
  // 번호표 발급: 번호를 하나 만들고 큐 뒤에 넣는다.
  // 자바스크립트는 클릭을 하나씩 차례로 처리하므로 연타해도 번호가 겹치거나 빠지지 않는다.
  function issueTicket() {
    const number = nextNumber;
    nextNumber++;
    waitingQueue.enqueue(number);
    lastIssued = number;
    return number;
  }

  // 다음 고객 호출: 큐 맨 앞 번호를 꺼낸다. 비어 있으면 null.
  function callNextCustomer() {
    const number = waitingQueue.dequeue();
    if (number === null) return null;
    recentCalls.unshift(number);
    if (recentCalls.length > RECENT_MAX) recentCalls.pop();
    return number;
  }

  // 영업 마감: 모든 상태를 처음으로 되돌린다.
  function resetAll() {
    waitingQueue.clear();
    nextNumber = FIRST_NUMBER;
    lastIssued = null;
    recentCalls.length = 0;
  }

  // ===== 화면 갱신 =====
  const board = document.getElementById("board");
  const callText = document.getElementById("callText");
  const issueResult = document.getElementById("issueResult");
  const callResult = document.getElementById("callResult");
  const waitingCountEl = document.getElementById("waitingCount");
  const lastIssuedEl = document.getElementById("lastIssued");
  const queueLine = document.getElementById("queueLine");
  const recentList = document.getElementById("recentList");
  const recentEmpty = document.getElementById("recentEmpty");
  const resetBtn = document.getElementById("resetBtn");
  const confirmBox = document.getElementById("confirmBox");

  function renderStatus() {
    waitingCountEl.textContent = waitingQueue.size();
    lastIssuedEl.textContent = lastIssued === null ? "-" : lastIssued + "번";
    const list = waitingQueue.toArray();
    queueLine.textContent = list.length === 0
      ? "대기열(앞 → 뒤): 비어 있음"
      : "대기열(앞 → 뒤): " + list.map(n => n + "번").join(", ");
  }

  function renderRecent() {
    recentList.replaceChildren();
    recentCalls.forEach(n => {
      const li = document.createElement("li");
      li.textContent = n + "번";
      recentList.appendChild(li);
    });
    recentEmpty.hidden = recentCalls.length > 0;
  }

  // 전광판에 큰 글씨로 표시한다. flash가 true면 반짝이게 한다.
  function showCall(number, flash) {
    callText.replaceChildren();
    const num = document.createElement("span");
    num.className = "num";
    num.textContent = number + "번";
    callText.append(num, " 고객님 창구로 오세요!");
    board.classList.remove("is-empty", "flash");
    board.classList.add("is-calling");
    if (!flash) return;
    void board.offsetWidth;          // 애니메이션을 처음부터 다시 시작하기 위한 트릭
    board.classList.add("flash");
  }

  function showBoardMessage(message) {
    board.classList.remove("is-calling", "flash");
    board.classList.add("is-empty");
    callText.textContent = message;
  }

  function openConfirm(open) {
    confirmBox.hidden = !open;
    resetBtn.setAttribute("aria-expanded", String(open));
  }

  // ===== 이벤트 연결 =====
  document.getElementById("issueBtn").addEventListener("click", () => {
    const number = issueTicket();
    issueResult.replaceChildren();
    const strong = document.createElement("strong");
    strong.textContent = number + "번";
    issueResult.append("발급된 번호: ", strong, " (앞에 " + (waitingQueue.size() - 1) + "명 대기)");
    renderStatus();
    saveState();
  });

  document.getElementById("callBtn").addEventListener("click", () => {
    const number = callNextCustomer();
    if (number === null) {
      showBoardMessage("대기 중인 고객이 없습니다");
      callResult.textContent = "안내: 대기 중인 고객이 없습니다. 번호표가 발급되면 다시 눌러 주세요.";
    } else {
      showCall(number, true);
      callResult.textContent = number + "번을 호출했습니다. 남은 대기 " + waitingQueue.size() + "명";
      saveState();
    }
    renderStatus();
    renderRecent();
  });

  // 영업 마감 버튼: 바로 지우지 않고 확인 상자를 먼저 연다
  resetBtn.addEventListener("click", () => {
    openConfirm(confirmBox.hidden);
    if (!confirmBox.hidden) document.getElementById("confirmNo").focus();
  });

  document.getElementById("confirmNo").addEventListener("click", () => {
    openConfirm(false);
    callResult.textContent = "초기화를 취소했어요. 대기열은 그대로입니다.";
    resetBtn.focus();
  });

  document.getElementById("confirmYes").addEventListener("click", () => {
    resetAll();
    const cleared = clearSaved();
    openConfirm(false);
    showBoardMessage("아직 호출한 고객이 없습니다");
    issueResult.textContent = "";
    callResult.textContent = "영업을 마감하고 대기열을 초기화했어요. 다음 번호표는 1번부터 발급됩니다.";
    if (cleared) saveNote.textContent = "저장된 기록도 지웠어요.";
    renderStatus();
    renderRecent();
    resetBtn.focus();
  });

  // ===== 시작: 저장된 상태가 있으면 이어서 보여 준다 =====
  if (loadState() && recentCalls.length > 0) {
    showCall(recentCalls[0], false);   // 새로고침 직후에는 반짝이지 않고 마지막 호출만 표시
  }
  renderStatus();
  renderRecent();
</script>
</body>
</html>
