name: Build and publish exhibition
on:
  push:
  workflow_dispatch:
    inputs:
      force:
        description: "일반 갱신: 빈 값 / 특정 학번: 20100 / 전체: all"
        required: false
        default: ""
permissions:
  contents: read
concurrency:
  group: sih26-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:6446946a1d9fd62d9ae501312a2d76a43ee688542b21622056a372959b65d63d
      options: --init --ipc=host
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
      - run: npm ci
      - run: test -n "$(fc-list :lang=ko -f '%{file}')"
      - uses: actions/cache@v4
        with:
          path: .cache/thumbnails
          key: shots-v1-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: shots-v1-${{ runner.os }}-
      - run: npm test
      - run: npm run build
        env:
          FORCE_CAPTURE: ${{ inputs.force || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-report
          path: .cache/build-report.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check Pages settings
        uses: actions/github-script@v7
        with:
          script: |
            const settingsUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/settings/pages`;
            try {
              const site = await github.rest.repos.getPages(context.repo);
              if (site.data.build_type !== 'workflow') {
                core.setFailed(`Pages의 Source를 GitHub Actions로 설정한 뒤 다시 실행하세요: ${settingsUrl}`);
              }
            } catch (error) {
              if (error.status !== 404) throw error;
              core.setFailed(`GitHub Pages 사이트를 찾을 수 없습니다. ${settingsUrl} 에서 Pages 사용 가능 여부와 Source = GitHub Actions 설정을 확인한 뒤 다시 실행하세요. 브랜치 보호를 해제할 필요는 없습니다.`);
            }
      - name: Check latest default-branch commit
        uses: actions/github-script@v7
        with:
          script: |
            const repo = await github.rest.repos.get(context.repo);
            const branch = repo.data.default_branch;
            if (context.ref !== `refs/heads/${branch}`) throw new Error('Default branch only');
            const current = await github.rest.repos.getCommit({...context.repo, ref: branch});
            if (current.data.sha !== context.sha) throw new Error('Newer commit exists; skip outdated deployment');
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report publication
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          printf '## 게시 완료\n- 커밋: %s\n- 공개 주소: %s\n' "$GITHUB_SHA" "$PAGE_URL" >> "$GITHUB_STEP_SUMMARY"
