<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스택 기반 게임 플레이 최근 기록기</title>
<meta name="description" content="게임 플레이 기록을 스택(후입선출)으로 쌓고, 가장 최근 기록부터 되돌리는 기록기">
<meta name="class" content="O반 (2-5)">
<meta name="status" content="3회 개선">
<meta name="design" content="컬러셋 C5 안개와 청록(어두운 바탕) · 트렌드 T03 다크 테크 · #14b8a6">
<style>
  /* 디자인: 컬러셋 '안개와 청록(어두운 바탕)' + 트렌드 '다크 테크'
     거의 검은 바탕에 은은한 빛, 결과(기록 목록)가 주인공.
     성공(초록)/실패(빨강)/진행 중(노랑) 구분 색은 같은 계열로 유지해요.
     (성공 초록은 청록 강조색과 헷갈리지 않게 더 밝게 바꿨어요) */
  @font-face { font-family: "Wanted Sans"; src: url("../assets/fonts/WantedSansVariable.woff2") format("woff2"); font-weight: 400 1000; font-display: swap; }
  :root {
    color-scheme: dark;
    --bg: #0d0f14;
    --surface: #161a22;     /* 카드 바탕 */
    --field: #161a22;       /* 입력칸 바탕 */
    --line: #2a2f3a;        /* 옅은 구분선 */
    --line-strong: #a3a9b6; /* 입력칸·보조 버튼 테두리 */
    --text: #f3f4f6;
    --muted: #a3a9b6;
    --accent: #14b8a6;      /* 가장 중요한 버튼·핵심 결과 */
    --accent-ink: #111111;  /* 강조색 버튼 글자 */
    --accent-text: #5eead4; /* 어두운 바탕 위 강조 글자 */
    --result-block: #12302d;/* 결과 카드 색 블록 */
    --top-edge: inset 0 1px 0 rgba(255,255,255,.08);
    --ok: #a6eebd;
    --ok-weak: #15301f;
    --fail: #ff8a78;
    --fail-weak: #3a1a16;
    --going: #f0c25a;
    --going-weak: #3a2d0e;
    /* 기록 카드 테두리: 상태별로 은은하게 (글자색보다 어둡게 눌러서 과하지 않게) */
    --edge-ok: #2c8c82;     /* 성공 = 은은한 청록 */
    --edge-fail: #a3524a;   /* 실패 = 은은한 빨강 */
    --edge-going: #a3843c;  /* 진행 중 = 은은한 노랑 */
    --edge-pin: #f3f4f6;    /* 고정 = 밝은 흰색 */
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Wanted Sans", system-ui, -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    font-size: 17px;
    line-height: 1.7;
    word-break: keep-all;
    overflow-wrap: anywhere;
    font-variant-numeric: tabular-nums; /* 숫자 폭을 맞춰 계기판처럼 */
  }
  .wrap { max-width: 960px; margin: 0 auto; padding: 32px 16px 48px; }
  /* 빛 1: 제목 뒤 아주 옅은 청록 번짐 */
  header {
    padding: 20px 16px;
    margin: -20px -16px 0;
    border-radius: 12px;
    background: radial-gradient(ellipse 70% 100% at 0% 0%, rgba(20,184,166,.14), transparent 70%);
  }
  header h1 { font-size: 1.5rem; margin: 0 0 6px; line-height: 1.4; }
  header p { margin: 0; color: var(--muted); }

  .main {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr);
    gap: 20px;
    margin-top: 24px;
  }
  @media (max-width: 720px) { .main { grid-template-columns: minmax(0, 1fr); } }

  .panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 20px;
    box-shadow: var(--top-edge); /* 카드 위쪽 가장자리만 1px 밝은 선 */
  }
  /* 빛 2: 결과 화면(기록 목록) 카드 뒤에만 은은한 청록 빛 */
  .panel[aria-labelledby="listTitle"] {
    box-shadow: var(--top-edge), 0 0 48px color-mix(in srgb, #14b8a6 30%, transparent);
  }
  .panel h2 { font-size: 1.1rem; margin: 0 0 12px; }

  label, .legend { display: block; font-weight: 600; margin-bottom: 6px; }
  fieldset { border: 0; padding: 0; margin: 16px 0 0; }
  input[type="text"] {
    width: 100%;
    font: inherit;
    padding: 10px 12px;
    border: 1px solid var(--line-strong);
    border-radius: 8px;
    background: var(--field);
    color: var(--text);
  }
  input[type="text"]::placeholder { color: var(--muted); }
  input[type="text"]:focus-visible, button:focus-visible, .radio input:focus-visible + span {
    outline: 3px solid var(--accent-text); outline-offset: 2px;
  }
  .hint { font-size: 0.9rem; color: var(--muted); margin-top: 4px; }
  .radios { display: flex; flex-wrap: wrap; gap: 8px; }
  .radio { position: relative; }
  .radio input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .radio span {
    display: inline-block;
    padding: 6px 14px;
    border: 1px solid var(--line-strong);
    border-radius: 999px;
    background: var(--field);
    cursor: pointer;
  }
  .radio input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

  button {
    font: inherit;
    font-weight: 600;
    padding: 10px 16px;
    border-radius: 8px;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: var(--accent-ink);
    cursor: pointer;
    min-height: 44px;
  }
  button.secondary { background: transparent; color: var(--text); border-color: var(--line-strong); }
  button.danger { background: transparent; color: var(--fail); border-color: var(--fail); }
  button:disabled { background: transparent; color: var(--muted); border-color: var(--line); opacity: .55; cursor: not-allowed; }
  #addBtn { width: 100%; margin-top: 18px; }

  .msg { margin: 12px 0 0; padding: 10px 12px; border-radius: 8px; font-size: 0.95rem; }
  .msg:empty { display: none; }
  .msg.error { background: var(--fail-weak); color: var(--fail); border: 1px solid #6b2c24; }
  .msg.info { background: var(--bg); color: var(--accent-text); border: 1px solid var(--line); }

  /* 스택 그림: 위가 열린 통 모양, 맨 위 = 가장 최근 */
  .stack-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .count { color: var(--muted); font-size: 0.95rem; }
  .stack {
    list-style: none;
    margin: 8px 0 0;
    padding: 10px;
    border: 2px solid var(--line-strong);
    border-top: 2px dashed var(--line-strong);
    border-radius: 0 0 12px 12px;
    background: var(--bg);
    min-height: 140px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .card {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 4px 10px;
    align-items: center;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
  }
  /* 맨 위(가장 최근) 기록 = 핵심 결과: 청록 색 블록 (테두리는 상태 색을 따라요) */
  .card.top { background: var(--result-block); }
  /* 상태별 테두리 */
  .card.ok { border-color: var(--edge-ok); }
  .card.fail { border-color: var(--edge-fail); }
  .card.going { border-color: var(--edge-going); }
  .card .title { font-weight: 600; }
  .card .detail { grid-column: 1 / -1; font-size: 0.92rem; color: var(--going); }
  .card .time { grid-column: 1 / -1; font-size: 0.88rem; color: var(--muted); }
  .top-mark { font-size: 0.8rem; font-weight: 700; color: var(--accent-text); margin-right: 6px; }
  .tag { font-size: 0.88rem; font-weight: 600; padding: 2px 10px; border-radius: 999px; white-space: nowrap; }
  .tag.ok { background: var(--ok-weak); color: var(--ok); }
  .tag.fail { background: var(--fail-weak); color: var(--fail); }
  .tag.going { background: var(--going-weak); color: var(--going); }
  .empty { color: var(--muted); text-align: center; padding: 28px 8px; }

  /* 새 카드가 위에서 내려앉는 짧은 효과 (한 번만) */
  .card.new { animation: drop 0.35s ease-out; }
  @keyframes drop { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .card.new { animation: none; } }

  .bottom { margin-top: 20px; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; }
  .confirm {
    margin-top: 12px;
    padding: 14px;
    border: 1px solid #6b2c24;
    background: var(--fail-weak);
    border-radius: 10px;
  }
  .confirm p { margin: 0 0 10px; font-weight: 600; }
  .confirm .row { display: flex; flex-wrap: wrap; gap: 8px; }
  .cheer { margin: 14px 0 0; padding: 12px 14px; border-left: 4px solid var(--line-strong); background: var(--bg); border-radius: 0 8px 8px 0; }
  .summary { margin: 10px 0 0; color: var(--muted); font-size: 0.95rem; }
  .save-note { margin: 8px 0 0; font-size: 0.9rem; color: var(--muted); }
  #detailWrap { margin-top: 14px; }
  #detailWrap[hidden] { display: none; }
  /* 카드 안 버튼(고정·수정·삭제) */
  /* 고정 + 상태가 겹치면: 바깥 테두리는 흰색(고정), 바로 안쪽에 1px 띄운 상태 색 선을 한 줄 더 */
  .card.pinned { border-color: var(--edge-pin); --edge-in: var(--edge-going); box-shadow: inset 0 0 0 1px var(--surface), inset 0 0 0 2px var(--edge-in); }
  .card.pinned.ok { --edge-in: var(--edge-ok); }
  .card.pinned.fail { --edge-in: var(--edge-fail); }
  .card.top.pinned { box-shadow: inset 0 0 0 1px var(--result-block), inset 0 0 0 2px var(--edge-in); }
  /* 카드 안 삭제 재확인 줄 */
  .del-confirm { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin-top: 4px; padding: 8px 10px; border: 1px solid #6b2c24; border-radius: 8px; background: var(--fail-weak); }
  .del-confirm p { margin: 0; flex: 1 1 100%; font-size: 0.92rem; font-weight: 600; color: var(--text); }
  .del-confirm button { min-height: 36px; padding: 4px 12px; font-size: 0.9rem; }
  .pin-mark { font-size: 0.8rem; font-weight: 700; color: var(--going); margin-right: 6px; }
  .card .actions { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .card .actions button { min-height: 36px; padding: 4px 12px; font-size: 0.9rem; }
  button.ghost { background: transparent; color: var(--text); border-color: var(--line-strong); }
  button.ghost[aria-pressed="true"] { color: var(--going); border-color: var(--going); background: var(--going-weak); }
  .edit-box { grid-column: 1 / -1; margin-top: 6px; padding: 10px; border: 1px dashed var(--line-strong); border-radius: 8px; background: var(--bg); }
  .edit-box fieldset { margin: 0; }
  .edit-box .legend { font-size: 0.95rem; }
  .edit-box .edit-detail { margin-top: 10px; }
  .edit-box .edit-detail[hidden] { display: none; }
  .edit-box .msg { margin-top: 8px; }
  .edit-box .actions { margin-top: 10px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<div class="wrap">
  <!-- 상단: 제목과 설명 -->
  <header>
    <h1>스택 기반 게임 플레이 최근 기록기</h1>
    <p>플레이한 게임을 기록하면 가장 최근 기록이 맨 위에 쌓여요. 실수했다면 맨 위 기록부터 하나씩 되돌릴 수 있어요. (나중에 넣은 것이 먼저 나가는 스택 구조)</p>
  </header>

  <div class="main">
    <!-- 중앙 좌측: 입력 폼 -->
    <section class="panel" aria-labelledby="formTitle">
      <h2 id="formTitle">플레이 기록 추가 (Push)</h2>
      <form id="recordForm" novalidate>
        <label for="gameTitle">게임명 (20자 이내)</label>
        <input type="text" id="gameTitle" maxlength="20" autocomplete="off" placeholder="예: 마인크래프트" aria-describedby="titleHint formMsg">
        <div class="hint" id="titleHint"><span id="charCount">0</span> / 20자</div>

        <fieldset>
          <legend class="legend">플레이 결과</legend>
          <div class="radios">
            <label class="radio"><input type="radio" name="gameResult" value="성공" checked><span>성공</span></label>
            <label class="radio"><input type="radio" name="gameResult" value="실패"><span>실패</span></label>
            <label class="radio"><input type="radio" name="gameResult" value="진행 중"><span>진행 중</span></label>
          </div>
        </fieldset>

        <!-- '진행 중'을 고르면 나타나는 세부 내용 입력란 (선택 사항) -->
        <div id="detailWrap" hidden>
          <label for="gameDetail">진행 중인 내용 (선택, 30자 이내)</label>
          <input type="text" id="gameDetail" maxlength="30" autocomplete="off" placeholder="예: 3장 보스 직전" aria-describedby="detailHint">
          <div class="hint" id="detailHint"><span id="detailCount">0</span> / 30자 · 비워 두어도 괜찮아요</div>
        </div>

        <button type="submit" id="addBtn">기록 추가</button>
        <p class="msg" id="formMsg" role="alert"></p>
      </form>
    </section>

    <!-- 중앙 우측: 스택 모양의 최근 기록 목록 -->
    <section class="panel" aria-labelledby="listTitle">
      <div class="stack-head">
        <h2 id="listTitle" tabindex="-1">오늘의 도전 기록</h2>
        <span class="count" id="countText">0 / 30개</span>
      </div>
      <ol class="stack" id="stackList" aria-label="최근 기록 목록, 맨 위가 가장 최근"></ol>
      <p class="summary" id="summaryText"></p>
    </section>
  </div>

  <!-- 하단: 삭제·초기화 버튼, 확인 창, 응원 문구 -->
  <section class="panel bottom" aria-labelledby="ctrlTitle">
    <h2 id="ctrlTitle">되돌리기와 초기화</h2>
    <div class="controls">
      <button type="button" class="secondary" id="popBtn">최근 기록 삭제 (Pop)</button>
      <button type="button" class="danger" id="resetBtn">전체 초기화</button>
    </div>

    <!-- 알림창 대신 쓰는 화면 안 확인 상자 -->
    <div class="confirm" id="confirmBox" hidden role="alertdialog" aria-labelledby="confirmText">
      <p id="confirmText"></p>
      <div class="row">
        <button type="button" class="danger" id="confirmYes">예, 삭제할게요</button>
        <button type="button" class="secondary" id="confirmNo">취소</button>
      </div>
    </div>

    <p class="cheer" id="cheerText" aria-live="polite">오늘의 도전을 기록해 보세요.</p>
    <p class="save-note" id="saveNote"></p>
  </section>
</div>

<script>
// ===== 예시 데이터·설정 =====
const STORAGE_KEY = "sih26:20805:stack"; // localStorage 저장 이름 (이 작품 전용)
const MAX_RECORDS = 30;   // 최대 기록 수
const MAX_TITLE = 20;     // 게임명 최대 글자 수
const MAX_DETAIL = 30;    // '진행 중' 세부 내용 최대 글자 수
const RESULTS = ["성공", "실패", "진행 중"];

// 처음 열었을 때 보여 줄 가상 예시 기록 (배열의 끝 = 스택의 맨 위)
const SAMPLE_RECORDS = [
  { title: "리그 오브 레전드", result: "성공", time: "2026-10-12T19:30:00" },
  { title: "원신 퀘스트", result: "진행 중", detail: "", time: "2026-10-12T21:10:00" }
];

// 응원 문구: 결과를 평가하지 않고 다음 도전을 응원해요
const CHEER_FAIL = [
  "다음번에 더 잘할 수 있어요!",
  "실패는 성공의 어머니!",
  "도전한 것 자체가 기록이에요. 잠깐 쉬어 가도 괜찮아요.",
  "어려운 판일수록 다음 판이 기대돼요."
];
const CHEER_OTHER = {
  "성공": ["성공 기록이 하나 쌓였어요.", "오늘의 도전이 잘 마무리됐네요."],
  "진행 중": ["진행 중인 도전도 소중한 기록이에요.", "이어서 할 때 이 기록을 확인해 보세요."]
};

// ===== 데이터·상태 =====
// stack: 기록을 담는 배열. 배열의 마지막 칸이 스택의 '맨 위(top)'예요.
let stack = [];
let canSave = true;        // localStorage를 쓸 수 있는지
let pendingAction = null;  // 확인 상자에서 '예'를 누르면 실행할 일 ("pop" 또는 "reset")
let justPushed = false;    // 방금 추가했는지 (새 카드 효과용)
let editingIndex = -1;     // 지금 수정 중인 기록의 배열 위치 (-1 = 없음)
let editError = "";        // 수정 상자에 보여 줄 안내
let confirmDelIndex = -1;  // 카드 안에서 '정말 삭제?'를 묻는 중인 기록의 배열 위치 (-1 = 없음)

// ===== 처리 함수 =====

// 저장된 기록 불러오기. 저장소를 못 쓰면 예시 데이터로 시작해요.
function loadStack() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved === null) return SAMPLE_RECORDS.slice(); // 처음 방문
    const data = JSON.parse(saved);
    if (!Array.isArray(data)) return SAMPLE_RECORDS.slice();
    // 형식이 맞는 기록만 남겨요
    // 이전 버전 기록에는 detail(세부 내용)이 없어요 → 빈 글자로 채워서 그대로 살려요
    return data
      .filter(r => r && typeof r.title === "string" && RESULTS.includes(r.result))
      .map(r => ({
        title: r.title,
        result: r.result,
        pinned: r.pinned === true, // 이전 버전 기록에는 고정 정보가 없어요 → 고정 안 됨으로 시작
        detail: (r.result === "진행 중" && typeof r.detail === "string") ? cutText(r.detail, MAX_DETAIL) : "",
        time: r.time
      }))
      .slice(-MAX_RECORDS);
  } catch (e) {
    canSave = false;
    return SAMPLE_RECORDS.slice();
  }
}

// 글자 수 세기: 이모지처럼 두 칸짜리 문자도 한 글자로 세요
function countChars(text) { return Array.from(text).length; }
// 글자 수 자르기: max 글자까지만 남겨요
function cutText(text, max) { return Array.from(text).slice(0, max).join(""); }

// 현재 스택을 저장하기 (실패해도 프로그램은 계속 작동)
function saveStack() {
  if (!canSave) return;
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(stack));
  } catch (e) {
    canSave = false;
  }
}

/*
  Push (넣기)
  - 새 기록을 스택의 맨 위(배열의 끝)에 올려요.
  - 스택은 후입선출(LIFO: Last-In-First-Out) 구조라서,
    나중에 넣은 기록이 맨 위에 놓이고 가장 먼저 꺼내져요.
  - 성공하면 null, 문제가 있으면 안내 문구를 돌려줘요.
*/
function pushRecord(title, result, detail) {
  const clean = title.trim();
  if (clean === "") return "게임명을 입력해 주세요.";
  if (countChars(clean) > MAX_TITLE) return "게임명은 20자 이내로 입력해 주세요.";
  if (!RESULTS.includes(result)) return "플레이 결과를 선택해 주세요.";
  if (stack.length >= MAX_RECORDS) {
    return "기록은 최대 30개까지 저장돼요. 카드의 '삭제', '최근 기록 삭제'나 '전체 초기화'로 자리를 만든 뒤 추가해 주세요.";
  }
  // 세부 내용은 '진행 중'일 때만 남겨요 (선택 사항이라 비어 있어도 괜찮아요)
  const cleanDetail = result === "진행 중" ? (detail || "").trim() : "";
  if (countChars(cleanDetail) > MAX_DETAIL) return "진행 중인 내용은 30자 이내로 입력해 주세요.";
  stack.push({ title: clean, result: result, detail: cleanDetail, pinned: false, time: new Date().toISOString() });
  saveStack();
  return null;
}

/*
  Pop (꺼내기)
  - 스택의 맨 위(가장 최근 기록) 하나만 꺼내서 지워요.
  - 중간이나 맨 아래 기록은 건드리지 않아요. 이것이 '최근 작업부터 되돌리기(Undo)'예요.
*/
function popRecord() {
  if (stack.length === 0) return null; // 비어 있으면 꺼낼 게 없어요
  const removed = stack.pop();
  saveStack();
  return removed;
}

/*
  중간 기록 삭제
  - 카드의 '삭제' 버튼을 누르면 그 카드 안에서 한 번 더 묻고, '예, 삭제'를 눌러야 지워요.
  - 스택의 원래 규칙(맨 위만 꺼내기)과 달리 중간에서도 빼낼 수 있는 예외 기능이에요.
*/
function deleteAt(index) {
  if (index < 0 || index >= stack.length) return null;
  const removed = stack.splice(index, 1)[0];
  saveStack();
  return removed;
}

// 기록의 결과·세부 내용 수정 (게임명과 기록 시간은 그대로)
function editAt(index, result, detail) {
  if (index < 0 || index >= stack.length) return "수정할 기록을 찾지 못했어요.";
  if (!RESULTS.includes(result)) return "플레이 결과를 선택해 주세요.";
  const cleanDetail = result === "진행 중" ? (detail || "").trim() : "";
  if (countChars(cleanDetail) > MAX_DETAIL) return "진행 중인 내용은 30자 이내로 입력해 주세요.";
  stack[index].result = result;
  stack[index].detail = cleanDetail;
  saveStack();
  return null;
}

// 고정(📌) 켜기/끄기. 배열 안 위치는 그대로라서 해제하면 원래 순서 자리로 돌아가요.
function togglePin(index) {
  if (index < 0 || index >= stack.length) return;
  stack[index].pinned = !stack[index].pinned;
  saveStack();
}

// 화면에 보여 줄 순서: 고정된 기록 먼저(최근순), 그다음 나머지(최근순)
function displayOrder() {
  const pinned = [], normal = [];
  for (let i = stack.length - 1; i >= 0; i--) (stack[i].pinned ? pinned : normal).push(i);
  return pinned.concat(normal);
}

// 전체 초기화: 스택을 비우고, 이 작품이 저장한 값만 지워요 (다른 저장값은 그대로)
function resetAll() {
  stack = [];
  // 빈 배열을 저장해 두면 다시 열어도 예시 데이터가 돌아오지 않아요
  saveStack();
}

// 무작위 응원 문구 고르기
function pickCheer(result) {
  const list = result === "실패" ? CHEER_FAIL : CHEER_OTHER[result];
  return list[Math.floor(Math.random() * list.length)];
}

// 저장된 시간을 "10월 12일 오후 7:30" 모양으로 바꾸기
function formatTime(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return "";
  return d.toLocaleString("ko-KR", { month: "long", day: "numeric", hour: "numeric", minute: "2-digit" });
}

// ===== 화면 갱신 =====
const els = {
  form: document.getElementById("recordForm"),
  title: document.getElementById("gameTitle"),
  charCount: document.getElementById("charCount"),
  detailWrap: document.getElementById("detailWrap"),
  detail: document.getElementById("gameDetail"),
  detailCount: document.getElementById("detailCount"),
  formMsg: document.getElementById("formMsg"),
  list: document.getElementById("stackList"),
  count: document.getElementById("countText"),
  summary: document.getElementById("summaryText"),
  popBtn: document.getElementById("popBtn"),
  resetBtn: document.getElementById("resetBtn"),
  confirmBox: document.getElementById("confirmBox"),
  confirmText: document.getElementById("confirmText"),
  confirmYes: document.getElementById("confirmYes"),
  confirmNo: document.getElementById("confirmNo"),
  cheer: document.getElementById("cheerText"),
  saveNote: document.getElementById("saveNote"),
  listTitle: document.getElementById("listTitle")
};

function resultClass(result) {
  return result === "성공" ? "ok" : result === "실패" ? "fail" : "going";
}

// 스택을 화면에 그리기: 배열의 끝(맨 위)부터 거꾸로 보여 줘요
function renderStack() {
  els.list.textContent = "";
  if (stack.length === 0) {
    const li = document.createElement("li");
    li.className = "empty";
    li.textContent = "기록이 비어 있어요. 게임명을 입력해 첫 기록을 추가해 보세요.";
    els.list.appendChild(li);
  }
  displayOrder().forEach(function (i) {
    const rec = stack[i];
    const isTop = i === stack.length - 1;
    const li = document.createElement("li");
    li.className = "card " + resultClass(rec.result) + (isTop ? " top" : "") + (rec.pinned ? " pinned" : "") + (isTop && justPushed ? " new" : "");

    const title = document.createElement("span");
    title.className = "title";
    if (rec.pinned) {
      const pin = document.createElement("span");
      pin.className = "pin-mark";
      pin.textContent = "📌 고정";
      title.appendChild(pin);
    }
    if (isTop) {
      const mark = document.createElement("span");
      mark.className = "top-mark";
      mark.textContent = "맨 위";
      title.appendChild(mark);
    }
    title.appendChild(document.createTextNode(rec.title)); // 입력값은 글자로만 넣어요

    const tag = document.createElement("span");
    tag.className = "tag " + resultClass(rec.result);
    tag.textContent = rec.result;

    const time = document.createElement("span");
    time.className = "time";
    time.textContent = formatTime(rec.time);

    li.append(title, tag);
    // '진행 중' 기록에 세부 내용이 있으면 게임명 아래에 보여 줘요
    if (rec.detail) {
      const detail = document.createElement("span");
      detail.className = "detail";
      detail.textContent = "▶ " + rec.detail; // 입력값은 글자로만 넣어요
      li.appendChild(detail);
    }
    li.appendChild(time);
    if (i === editingIndex) li.appendChild(buildEditBox(rec, i));
    else if (i === confirmDelIndex) li.appendChild(buildDelConfirm(rec, i));
    else li.appendChild(buildActions(rec, i));
    els.list.appendChild(li);
  });
  justPushed = false;

  els.count.textContent = stack.length + " / " + MAX_RECORDS + "개";
  els.popBtn.disabled = stack.length === 0;   // 0개면 Pop 버튼을 막아요
  els.resetBtn.disabled = stack.length === 0;

  // 단순 사실만 세어서 보여 줘요 (실력을 평가하지 않아요)
  const n = r => stack.filter(x => x.result === r).length;
  els.summary.textContent = stack.length === 0 ? "" :
    "성공 " + n("성공") + "개 · 실패 " + n("실패") + "개 · 진행 중 " + n("진행 중") + "개";

  els.saveNote.textContent = canSave
    ? "기록은 이 브라우저에 저장되어 다시 열어도 남아 있어요."
    : "지금은 저장 기능을 쓸 수 없어 기록이 저장되지 않아요. 창을 닫으면 사라져요.";
}

function makeBtn(text, cls, act, i, label) {
  const b = document.createElement("button");
  b.type = "button";
  b.className = cls;
  b.textContent = text;
  b.dataset.act = act;
  b.dataset.index = i;
  if (label) b.setAttribute("aria-label", label);
  return b;
}

// 카드 아래 버튼 줄: 고정 / 수정 / 삭제
function buildActions(rec, i) {
  const row = document.createElement("div");
  row.className = "actions";
  const pin = makeBtn(rec.pinned ? "📌 고정 해제" : "📌 고정", "ghost", "pin", i,
    rec.title + " 기록 " + (rec.pinned ? "고정 해제" : "맨 위에 고정"));
  pin.setAttribute("aria-pressed", rec.pinned ? "true" : "false");
  row.append(
    pin,
    makeBtn("수정", "secondary", "edit", i, rec.title + " 기록 수정"),
    makeBtn("삭제", "danger", "delete", i, rec.title + " 기록 삭제")
  );
  return row;
}

// 카드 안 삭제 재확인 줄: 알림창(confirm) 대신 같은 자리에서 한 번 더 물어봐요
function buildDelConfirm(rec, i) {
  const box = document.createElement("div");
  box.className = "del-confirm";
  box.setAttribute("role", "group");
  const q = document.createElement("p");
  q.id = "delQ" + i;
  q.textContent = "'" + rec.title + "' 기록을 정말 삭제할까요?" + (rec.pinned ? " (고정된 기록이에요)" : "");
  box.setAttribute("aria-labelledby", q.id);
  box.append(
    q,
    makeBtn("예, 삭제", "danger", "delYes", i, rec.title + " 기록 삭제 확정"),
    makeBtn("취소", "secondary", "delNo", i, rec.title + " 기록 삭제 취소")
  );
  return box;
}

// 카드 안 수정 상자: 결과 선택 + ('진행 중'일 때) 세부 내용 + 저장/취소
function buildEditBox(rec, i) {
  const box = document.createElement("div");
  box.className = "edit-box";

  const fset = document.createElement("fieldset");
  const lg = document.createElement("legend");
  lg.className = "legend";
  lg.textContent = "결과 바꾸기";
  const radios = document.createElement("div");
  radios.className = "radios";
  RESULTS.forEach(function (r) {
    const lab = document.createElement("label");
    lab.className = "radio";
    const inp = document.createElement("input");
    inp.type = "radio";
    inp.name = "editResult";
    inp.value = r;
    inp.checked = rec.result === r;
    const sp = document.createElement("span");
    sp.textContent = r;
    lab.append(inp, sp);
    radios.appendChild(lab);
  });
  fset.append(lg, radios);

  const dWrap = document.createElement("div");
  dWrap.className = "edit-detail";
  dWrap.hidden = rec.result !== "진행 중";
  const dLab = document.createElement("label");
  dLab.htmlFor = "editDetail";
  dLab.textContent = "진행 중인 내용 (선택, 30자 이내)";
  const dInp = document.createElement("input");
  dInp.type = "text";
  dInp.id = "editDetail";
  dInp.maxLength = MAX_DETAIL;
  dInp.autocomplete = "off";
  dInp.value = rec.detail || "";
  const dHint = document.createElement("div");
  dHint.className = "hint";
  const dCount = document.createElement("span");
  dCount.textContent = countChars(dInp.value);
  dHint.append(dCount, document.createTextNode(" / 30자 · 성공·실패로 바꾸면 세부 내용은 지워져요"));
  dWrap.append(dLab, dInp, dHint);

  dInp.addEventListener("input", function (e) {
    if (!e.isComposing) limitInput(dInp, MAX_DETAIL, dCount);
    else dCount.textContent = Math.min(countChars(dInp.value), MAX_DETAIL);
  });
  dInp.addEventListener("compositionend", function () { limitInput(dInp, MAX_DETAIL, dCount); });
  radios.addEventListener("change", function () {
    const c = radios.querySelector("input:checked");
    dWrap.hidden = !(c && c.value === "진행 중");
  });

  const msg = document.createElement("p");
  msg.className = "msg" + (editError ? " error" : "");
  msg.setAttribute("role", "alert");
  msg.textContent = editError;

  const row = document.createElement("div");
  row.className = "actions";
  row.append(makeBtn("저장", "", "save", i), makeBtn("취소", "secondary", "cancel", i));

  box.append(fset, dWrap, msg, row);
  return box;
}

function showFormMsg(text, type) {
  els.formMsg.textContent = text;
  els.formMsg.className = "msg " + (type || "");
}

function openConfirm(action) {
  pendingAction = action;
  const top = stack[stack.length - 1];
  els.confirmText.textContent = action === "pop"
    ? "가장 최근 기록" + (top ? "('" + top.title + "'" + (top.pinned ? ", 고정됨" : "") + ")" : "") + "을 삭제하시겠습니까?"
    : "모든 기록(예시 기록 포함)을 지우고 처음 상태로 비우시겠습니까?";
  els.confirmBox.hidden = false;
  els.confirmNo.focus();
}

function closeConfirm() {
  pendingAction = null;
  els.confirmBox.hidden = true;
}

// 입력칸 글자 수를 max까지로 딱 맞추고, 글자 수 표시를 갱신해요.
// 한글은 조합 중(ㄱ→가→각)에는 자르지 않고, 조합이 끝난 뒤에 잘라요.
// (조합 중에 제한을 넘어 한 글자가 더 들어가던 문제를 막아요)
function limitInput(input, max, counter) {
  if (countChars(input.value) > max) input.value = cutText(input.value, max);
  counter.textContent = countChars(input.value);
}

// '진행 중'을 골랐을 때만 세부 내용 입력란을 보여 줘요
function updateDetailVisible() {
  const checked = els.form.querySelector("input[name='gameResult']:checked");
  els.detailWrap.hidden = !(checked && checked.value === "진행 중");
}

// ===== 이벤트 연결 =====
els.title.addEventListener("input", function (e) {
  if (!e.isComposing) limitInput(els.title, MAX_TITLE, els.charCount);
  else els.charCount.textContent = Math.min(countChars(els.title.value), MAX_TITLE);
  if (els.formMsg.classList.contains("error")) showFormMsg("", "");
});
els.title.addEventListener("compositionend", function () { limitInput(els.title, MAX_TITLE, els.charCount); });

els.detail.addEventListener("input", function (e) {
  if (!e.isComposing) limitInput(els.detail, MAX_DETAIL, els.detailCount);
  else els.detailCount.textContent = Math.min(countChars(els.detail.value), MAX_DETAIL);
});
els.detail.addEventListener("compositionend", function () { limitInput(els.detail, MAX_DETAIL, els.detailCount); });

els.form.querySelectorAll("input[name='gameResult']").forEach(function (radio) {
  radio.addEventListener("change", updateDetailVisible);
});

// 기록 추가 (Push)
els.form.addEventListener("submit", function (e) {
  e.preventDefault();
  const checked = els.form.querySelector("input[name='gameResult']:checked");
  const result = checked ? checked.value : "";
  // 혹시 조합 중에 바로 눌렀어도 글자 수를 먼저 맞춰요
  limitInput(els.title, MAX_TITLE, els.charCount);
  limitInput(els.detail, MAX_DETAIL, els.detailCount);
  const error = pushRecord(els.title.value, result, els.detail.value);
  if (error) {
    showFormMsg(error, "error");
    els.title.focus();
    return;
  }
  const added = stack[stack.length - 1];
  showFormMsg("'" + added.title + " (" + added.result + ")' 기록을 맨 위에 쌓았어요.", "info");
  els.cheer.textContent = pickCheer(result);
  els.title.value = "";
  els.charCount.textContent = "0";
  els.detail.value = "";
  els.detailCount.textContent = "0";
  closeConfirm();
  confirmDelIndex = -1;
  justPushed = true;
  renderStack();
});

// 카드 안 버튼(고정·수정·삭제·저장·취소)은 목록 한 곳에서 처리해요
els.list.addEventListener("click", function (e) {
  const btn = e.target.closest("button[data-act]");
  if (!btn) return;
  const i = Number(btn.dataset.index);
  const act = btn.dataset.act;
  const rec = stack[i];
  if (!rec) return;
  let focusAct = null; // 다시 그린 뒤 포커스를 둘 버튼

  // 삭제 확인·취소가 아닌 다른 버튼을 누르면 묻던 삭제 확인은 닫아요
  if (act !== "delete" && act !== "delYes" && act !== "delNo") confirmDelIndex = -1;

  if (act === "pin") {
    togglePin(i);
    showFormMsg("'" + rec.title + "' 기록을 " + (rec.pinned ? "목록 맨 위에 고정했어요." : "고정 해제해서 원래 자리로 돌려놨어요."), "info");
    focusAct = "pin";
  } else if (act === "edit") {
    editingIndex = i;
    editError = "";
    closeConfirm();
  } else if (act === "cancel") {
    editingIndex = -1;
    editError = "";
    focusAct = "edit";
  } else if (act === "save") {
    const li = btn.closest("li");
    const c = li.querySelector("input[name='editResult']:checked");
    const d = li.querySelector("#editDetail");
    if (d) d.value = cutText(d.value, MAX_DETAIL);
    const error = editAt(i, c ? c.value : "", d ? d.value : "");
    if (error) {
      editError = error;
    } else {
      editingIndex = -1;
      editError = "";
      showFormMsg("'" + rec.title + "' 기록을 '" + rec.result + "'(으)로 수정했어요.", "info");
      els.cheer.textContent = pickCheer(rec.result);
      focusAct = "edit";
    }
  } else if (act === "delete") {
    // 바로 지우지 않고, 카드 안에 '정말 삭제할까요?'를 띄워요
    confirmDelIndex = i;
    editingIndex = -1;
    editError = "";
    closeConfirm();
  } else if (act === "delNo") {
    confirmDelIndex = -1;
    focusAct = "delete";
  } else if (act === "delYes") {
    confirmDelIndex = -1;
    const removed = deleteAt(i);
    editingIndex = -1;
    editError = "";
    closeConfirm();
    if (removed) showFormMsg("'" + removed.title + " (" + removed.result + ")' 기록을 삭제했어요.", "info");
  }
  renderStack();

  // 키보드 사용자를 위해 다시 그린 뒤 포커스를 알맞은 곳에 둬요
  if (act === "delete") {
    const no = els.list.querySelector("button[data-act='delNo']");
    if (no) no.focus();
  } else if (act === "edit") {
    const first = els.list.querySelector("input[name='editResult']:checked");
    if (first) first.focus();
  } else if (focusAct) {
    const again = els.list.querySelector("button[data-act='" + focusAct + "'][data-index='" + i + "']");
    if (again) again.focus();
  } else if (act === "delYes") {
    els.listTitle.focus();
  } else if (act === "save") {
    const save = els.list.querySelector("button[data-act='save']");
    if (save) save.focus();
  }
});

// 아래 확인 상자를 열 때는 카드 안 삭제 확인을 닫아요 (확인 창이 두 개 동시에 뜨지 않게)
els.popBtn.addEventListener("click", function () { if (confirmDelIndex !== -1) { confirmDelIndex = -1; renderStack(); } openConfirm("pop"); });
els.resetBtn.addEventListener("click", function () { if (confirmDelIndex !== -1) { confirmDelIndex = -1; renderStack(); } openConfirm("reset"); });
els.confirmNo.addEventListener("click", closeConfirm);

els.confirmYes.addEventListener("click", function () {
  editingIndex = -1;
  editError = "";
  if (pendingAction === "pop") {
    const removed = popRecord();
    if (removed) showFormMsg("'" + removed.title + " (" + removed.result + ")' 기록을 되돌렸어요.", "info");
  } else if (pendingAction === "reset") {
    resetAll();
    showFormMsg("모든 기록을 비웠어요.", "info");
    els.cheer.textContent = "새로운 도전을 기록해 보세요.";
  }
  closeConfirm();
  renderStack();
});

// 처음 시작
stack = loadStack();
updateDetailVisible();
renderStack();
