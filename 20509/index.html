<!DOCTYPE html>
<html lang="ko">
<head>
<!-- ===== 1. 메타 정보 ===== -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>게임 강화 확률 &amp; 기댓값 시뮬레이터</title>
<meta name="description" content="성공 확률을 넣으면 평균 몇 번 만에 성공하는지(기댓값)를 알려 주고, 직접 강화 버튼을 눌러 독립시행 결과를 쌓아 보는 시뮬레이터">
  <meta name="class" content="M반 (2-8)">
  <meta name="status" content="3회 개선">
  <meta name="design" content="컬러셋 C16 먹과 노랑 · 트렌드 T01 리퀴드 글래스 · #ffd600">

<!-- ===== 2. 스타일 ===== -->
<style>
  /* 전시판 공용 글꼴 (못 불러와도 아래 대체 글꼴로 정상 작동) */
  @font-face { font-family: "Wanted Sans"; src: url("../assets/fonts/WantedSansVariable.woff2") format("woff2"); font-weight: 400 1000; font-display: swap; }

  /* 컬러셋: 먹과 노랑 · 트렌드: 리퀴드 글래스(버튼에만) */
  :root {
    color-scheme: dark;
    --bg: #111111;          /* 페이지 바탕: 먹 */
    --card: #1c1c1a;        /* 카드·입력칸 바탕 */
    --line: #33322d;        /* 옅은 구분선·카드 테두리 */
    --edge: #b8b6ad;        /* 입력칸 테두리 */
    --text: #f5f5f0;
    --muted: #b8b6ad;
    --accent: #ffd600;      /* 강조색: 경고등 노랑 (한 가지 색만 사용) */
    --on-accent: #111111;   /* 강조색 위 글자 */
    --block: #2a2610;       /* 결과 요약 카드 하나에 쓰는 색 블록 */
    --ok: #6fdc95;          /* 성공 글자 (어두운 바탕에 맞춰 밝힌 초록) */
    --ok-bg: #12301d;
    --bad: #ff8a80;         /* 실패·경고 글자 (어두운 바탕에 맞춰 밝힌 빨강) */
    --bad-bg: #3a1515;
    /* 리퀴드 글래스 */
    --glass-bg: color-mix(in srgb, #1c1c1a 45%, transparent);
    --glass-rim: 1px solid rgba(255, 255, 255, .6);
    --glass-depth: inset 0 1px 0 rgba(255, 255, 255, .75), inset 0 -1px 0 rgba(0, 0, 0, .08), 0 8px 24px rgba(0, 0, 0, .12);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    /* 유리 뒤로 비쳐 보이는 노란 빛: 글자가 지나가는 곳은 12% 이하 */
    background:
      radial-gradient(circle at 0% 100%, rgba(255, 214, 0, .12) 0, rgba(255, 214, 0, 0) 420px),
      radial-gradient(circle at 100% 18%, rgba(255, 214, 0, .10) 0, rgba(255, 214, 0, 0) 360px),
      var(--bg);
    color: var(--text);
    font-family: "Wanted Sans", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    font-size: 17px;
    line-height: 1.7;
    word-break: keep-all;
  }
  /* 넓은 화면: 글자가 없는 오른쪽 위 구석에만 진한 빛(30%) */
  @media (min-width: 900px) {
    body {
      background:
        radial-gradient(circle at 100% 0%, rgba(255, 214, 0, .30) 0, rgba(255, 214, 0, 0) 300px),
        radial-gradient(circle at 0% 100%, rgba(255, 214, 0, .12) 0, rgba(255, 214, 0, 0) 520px),
        var(--bg);
    }
  }
  main {
    max-width: 40rem;
    margin: 0 auto;
    padding: 24px 16px 40px;
  }
  h1 { font-size: 1.4rem; margin: 0 0 4px; line-height: 1.4; }
  .lead { margin: 0 0 20px; color: var(--muted); }
  section.card {
    background: var(--card);       /* 글이 많은 카드는 불투명하게 */
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 18px 16px;
    margin-bottom: 16px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, .06);
  }
  h2 { font-size: 1.05rem; margin: 0 0 10px; }

  /* 상단: 확률 입력 (카드 안 가운데 정렬) */
  label { display: block; font-weight: 600; margin-bottom: 6px; }
  section[aria-labelledby="setTitle"] label { text-align: center; }
  .input-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; }
  .input-wrap { display: flex; align-items: center; gap: 6px; }
  section[aria-labelledby="setTitle"] .warn { text-align: center; }
  input[type="number"] {
    width: 6.5rem;
    font-size: 1.1rem;
    padding: 8px 10px;
    border: 1px solid var(--edge);
    border-radius: 12px;
    background: var(--card);
    color: var(--text);
    font-family: inherit;
  }
  input[aria-invalid="true"] { border: 2px solid var(--bad); }
  /* 버튼 = 리퀴드 글래스: 반투명 유리 + 가장자리 빛 + 두께감, 알약 모양 */
  button {
    font-family: inherit;
    font-size: 1rem;
    padding: 9px 18px;
    border-radius: 999px;
    border: var(--glass-rim);
    background: var(--glass-bg);
    -webkit-backdrop-filter: blur(12px) saturate(160%);
    backdrop-filter: blur(12px) saturate(160%);
    box-shadow: var(--glass-depth);
    color: var(--text);
    cursor: pointer;
    min-height: 44px;
    transition: transform .12s ease-out;
  }
  button:active { transform: scale(.97); }
  button.primary { background: color-mix(in srgb, var(--accent) 92%, transparent); color: var(--on-accent); font-weight: 700; }
  button.primary:hover { background: var(--accent); }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) {
    button { transition: none; }
    button:active { transform: none; }
  }
  .warn {
    margin: 10px 0 0;
    padding: 8px 12px;
    border-radius: 12px;
    background: var(--bad-bg);
    color: var(--bad);
    font-weight: 600;
  }
  .warn[hidden] { display: none; }

  /* 중단: 기댓값·카운터·강화 버튼 */
  .expect {
    border-left: 4px solid var(--accent);
    background: var(--block);
    padding: 12px 14px;
    border-radius: 0 12px 12px 0;
    margin: 0 0 16px;
  }
  .expect strong { color: var(--accent); }
  .expect small { display: block; color: var(--muted); margin-top: 4px; font-size: 0.92rem; }
  .counter { text-align: center; margin: 4px 0 14px; }
  .counter .label { color: var(--muted); font-size: 0.95rem; }
  .counter .num { font-size: 3rem; font-weight: 700; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .counter .sub { color: var(--muted); font-size: 0.95rem; }
  .last {
    text-align: center;
    min-height: 1.7em;
    font-weight: 700;
    margin-bottom: 10px;
  }
  .last.ok { color: var(--ok); }
  .last.bad { color: var(--bad); }
  #tryBtn {
    display: block;
    width: 100%;
    font-size: 1.25rem;
    font-weight: 700;
    padding: 16px;
  }

  /* 하단: 기록 목록 */
  .log-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .log-head p { margin: 0 0 8px; color: var(--muted); font-size: 0.92rem; }
  #logList {
    list-style: none;
    margin: 0;
    padding: 0;
    max-height: 18rem;
    overflow-y: auto;
    border: 1px solid var(--line);
    border-radius: 12px;
  }
  #logList li {
    padding: 6px 12px;
    border-bottom: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }
  #logList li:last-child { border-bottom: none; }
  #logList li.ok { background: var(--ok-bg); color: var(--ok); font-weight: 700; }
  #logList li .p { color: var(--muted); font-weight: 400; font-size: 0.9rem; }
  #logList li.empty { color: var(--muted); justify-content: center; }
  /* 독립시행 안내: 시도 기록 카드 맨 아래에 고정 위치로 (스크롤 때 기록을 가리지 않게) */
  .notice {
    margin: 12px 0 0;
    padding: 8px 12px;
    font-size: 0.95rem;
    line-height: 1.55;
    border: 1px solid #8a7a3a;   /* 안내 노랑: 강조색과 헷갈리지 않게 어둡게 */
    background: var(--card);
    border-radius: 12px;
  }
  .store-note { color: var(--muted); font-size: 0.9rem; margin: 10px 0 0; }

  /* 확률을 바꿔 통계를 0부터 다시 셀 때 보이는 안내 */
  .stat-note { text-align: center; color: var(--muted); font-size: 0.92rem; margin: 0 0 10px; }
  .stat-note[hidden] { display: none; }

  /* 전체 로그 보기: 확률 버튼 목록 + 선택한 확률의 통계 */
  .log-tools { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 10px; }
  .prob-pick { margin: 0 0 10px; }
  .prob-pick[hidden], .log-summary[hidden] { display: none; }
  .prob-pick p { margin: 0 0 6px; color: var(--muted); font-size: 0.92rem; }
  .prob-btns { display: flex; flex-wrap: wrap; gap: 6px; }
  .prob-btns button { min-width: 4.2rem; padding: 6px 12px; }
  .prob-btns button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); font-weight: 700; }
  .log-summary {
    margin: 0 0 10px;
    padding: 8px 12px;
    border-left: 4px solid var(--accent);
    background: transparent;
    border-radius: 0 12px 12px 0;
  }
  .log-summary small { display: block; color: var(--muted); font-size: 0.88rem; }

  /* 강화 연출: 성공 = 초록 빛 반짝임, 실패 = 빨간 흔들림 */
  .rate { font-weight: 700; color: var(--text); }
  @keyframes glowOk {
    0%   { box-shadow: 0 0 0 0 rgba(111,220,149,0); border-color: var(--line); }
    30%  { box-shadow: 0 0 0 6px rgba(111,220,149,0.30), 0 0 24px 6px rgba(111,220,149,0.35); border-color: var(--ok); background: var(--ok-bg); }
    100% { box-shadow: 0 0 0 0 rgba(111,220,149,0); border-color: var(--line); }
  }
  @keyframes shakeBad {
    0%, 100% { transform: translateX(0); }
    15% { transform: translateX(-8px); }
    30% { transform: translateX(7px); }
    45% { transform: translateX(-6px); }
    60% { transform: translateX(5px); }
    75% { transform: translateX(-3px); }
  }
  @keyframes flashBad {
    0%   { border-color: var(--line); background: var(--card); }
    25%  { border-color: var(--bad); background: var(--bad-bg); }
    100% { border-color: var(--line); background: var(--card); }
  }
  @keyframes popOk {
    0% { transform: scale(1); }
    40% { transform: scale(1.18); }
    100% { transform: scale(1); }
  }
  section.card.fx-ok { animation: glowOk 0.9s ease-out; }
  section.card.fx-bad { animation: shakeBad 0.45s ease-in-out, flashBad 0.9s ease-out; }
  .last.fx-ok { animation: popOk 0.5s ease-out; }
  /* 움직임을 줄이도록 설정한 사람에게는 흔들림·확대 없이 색만 바뀌게 */
  @media (prefers-reduced-motion: reduce) {
    section.card.fx-bad { animation: flashBad 0.9s ease-out; }
    .last.fx-ok { animation: none; }
  }

  /* 터지는 조각 연출: 성공 = 긴 종이 띠 8개, 실패 = 붉은 파편 7개
     화면 전체를 덮는 투명한 층에 잠깐 만들었다가 애니메이션이 끝나면 지운다 */
  .burst-layer { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 10; }
  .piece {
    position: absolute;
    left: 0; top: 0;
    will-change: transform, opacity;
  }
  .piece.strip { width: 8px; height: 26px; border-radius: 2px; animation: stripFly 1.2s ease-out forwards; }
  .piece.shard {
    width: 16px; height: 16px;
    background: var(--bad);
    clip-path: polygon(50% 0, 100% 40%, 70% 100%, 0 75%, 15% 20%);
    animation: shardFly 0.7s cubic-bezier(.2, .7, .3, 1) forwards;
  }
  .piece.shard.dark { background: #c62828; }
  /* --dx, --dy: 날아갈 거리 / --rot: 돌아가는 각도 (조각마다 JS가 정해 줌) */
  @keyframes stripFly {
    0%   { transform: translate(-50%, -50%) rotate(0deg) scale(.4); opacity: 0; }
    12%  { opacity: 1; }
    45%  { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) rotate(calc(var(--rot) * .6)) scale(1); opacity: 1; }
    100% { transform: translate(calc(-50% + var(--dx) * 1.15), calc(-50% + var(--dy) + 70px)) rotate(var(--rot)) scale(1); opacity: 0; }
  }
  @keyframes shardFly {
    0%   { transform: translate(-50%, -50%) rotate(0deg) scale(1.2); opacity: 1; }
    70%  { opacity: 1; }
    100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) rotate(var(--rot)) scale(.5); opacity: 0; }
  }
  /* 움직임을 줄이도록 설정한 사람에게는 조각이 날아가지 않게 (JS에서도 만들지 않음) */
  @media (prefers-reduced-motion: reduce) {
    .burst-layer { display: none; }
  }
</style>
</head>
<body>
<!-- ===== 3. 화면 구조 ===== -->
<main>
  <h1>게임 강화 확률 &amp; 기댓값 시뮬레이터</h1>
  <p class="lead">강화 버튼을 누르기 전에, 이 확률이면 평균 몇 번 만에 성공하는지 먼저 확인하고 직접 눌러 보세요.</p>

  <!-- 상단: 성공 확률 입력 -->
  <section class="card" aria-labelledby="setTitle">
    <h2 id="setTitle">1. 성공 확률 설정</h2>
    <label for="probInput">성공 확률(%) — 1~100 사이 정수</label>
    <div class="input-row">
      <span class="input-wrap">
        <input id="probInput" type="number" min="1" max="100" step="1" inputmode="numeric" value="50" aria-describedby="probWarn">
        <span>%</span>
      </span>
      <button id="setBtn" type="button" class="primary">확률 설정</button>
      <button id="resetBtn" type="button">초기화</button>
    </div>
    <p id="probWarn" class="warn" role="alert" hidden></p>
  </section>

  <!-- 중단: 기댓값 안내, 시도 횟수, 강화 버튼 -->
  <section class="card" id="tryCard" aria-labelledby="tryTitle">
    <h2 id="tryTitle">2. 강화 시도</h2>
    <p id="expectBox" class="expect" aria-live="polite"></p>
    <div class="counter">
      <div class="label">현재 총 시도 횟수</div>
      <div class="num"><span id="totalCount">0</span>회</div>
      <div class="sub" id="okBadCount">성공 0회 · 실패 0회</div>
      <div class="sub">실제 성공률: <span id="realRate" class="rate">-</span></div>
    </div>
    <p id="statNote" class="stat-note" aria-live="polite" hidden></p>
    <p id="lastResult" class="last" aria-live="polite"></p>
    <button id="tryBtn" type="button" class="primary">강화 시도</button>
  </section>

  <!-- 하단: 기록 목록과 독립시행 안내 -->
  <section class="card" aria-labelledby="logTitle">
    <div class="log-head">
      <h2 id="logTitle">3. 시도 기록</h2>
      <p>최근 기록이 맨 위에 보입니다.</p>
    </div>
    <!-- 전체 로그 보기: 지금까지 쓴 확률 버튼을 눌러 그 확률 기록만 모아 보기 -->
    <div class="log-tools">
      <button id="allLogBtn" type="button" aria-expanded="false" aria-controls="probPick">전체 로그 보기</button>
      <button id="backBtn" type="button" hidden>목록으로 돌아가기</button>
    </div>
    <div id="probPick" class="prob-pick" hidden>
      <p id="probPickText">확률을 고르면 그 확률로 한 시도만 모아서 보여 줍니다.</p>
      <div id="probBtns" class="prob-btns" role="group" aria-label="지금까지 사용한 확률"></div>
    </div>
    <p id="logSummary" class="log-summary" aria-live="polite" hidden></p>
    <ol id="logList" aria-label="강화 시도 결과 기록"></ol>
    <p id="storeNote" class="store-note"></p>
    <p class="notice"><strong>※ 안내:</strong> 매 시도는 독립시행이므로 평균 기댓값보다 더 많은 시도가 필요할 수 있습니다.</p>
  </section>
</main>

<script>
// ===== 4. 예시 데이터·설정 =====
const DEFAULT_PROB = 50;                  // 처음 접속하면 50%로 시작
const STORAGE_KEY = "sih26:20509:state";  // 이 작품 전용 저장 이름
const MAX_SAVED_LOGS = 1000;              // 기록은 최근 1000개까지만 보관(브라우저가 무거워지지 않게)
const WARN_TEXT = "1~100 사이의 숫자를 입력하세요";

// ===== 5. 데이터·상태 =====
const state = {
  prob: null,       // 설정된 성공 확률(정수). 아직 설정 안 했으면 null
  total: 0,         // 총 시도 횟수
  success: 0,       // 성공 횟수
  logs: []          // 기록: { n: 회차, ok: 성공여부, p: 그때 확률 }
};
let canSave = true; // 저장(localStorage)을 쓸 수 있는지
// 기록 영역에 무엇을 보여 줄지: "list"(전체 목록) / "pick"(확률 고르기) / 숫자(그 확률만)
let logView = "list";
let migrateNote = ""; // 예전 버전 저장값을 고쳐 읽었을 때 보여 줄 안내

// 화면 요소 가져오기
const probInput = document.getElementById("probInput");
const setBtn = document.getElementById("setBtn");
const resetBtn = document.getElementById("resetBtn");
const probWarn = document.getElementById("probWarn");
const expectBox = document.getElementById("expectBox");
const totalCount = document.getElementById("totalCount");
const okBadCount = document.getElementById("okBadCount");
const realRate = document.getElementById("realRate");
const tryCard = document.getElementById("tryCard");
const lastResult = document.getElementById("lastResult");
const tryBtn = document.getElementById("tryBtn");
const logList = document.getElementById("logList");
const storeNote = document.getElementById("storeNote");
const statNote = document.getElementById("statNote");
const allLogBtn = document.getElementById("allLogBtn");
const backBtn = document.getElementById("backBtn");
const probPick = document.getElementById("probPick");
const probPickText = document.getElementById("probPickText");
const probBtns = document.getElementById("probBtns");
const logSummary = document.getElementById("logSummary");

// ===== 6. 처리 함수 =====

// 입력값을 검사해서 올바른 정수면 그 숫자를, 아니면 null을 돌려준다
function readProb() {
  const text = probInput.value.trim();
  if (text === "") return null;            // 빈 값
  const p = Number(text);
  if (!Number.isInteger(p)) return null;   // 숫자가 아니거나 소수
  if (p < 1 || p > 100) return null;       // 0 이하, 100 초과
  return p;
}

// 기댓값 계산: 성공 확률이 p%이면 평균 100 ÷ p 번 만에 첫 성공
// 예) 50% → 100 ÷ 50 = 2.0회, 1% → 100 ÷ 1 = 100.0회
function calcExpected(p) {
  return 100 / p;
}

// 강화 한 번 굴리기: 1~100 사이 난수 R을 만들어 R ≤ p 이면 성공
function rollOnce(p) {
  const R = Math.floor(Math.random() * 100) + 1; // 0~99 → 1~100
  return R <= p;                                  // 조건문: 참이면 성공
}

// 저장하기 (막혀 있으면 조용히 넘어가고 안내만 바꿈)
function saveState() {
  if (!canSave) return;
  try {
    const data = {
      v: 2,             // 저장 형식 2: 위 통계는 "지금 확률"로 한 시도만 센다
      prob: state.prob,
      total: state.total,
      success: state.success,
      logs: state.logs.slice(-MAX_SAVED_LOGS)
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch (e) {
    canSave = false;
    renderStoreNote();
  }
}

// 불러오기
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    if (Number.isInteger(data.prob) && data.prob >= 1 && data.prob <= 100) state.prob = data.prob;
    if (Number.isInteger(data.total) && data.total >= 0) state.total = data.total;
    if (Number.isInteger(data.success) && data.success >= 0 && data.success <= state.total) state.success = data.success;
    if (Array.isArray(data.logs)) {
      state.logs = data.logs.filter(function (x) {
        return x && Number.isInteger(x.n) && typeof x.ok === "boolean" && Number.isInteger(x.p);
      }).slice(-MAX_SAVED_LOGS);
    }
    // 예전 버전(v 없음)은 확률을 바꿔도 통계를 계속 합쳤다.
    // 기록 안에 다른 확률이 섞여 있으면, 위 통계만 "마지막으로 지금 확률로 이어서 한 시도"로 다시 계산한다.
    // (기록 자체는 하나도 지우지 않는다)
    if (data.v !== 2 && state.prob !== null) {
      const mixed = state.logs.some(function (x) { return x.p !== state.prob; });
      if (mixed) {
        let t = 0, ok = 0;
        for (let i = state.logs.length - 1; i >= 0 && state.logs[i].p === state.prob; i--) {
          t = t + 1;
          if (state.logs[i].ok) ok = ok + 1;
        }
        state.total = t;
        state.success = ok;
        migrateNote = "예전 통계에는 여러 확률이 합쳐져 있어서, 지금 확률 " + state.prob +
          "%로 이어서 한 시도만으로 다시 셌어요. 이전 기록은 [전체 로그 보기]에 그대로 있어요.";
      }
    }
  } catch (e) {
    canSave = false;
  }
}

// 저장 기록 지우기
function clearSaved() {
  if (!canSave) return;
  try {
    localStorage.removeItem(STORAGE_KEY);
  } catch (e) {
    canSave = false;
  }
}

// 경고 보이기/숨기기
function showWarn(message) {
  probWarn.textContent = "입력 오류: " + message;
  probWarn.hidden = false;
  probInput.setAttribute("aria-invalid", "true");
}
function hideWarn() {
  probWarn.hidden = true;
  probWarn.textContent = "";
  probInput.removeAttribute("aria-invalid");
}

// 입력창의 확률을 검사해서 설정. 성공하면 true
function applyProb() {
  const p = readProb();
  if (p === null) {
    showWarn(WARN_TEXT + " (소수점 없는 정수)");
    return false;
  }
  hideWarn();
  // 확률이 바뀌면 위 통계(총 시도·성공/실패·실제 성공률)를 0부터 다시 센다.
  // 같은 확률이면 그대로 이어서 센다. 기록 목록은 지우지 않는다.
  if (state.prob !== null && p !== state.prob) {
    const before = state.prob;
    state.total = 0;
    state.success = 0;
    showStatNote("확률을 " + before + "% → " + p + "%로 바꿔서 위 통계를 0회부터 다시 셉니다. 이전 기록은 아래 [전체 로그 보기]에 남아 있어요.");
    renderCounter();
    renderLast(null);
  }
  state.prob = p;
  saveState();
  return true;
}

// 통계 리셋 안내 보이기/숨기기
function showStatNote(text) {
  statNote.textContent = text;
  statNote.hidden = false;
}
function hideStatNote() {
  statNote.hidden = true;
  statNote.textContent = "";
}

// ===== 7. 화면 갱신 =====

function renderExpected() {
  expectBox.textContent = "";
  if (state.prob === null) {
    expectBox.textContent = "성공 확률을 입력하고 [확률 설정]을 누르면 기댓값이 나옵니다.";
    return;
  }
  const e = calcExpected(state.prob).toFixed(1); // 소수점 첫째 자리까지
  expectBox.append("이 확률의 수학적 평균 기댓값은 ");
  const strong = document.createElement("strong");
  strong.textContent = "약 " + e + "회";
  expectBox.append(strong, "입니다.");
  const small = document.createElement("small");
  small.textContent = "설정된 성공 확률 " + state.prob + "% · 평균적으로 첫 성공까지 걸리는 시도 횟수 (100 ÷ " + state.prob + ")";
  expectBox.append(small);
}

// 실제 성공 비율(%) = 성공 횟수 ÷ 총 시도 횟수 × 100
// 시도가 0회면 0으로 나누게 되어 NaN이 나오므로 계산하지 않고 "-"를 돌려준다
function calcRealRate(success, total) {
  if (total === 0) return "-";
  return (success / total * 100).toFixed(1) + "%";
}

function renderCounter() {
  totalCount.textContent = state.total;
  okBadCount.textContent = "성공 " + state.success + "회 · 실패 " + (state.total - state.success) + "회";
  realRate.textContent = calcRealRate(state.success, state.total);
}

// 강화 연출: 같은 결과가 연달아 나와도 매번 다시 재생되도록 클래스를 뗐다 붙인다
function playEffect(ok) {
  [tryCard, lastResult].forEach(function (el) {
    el.classList.remove("fx-ok", "fx-bad");
    void el.offsetWidth; // 브라우저가 "클래스가 빠졌다"를 알아채게 한 번 다시 그리기
  });
  tryCard.classList.add(ok ? "fx-ok" : "fx-bad");
  if (ok) lastResult.classList.add("fx-ok");
  burst(ok);
}

// ===== 터지는 조각 연출 =====
const STRIP_COUNT = 8;   // 성공: 긴 종이 띠 8개
const SHARD_COUNT = 7;   // 실패: 붉은 파편 7개 (6~8개)
const STRIP_COLORS = ["#ffd600", "#6fdc95", "#f5f5f0", "#ffd600", "#ffb300", "#6fdc95", "#f5f5f0", "#ffd600"];
const burstLayer = document.createElement("div");
burstLayer.className = "burst-layer";
burstLayer.setAttribute("aria-hidden", "true"); // 꾸밈용이라 화면 읽기 프로그램은 건너뜀
document.body.append(burstLayer);
const reduceMotion = window.matchMedia ? window.matchMedia("(prefers-reduced-motion: reduce)") : null;

// ok가 참이면 종이 띠, 거짓이면 붉은 파편을 [강화 시도] 버튼 가운데에서 터뜨린다
function burst(ok) {
  if (reduceMotion && reduceMotion.matches) return; // 움직임 줄이기 설정이면 만들지 않음
  burstLayer.textContent = ""; // 연달아 누르면 이전 조각은 지우고 새로 (조각이 쌓여 느려지지 않게)
  const box = tryBtn.getBoundingClientRect();
  const x = box.left + box.width / 2;
  const y = box.top + box.height / 2;
  const count = ok ? STRIP_COUNT : SHARD_COUNT;
  for (let i = 0; i < count; i++) {
    const piece = document.createElement("span");
    // 조각마다 방향을 고르게 나누고 조금씩 흔들어서 사방으로 퍼지게
    const angle = (i / count) * Math.PI * 2 + (Math.random() - 0.5) * 0.6;
    const dist = ok ? 90 + Math.random() * 60 : 80 + Math.random() * 50;
    // 버튼이 넓으면 옆으로 더 멀리 퍼지게 (휴대폰처럼 좁으면 덜 퍼짐)
    const wide = Math.min(box.width / 2, 220) * 0.6;
    piece.className = ok ? "piece strip" : "piece shard" + (i % 2 ? " dark" : "");
    piece.style.left = x + "px";
    piece.style.top = y + "px";
    piece.style.setProperty("--dx", Math.round(Math.cos(angle) * (dist + wide)) + "px");
    piece.style.setProperty("--dy", Math.round(Math.sin(angle) * dist * (ok ? 0.8 : 0.7) - (ok ? 30 : 0)) + "px");
    piece.style.setProperty("--rot", Math.round((Math.random() - 0.5) * (ok ? 720 : 540)) + "deg");
    if (ok) piece.style.background = STRIP_COLORS[i % STRIP_COLORS.length];
    // 애니메이션이 끝나면 조각을 지운다 (끝 신호가 안 와도 1.6초 뒤에는 꼭 지움)
    piece.addEventListener("animationend", function () { piece.remove(); });
    setTimeout(function () { piece.remove(); }, 1600);
    burstLayer.append(piece);
  }
}

// 기록 목록 다시 그리기 (최근 것이 위)
function renderLogs() {
  renderLogTools();
  logList.textContent = "";

  // 확률 고르기 화면: 아직 확률을 안 골랐으면 목록 대신 안내
  if (logView === "pick") {
    logList.append(makeEmptyItem(state.logs.length === 0 ? "아직 기록이 없습니다." : "위에서 확률을 고르면 그 확률의 기록만 보여요."));
    return;
  }

  // 특정 확률만: 그 확률 기록만 골라서, 그 안에서 1, 2, 3… 순서로 번호를 붙인다
  if (typeof logView === "number") {
    const only = logsOf(logView);
    if (only.length === 0) {
      logList.append(makeEmptyItem("이 확률의 기록이 없습니다."));
      return;
    }
    for (let i = only.length - 1; i >= 0; i--) {
      logList.append(makeLogItem(only[i], i + 1));
    }
    return;
  }

  // 전체 목록
  if (state.logs.length === 0) {
    logList.append(makeEmptyItem("아직 기록이 없습니다."));
    return;
  }
  for (let i = state.logs.length - 1; i >= 0; i--) {
    logList.append(makeLogItem(state.logs[i]));
  }
}

function makeEmptyItem(text) {
  const li = document.createElement("li");
  li.className = "empty";
  li.textContent = text;
  return li;
}

// 지금까지 쓴 확률 목록 (작은 것부터, 겹치지 않게)
function usedProbs() {
  const list = [];
  state.logs.forEach(function (x) {
    if (!list.includes(x.p)) list.push(x.p);
  });
  return list.sort(function (a, b) { return a - b; });
}

// 한 확률의 기록만 골라내기
function logsOf(p) {
  return state.logs.filter(function (x) { return x.p === p; });
}

// [전체 로그 보기] 영역(확률 버튼·통계 요약) 그리기
function renderLogTools() {
  const listMode = logView === "list";
  allLogBtn.setAttribute("aria-expanded", listMode ? "false" : "true");
  backBtn.hidden = listMode;
  probPick.hidden = listMode;

  probBtns.textContent = "";
  const probs = usedProbs();
  probPickText.textContent = probs.length === 0
    ? "아직 시도한 확률이 없습니다."
    : "확률을 고르면 그 확률로 한 시도만 모아서 보여 줍니다.";
  probs.forEach(function (p) {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = p + "%";
    b.setAttribute("aria-pressed", logView === p ? "true" : "false");
    b.addEventListener("click", function () {
      logView = p;
      renderLogs();
    });
    probBtns.append(b);
  });

  // 고른 확률의 총 시도·성공·성공률
  logSummary.textContent = "";
  if (typeof logView !== "number") {
    logSummary.hidden = true;
    return;
  }
  const only = logsOf(logView);
  const ok = only.filter(function (x) { return x.ok; }).length;
  logSummary.hidden = false;
  logSummary.append(
    "확률 " + logView + "% 기록: 총 " + only.length + "회 · 성공 " + ok + "회 · 실패 " + (only.length - ok) +
    "회 · 실제 성공률 " + calcRealRate(ok, only.length)
  );
  const small = document.createElement("small");
  small.textContent = "기댓값 약 " + calcExpected(logView).toFixed(1) + "회 · 저장된 최근 " + MAX_SAVED_LOGS + "개 기록 기준";
  logSummary.append(small);
}

// 기록 한 줄 만들기: "3회: 성공!" / "2회: 실패"
// num을 주면 그 번호로(확률별 보기), 안 주면 저장된 회차 번호로 적는다
function makeLogItem(log, num) {
  const li = document.createElement("li");
  if (log.ok) li.className = "ok";
  const main = document.createElement("span");
  main.textContent = (num === undefined ? log.n : num) + "회: " + (log.ok ? "성공!" : "실패");
  const p = document.createElement("span");
  p.className = "p";
  p.textContent = "확률 " + log.p + "%";
  li.append(main, p);
  return li;
}

function renderLast(log) {
  if (!log) {
    lastResult.textContent = "";
    lastResult.className = "last";
    return;
  }
  lastResult.textContent = log.n + "회째 결과: " + (log.ok ? "성공!" : "실패");
  lastResult.className = "last " + (log.ok ? "ok" : "bad");
}

function renderStoreNote() {
  storeNote.textContent = canSave
    ? "확률과 기록은 이 브라우저에 자동 저장됩니다. (최근 " + MAX_SAVED_LOGS + "개까지)"
    : "이 환경에서는 저장되지 않습니다. 새로고침하면 기록이 사라져요. (시뮬레이션은 정상 작동)";
}

function renderAll() {
  renderExpected();
  renderCounter();
  renderLogs();
  renderStoreNote();
}

// ===== 8. 이벤트 연결 =====

// [확률 설정] 버튼
// 같은 확률이면 통계를 그대로 두고, 다른 확률이면 통계를 0부터 다시 센다(applyProb 안에서)
function handleSet() {
  if (applyProb()) renderExpected();
}

// [강화 시도] 버튼
function handleTry() {
  // 입력창 값이 잘못됐으면 시도 불가 (횟수 안 올라감)
  // 입력창에 새 확률을 적고 바로 누르면 [확률 설정]과 똑같이 통계를 0부터 다시 센다
  hideStatNote();
  if (!applyProb()) return;
  renderExpected();

  const ok = rollOnce(state.prob);
  state.total = state.total + 1;          // 총 시도 횟수 1 증가
  if (ok) state.success = state.success + 1;

  const log = { n: state.total, ok: ok, p: state.prob };
  state.logs.push(log);
  if (state.logs.length > MAX_SAVED_LOGS) state.logs.shift(); // 오래된 기록부터 정리

  if (logView === "list") {
    // 목록이 비어 있던 경우("아직 기록이 없습니다")엔 비우고 시작
    if (state.logs.length === 1) logList.textContent = "";
    logList.prepend(makeLogItem(log));
    if (logList.children.length > MAX_SAVED_LOGS) logList.lastElementChild.remove();
  } else {
    renderLogs(); // 확률별 보기 중이면 버튼·통계까지 다시 그리기
  }
  logList.scrollTop = 0;

  renderCounter();
  renderLast(log);
  playEffect(ok);
  saveState();
}

// [초기화] 버튼: 시도 횟수·기록을 비우고, 확률도 처음 값(50%)으로 되돌린다
function handleReset() {
  state.total = 0;
  state.success = 0;
  state.logs = [];
  state.prob = DEFAULT_PROB;       // 설정 확률 50%
  probInput.value = DEFAULT_PROB;  // 입력창도 50
  hideWarn();
  hideStatNote();
  logView = "list";
  clearSaved();                    // 저장된 확률·기록 삭제
  renderAll();
  renderLast(null);
}

setBtn.addEventListener("click", handleSet);
tryBtn.addEventListener("click", handleTry);
resetBtn.addEventListener("click", handleReset);
// [전체 로그 보기] → 확률 고르기, [목록으로 돌아가기] → 전체 목록
allLogBtn.addEventListener("click", function () {
  logView = "pick";
  renderLogs();
});
backBtn.addEventListener("click", function () {
  logView = "list";
  renderLogs();
  allLogBtn.focus();
});
// 입력창에서 Enter를 누르면 [확률 설정]과 같게
probInput.addEventListener("keydown", function (e) {
  if (e.key === "Enter") handleSet();
});

// 처음 시작: 저장된 기록 불러오기 → 없으면 50%로 시작
loadState();
if (state.prob === null) state.prob = DEFAULT_PROB;
probInput.value = state.prob;
renderAll();
if (migrateNote) {
  showStatNote(migrateNote);
  saveState(); // 새 형식(v: 2)으로 저장 — 기록은 그대로
}
</script>
</body>
</html>
