<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘 할 양 계산기</title>
<meta name="description" content="과제 마감일과 총 분량을 넣으면 오늘 할 공부 분량을 나눠 주고, 완료할 때마다 남은 계획을 다시 계산하는 공부 계획 도우미">
<meta name="class" content="O반 (2-5)">
<meta name="status" content="2회 개선">
<style>
  /* ===== 스타일 ===== */
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --text: #1f2328;
    --muted: #5b6370;
    --line: #dde1e6;
    --accent: #1f5fa8;
    --accent-weak: #e8f0fa;
    --warn-bg: #fff4e0;
    --warn-line: #d98a00;
    --warn-text: #7a4a00;
    --err: #b42318;
    --done: #2f6b3a;
    --done-bg: #eaf5ec;
    --imp: #c2410c;
    --imp-bg: #fff1e8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    font-size: 17px;
    line-height: 1.7;
    word-break: keep-all;
    overflow-wrap: break-word;
  }
  .wrap { max-width: 42rem; margin: 0 auto; padding: 24px 16px 48px; }
  header h1 { font-size: 1.6rem; margin: 0 0 4px; line-height: 1.3; }
  header p { margin: 0; color: var(--muted); }
  section { margin-top: 28px; }
  h2 { font-size: 1.15rem; margin: 0 0 12px; }

  .form-box { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-weight: 600; margin-bottom: 4px; }
  .field .hint { font-size: 0.9rem; color: var(--muted); }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .row .field { flex: 1 1 120px; min-width: 0; }
  input, select {
    width: 100%; font: inherit; padding: 8px 10px;
    border: 1px solid #b9c0c8; border-radius: 8px; background: #fff; color: var(--text);
  }
  input:focus, select:focus, button:focus-visible { outline: 3px solid #9cc0ea; outline-offset: 1px; }
  button {
    font: inherit; cursor: pointer; border-radius: 8px; padding: 8px 14px;
    border: 1px solid var(--accent); background: #fff; color: var(--accent);
  }
  button.primary { background: var(--accent); color: #fff; }
  button.danger { border-color: var(--err); color: var(--err); }
  button.danger.solid { background: var(--err); color: #fff; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .msg { margin: 8px 0 0; min-height: 1.7em; font-weight: 600; }
  .msg.error { color: var(--err); }
  .msg.ok { color: var(--done); }

  .list-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .count { color: var(--muted); font-size: 0.95rem; }
  .cards { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .card.is-done { background: var(--done-bg); border-color: #b9dcc0; }
  .warn {
    background: var(--warn-bg); border-left: 4px solid var(--warn-line); color: var(--warn-text);
    border-radius: 6px; padding: 6px 10px; margin-bottom: 10px; font-weight: 600; font-size: 0.95rem;
  }
  .card h3 { margin: 0 0 8px; font-size: 1.1rem; }
  .badge { display: inline-block; font-size: 0.85rem; font-weight: 600; padding: 0 8px; border-radius: 999px; margin-left: 6px; vertical-align: middle; }
  .badge.done { background: var(--done); color: #fff; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 0 0 12px; }
  .stats div { background: var(--bg); border-radius: 8px; padding: 6px 8px; }
  .card.is-done .stats div { background: #fff; }
  .stats dt { font-size: 0.85rem; color: var(--muted); }
  .stats dd { margin: 0; font-weight: 700; }
  .stats .today dd { color: var(--accent); }
  .card-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .empty { color: var(--muted); background: var(--card); border: 1px dashed var(--line); border-radius: 12px; padding: 16px; }

  .tools { display: flex; gap: 8px; flex-wrap: wrap; }
  .confirm { margin-top: 12px; background: var(--card); border: 1px solid var(--err); border-radius: 10px; padding: 12px; }
  .confirm p { margin: 0 0 8px; }
  .notice { margin-top: 36px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 0.95rem; }
  .notice p { margin: 4px 0; }
  .hidden { display: none; }

  /* 오늘 할 일 요약 상자 */
  .summary { margin-top: 20px; background: var(--accent-weak); border: 1px solid #c4d7ee; border-radius: 12px; padding: 14px 16px; }
  .summary h2 { margin-bottom: 6px; }
  .summary-total { margin: 0; font-size: 1.25rem; font-weight: 700; color: var(--accent); }
  .summary-sub { margin: 2px 0 0; color: var(--muted); font-size: 0.95rem; }
  .summary-list { list-style: none; margin: 8px 0 0; padding: 0; font-size: 0.95rem; }
  .summary-list li { display: flex; justify-content: space-between; gap: 8px; border-top: 1px solid #c4d7ee; padding: 4px 0; }
  .summary-list li span:last-child { font-weight: 700; white-space: nowrap; }

  /* 진행률 바 */
  .progress { margin: 0 0 12px; }
  .progress-label { display: flex; justify-content: space-between; font-size: 0.9rem; color: var(--muted); }
  .progress-label strong { color: var(--text); }
  .bar { height: 12px; background: var(--line); border-radius: 999px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--accent); border-radius: 999px; transition: width 0.4s ease; }
  .card.is-done .bar-fill { background: var(--done); }
  @media (prefers-reduced-motion: reduce) { .bar-fill { transition: none; } }

  /* 카드 안 수정 칸 */
  .edit-box { margin: 0 0 12px; padding: 12px; border: 1px solid #c4d7ee; border-radius: 8px; background: var(--accent-weak); }
  .edit-box .field { margin-bottom: 8px; }
  .edit-box .msg:empty { display: none; }
  @media (max-width: 420px) {
    .stats { grid-template-columns: 1fr 1fr; }
    .stats .today { grid-column: 1 / -1; }
  }

  /* 중요 표시 */
  .check { display: flex; align-items: center; gap: 8px; margin: 0 0 12px; font-weight: 600; cursor: pointer; }
  .check input { width: 20px; height: 20px; margin: 0; accent-color: var(--imp); }
  .card.is-important { border-left: 6px solid var(--imp); }
  .badge.imp { background: var(--imp); color: #fff; }
  button.imp-on { border-color: var(--imp); background: var(--imp-bg); color: var(--imp); font-weight: 700; }
  .due-date { margin: -4px 0 10px; color: var(--muted); font-size: 0.92rem; }
  .today-done { margin: 0 0 10px; color: var(--done); font-weight: 700; }

  /* 축하 문구와 폭죽 */
  .cheer {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    width: max-content; max-width: calc(100% - 32px);
    background: var(--done); color: #fff; font-weight: 700; text-align: center;
    padding: 10px 18px; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.18); z-index: 20;
  }
  .confetti { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 19; }
  .confetti span {
    position: absolute; top: -12px; width: 8px; height: 12px; border-radius: 2px;
    animation: fall 1.6s ease-in forwards;
  }
  @keyframes fall {
    to { transform: translate(var(--dx), 105vh) rotate(var(--rot)); opacity: 0.6; }
  }
  @media (prefers-reduced-motion: reduce) { .confetti { display: none; } }
</style>
</head>
<body>
<!-- ===== 화면 구조 ===== -->
<div class="wrap">
  <header>
    <h1>오늘 할 양 계산기</h1>
    <p>마감 날짜와 분량을 넣으면 오늘 할 양을 나눠 드려요. 다 하면 [오늘 완료]를 눌러 남은 계획을 다시 계산하세요.</p>
  </header>

  <!-- 오늘 해야 할 총 공부량 요약 -->
  <section class="summary" aria-labelledby="summary-title">
    <h2 id="summary-title">오늘 할 일 모아보기</h2>
    <p id="summary-total" class="summary-total"></p>
    <p id="summary-sub" class="summary-sub"></p>
    <ul id="summary-list" class="summary-list"></ul>
  </section>

  <section aria-labelledby="form-title">
    <h2 id="form-title">과제 등록</h2>
    <form id="task-form" class="form-box" novalidate>
      <div class="field">
        <label for="in-name">과제명</label>
        <input id="in-name" type="text" maxlength="40" placeholder="예: 수학 수행평가" autocomplete="off">
      </div>
      <div class="row">
        <div class="field">
          <label for="in-due">마감 날짜</label>
          <input id="in-due" type="date">
          <span class="hint">D-Day는 자동 계산</span>
        </div>
        <div class="field">
          <label for="in-amount">총 분량</label>
          <input id="in-amount" type="text" inputmode="numeric" placeholder="예: 100">
          <span class="hint">1~1000</span>
        </div>
        <div class="field">
          <label for="in-unit">단위</label>
          <select id="in-unit">
            <option value="쪽">쪽</option>
            <option value="개">개</option>
            <option value="문제">문제</option>
          </select>
        </div>
      </div>
      <label class="check" for="in-important">
        <input id="in-important" type="checkbox">
        중요한 과제로 표시 (목록 맨 위에 강조돼요)
      </label>
      <button type="submit" class="primary" id="btn-add">등록</button>
      <p id="form-msg" class="msg" role="status" aria-live="polite"></p>
    </form>
  </section>

  <section aria-labelledby="list-title">
    <div class="list-head">
      <h2 id="list-title">과제 목록</h2>
      <span id="task-count" class="count"></span>
    </div>
    <ul id="task-list" class="cards"></ul>
  </section>

  <section aria-labelledby="tools-title">
    <h2 id="tools-title">초기화</h2>
    <div class="tools">
      <button type="button" id="btn-sample">기본 예시 데이터 불러오기</button>
      <button type="button" id="btn-reset" class="danger">모든 데이터 삭제 (전체 초기화)</button>
    </div>
    <!-- 페이지 안 확인창 (alert/confirm 대신 사용) -->
    <div id="confirm-box" class="confirm hidden" role="alertdialog" aria-labelledby="confirm-text">
      <p id="confirm-text"></p>
      <div class="tools">
        <button type="button" id="btn-confirm-yes" class="danger solid">예, 진행할게요</button>
        <button type="button" id="btn-confirm-no">취소</button>
      </div>
    </div>
    <p id="tools-msg" class="msg" role="status" aria-live="polite"></p>
  </section>

  <footer class="notice">
    <p><strong>※ 본 프로그램의 계산 결과는 참고용 가이드입니다.</strong></p>
    <p>주말, 학원 일정, 과목 난이도처럼 내 사정은 직접 판단해서 계획을 조절하세요.</p>
    <p id="storage-msg"></p>
  </footer>
</div>
<!-- 축하 문구 (오늘 완료·과제 완료 때 잠깐 보임) -->
<div id="cheer" class="cheer hidden" role="status" aria-live="polite"></div>

<script>
// ===== 예시 데이터·설정 =====
const STORAGE_KEY = "sih26:20218:tasks"; // 이 앱의 과제만 저장하는 키
const MAX_TASKS = 10;     // 과제는 최대 10개
const MAX_NUMBER = 1000;  // 분량·남은 날짜는 1000 이하
const WARN_LIMIT = 100;   // 하루 할 양이 100을 넘으면 경고
const SAMPLE_TASKS = [   // dday = 오늘부터 며칠 뒤가 마감인지 (불러올 때 날짜로 바꿈)
  { name: "수학 수행평가", dday: 5, remain: 100, unit: "쪽" },
  { name: "영어 단어 암기", dday: 3, remain: 30, unit: "개" }
];
const CHEERS = [          // [오늘 완료] 때 번갈아 보여 줄 응원 문구
  "오늘 몫 끝! 정말 잘했어요.",
  "한 걸음 더 가까워졌어요. 수고했어요!",
  "꾸준함이 최고예요. 오늘도 해냈어요!",
  "오늘 할 일 완료! 이제 푹 쉬어도 돼요."
];
const DAY_MS = 24 * 60 * 60 * 1000;

// ===== 데이터·상태 =====
let tasks = [];             // 과제 목록 (메모리에 항상 보관)
let storageOk = true;       // localStorage를 쓸 수 있는지
let pendingAction = null;   // 확인창에서 '예'를 누르면 실행할 일
let nextId = 1;
let editingId = null;       // 지금 수정 칸이 열린 과제 id (없으면 null)
let editMsg = "";          // 수정 칸에 보여 줄 오류 문구
let cheerTimer = null;
let cheerCount = 0;

// ===== 날짜 도우미 =====

// 날짜를 "2026-10-17" 같은 글자로 (내 컴퓨터 시간 기준)
function dateToText(d) {
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return d.getFullYear() + "-" + m + "-" + day;
}
function todayText() { return dateToText(new Date()); }

// "2026-10-17" → 날짜 번호(일 단위). 형식이 틀리거나 없는 날짜면 null
function dayNumber(text) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(text || "");
  if (!m) return null;
  const y = Number(m[1]), mo = Number(m[2]), d = Number(m[3]);
  const t = Date.UTC(y, mo - 1, d);
  const check = new Date(t);
  if (check.getUTCFullYear() !== y || check.getUTCMonth() !== mo - 1 || check.getUTCDate() !== d) return null;
  return Math.round(t / DAY_MS);
}

// 오늘부터 n일 뒤 날짜 글자
function addDays(n) {
  const d = new Date();
  d.setDate(d.getDate() + n);
  return dateToText(d);
}

// D-Day 자동 계산: 마감 날짜 - 오늘 (0이면 오늘 마감, 음수면 마감 지남)
function getDday(task) {
  return dayNumber(task.due) - dayNumber(todayText());
}

// "10월 22일 (목)" 처럼 보기 좋게
function prettyDate(text) {
  const n = dayNumber(text);
  if (n === null) return text;
  const d = new Date(n * DAY_MS);
  const week = ["일", "월", "화", "수", "목", "금", "토"][d.getUTCDay()];
  return (d.getUTCMonth() + 1) + "월 " + d.getUTCDate() + "일 (" + week + ")";
}

// ===== 처리 함수 =====

// 오늘 몫을 이미 끝냈는지
function doneToday(task) {
  return task.remain > 0 && task.lastDone === todayText();
}

// 남은 분량 ÷ 일할 날을 올림. 일할 날이 0일 이하(마감 당일·지남)면 남은 것 전부.
function splitAmount(remain, days) {
  if (remain <= 0) return 0;
  if (days <= 0) return remain;
  return Math.ceil(remain / days);
}

// 오늘 할 양: 오늘 몫을 이미 끝냈으면 0
function calcToday(task) {
  if (doneToday(task)) return 0;
  return splitAmount(task.remain, getDday(task));
}

// 내일 할 양: 하루가 지나면 남은 날이 1일 줄어든 상태로 다시 나눔
function calcTomorrow(task) {
  return splitAmount(task.remain, getDday(task) - 1);
}

// 경고 조건: 하루 할 양이 100 초과 또는 마감일이 오늘이거나 지났는데(0일 이하) 분량이 남음
function needsWarning(task) {
  if (task.remain <= 0) return false;
  const amount = doneToday(task) ? calcTomorrow(task) : calcToday(task);
  return amount > WARN_LIMIT || getDday(task) <= 0;
}

// 입력 문자열을 0 이상 정수로 바꿈. 숫자가 아니면 null
function parseWholeNumber(text) {
  const t = text.trim();
  if (!/^\d+$/.test(t)) return null;
  return Number(t);
}

// 마감 날짜 검사: 비었거나, 지난 날짜거나, 너무 먼 날짜면 오류 문구
function checkDue(dueText) {
  if (!dueText) return "마감 날짜를 달력에서 골라 주세요.";
  const n = dayNumber(dueText);
  if (n === null) return "올바른 날짜를 골라 주세요.";
  const diff = n - dayNumber(todayText());
  if (diff < 0) return "마감 날짜가 이미 지났어요. 오늘이나 그 뒤 날짜를 골라 주세요.";
  if (diff > MAX_NUMBER) return "마감 날짜는 오늘부터 1000일 안으로 골라 주세요.";
  return "";
}

// 과제 등록: 입력을 검사하고 문제가 없으면 목록에 추가. 오류 문구(없으면 "")를 돌려줌
function addTask(name, dueText, amountText, unit, important) {
  name = name.trim();
  if (name === "" || amountText.trim() === "") {
    return "올바른 값을 입력해 주세요. (과제명, 마감 날짜, 총 분량을 모두 채워 주세요)";
  }
  const dueErr = checkDue(dueText);
  if (dueErr) return dueErr;
  const amount = parseWholeNumber(amountText);
  if (amount === null) return "분량은 숫자로 입력해 주세요. (1 이상 정수)";
  if (amount < 1 || amount > MAX_NUMBER) return "분량은 1부터 1000 사이로 입력해 주세요.";
  if (tasks.length >= MAX_TASKS) return "과제는 최대 10개까지 등록할 수 있어요. 끝난 과제를 삭제해 주세요.";

  tasks.push({ id: nextId++, name: name, due: dueText, remain: amount, total: amount, unit: unit,
    important: !!important, lastDone: "", undo: null });
  saveData();
  return "";
}

// 오늘 완료: 오늘 할 양만큼 빼고, 오늘 몫을 끝냈다고 기록.
// 되돌릴 수 있게 바꾸기 전 상태(undo)를 남겨 둠. 결과: "" | "today" | "all"
function completeToday(id) {
  const task = tasks.find(function (t) { return t.id === id; });
  if (!task || task.remain <= 0 || doneToday(task)) return "";
  task.undo = { remain: task.remain, lastDone: task.lastDone };
  task.remain = Math.max(0, task.remain - calcToday(task)); // 0 아래로 내려가지 않게
  task.lastDone = todayText();
  saveData();
  return task.remain <= 0 ? "all" : "today";
}

// 완료 취소: 마지막 [오늘 완료]를 누르기 전으로 되돌림
function undoComplete(id) {
  const task = tasks.find(function (t) { return t.id === id; });
  if (!task || !task.undo) return false;
  task.remain = task.undo.remain;
  task.lastDone = task.undo.lastDone;
  task.undo = null;
  saveData();
  return true;
}

// 중요 표시 켜기/끄기
function toggleImportant(id) {
  const task = tasks.find(function (t) { return t.id === id; });
  if (!task) return;
  task.important = !task.important;
  saveData();
}

// 과제 수정: 마감 날짜와 남은 분량을 직접 바꿈. 오류 문구(없으면 "")를 돌려줌
// 이미 한 양(전체 - 남은 양)은 그대로 두고, 전체 분량 = 이미 한 양 + 새 남은 분량 으로 다시 맞춤
function editTask(id, dueText, remainText) {
  const task = tasks.find(function (t) { return t.id === id; });
  if (!task) return "과제를 찾을 수 없어요.";
  if (remainText.trim() === "") return "올바른 값을 입력해 주세요. (마감 날짜와 남은 분량을 모두 채워 주세요)";
  const dueErr = checkDue(dueText);
  if (dueErr) return dueErr;
  const remain = parseWholeNumber(remainText);
  if (remain === null) return "남은 분량은 숫자로 입력해 주세요. (0 이상 정수)";
  if (remain > MAX_NUMBER) return "남은 분량은 1000 이하로 입력해 주세요.";

  const doneAmount = task.total - task.remain; // 지금까지 한 양
  task.due = dueText;
  if (remain !== task.remain) task.lastDone = ""; // 분량을 새로 정하면 오늘 할 양도 새로 계산
  task.remain = remain;
  task.total = Math.max(doneAmount + remain, 1);
  task.undo = null; // 직접 고친 뒤에는 이전 완료로 되돌리지 않음
  saveData();
  return "";
}

// 진행률(%): 전체 분량 중 끝낸 양의 비율
function progressPercent(task) {
  if (task.remain <= 0) return 100;
  return Math.round((task.total - task.remain) / task.total * 100);
}

function deleteTask(id) {
  tasks = tasks.filter(function (t) { return t.id !== id; });
  saveData();
}

function loadSamples() {
  tasks = SAMPLE_TASKS.map(function (s) {
    return { id: nextId++, name: s.name, due: addDays(s.dday), remain: s.remain, total: s.remain, unit: s.unit,
      important: false, lastDone: "", undo: null };
  });
  saveData();
}

// 모든 데이터 삭제: 이 앱의 키 하나만 지움 (다른 사이트 데이터는 건드리지 않음)
function clearAll() {
  tasks = [];
  try { localStorage.removeItem(STORAGE_KEY); } catch (e) { storageOk = false; }
}

// 저장: 과제 목록을 글자(JSON)로 바꿔 localStorage에 넣음. 실패해도 메모리 목록은 그대로 동작
function saveData() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    storageOk = true;
  } catch (e) {
    storageOk = false;
  }
}

// 불러오기: 저장된 목록이 있으면 읽고, 없으면(처음 방문) 예시 데이터로 시작
function loadData() {
  let raw = null;
  try {
    raw = localStorage.getItem(STORAGE_KEY);
  } catch (e) {
    storageOk = false;
  }
  if (raw === null) { loadSamples(); return; }
  try {
    const list = JSON.parse(raw);
    if (!Array.isArray(list)) throw new Error("bad");
    tasks = list.filter(function (t) {
      return t && typeof t.name === "string" && Number.isInteger(t.remain) &&
        (dayNumber(t.due) !== null || Number.isInteger(t.dday));
    }).slice(0, MAX_TASKS).map(function (t) {
      // 예전 버전에는 total(전체 분량)이 없었어요 → 없으면 지금 남은 분량을 전체로 봐요(0%에서 시작)
      const total = (Number.isInteger(t.total) && t.total >= t.remain && t.total > 0) ? t.total : Math.max(t.remain, 1);
      // 예전 버전은 마감 날짜 대신 D-Day 숫자만 저장했어요 → 오늘부터 그 날수 뒤를 마감 날짜로 바꿔요
      const due = dayNumber(t.due) !== null ? t.due : addDays(Math.max(0, t.dday));
      const undo = (t.undo && Number.isInteger(t.undo.remain)) ? { remain: t.undo.remain, lastDone: String(t.undo.lastDone || "") } : null;
      return { id: nextId++, name: t.name, due: due, remain: t.remain, total: total, unit: t.unit || "쪽",
        important: !!t.important, lastDone: typeof t.lastDone === "string" ? t.lastDone : "", undo: undo };
    });
    saveData(); // 바뀐 형식으로 다시 저장
  } catch (e) {
    loadSamples(); // 저장 내용이 깨졌으면 예시로 다시 시작
  }
}

// 목록 순서: 안 끝난 중요 과제 → 안 끝난 과제 → 끝난 과제, 같은 묶음 안에서는 마감이 빠른 순
function sortedTasks() {
  function group(t) { return t.remain <= 0 ? 2 : (t.important ? 0 : 1); }
  return tasks.slice().sort(function (a, b) {
    return (group(a) - group(b)) || (dayNumber(a.due) - dayNumber(b.due)) || (a.id - b.id);
  });
}

// ===== 화면 갱신 =====

function ddayLabel(dday) {
  if (dday === 0) return "D-Day (오늘)";
  if (dday < 0) return "마감 " + (-dday) + "일 지남";
  return "D-" + dday + " (" + dday + "일 남음)";
}

// 과제 카드 목록 그리기 (사용자 입력은 textContent로 넣어 안전하게)
function renderTasks() {
  const list = document.getElementById("task-list");
  list.innerHTML = "";
  document.getElementById("task-count").textContent = tasks.length + " / " + MAX_TASKS + "개";

  if (tasks.length === 0) {
    const li = document.createElement("li");
    li.className = "empty";
    li.textContent = "등록된 과제가 없어요. 위에서 과제를 등록하거나 예시 데이터를 불러오세요.";
    list.appendChild(li);
  }

  sortedTasks().forEach(function (task) {
    const done = task.remain <= 0;
    const finishedToday = doneToday(task);
    const dday = getDday(task);
    const today = calcToday(task);
    const li = document.createElement("li");
    li.className = "card" + (done ? " is-done" : "") + (task.important && !done ? " is-important" : "");
    li.dataset.id = task.id;

    if (needsWarning(task)) {
      const w = document.createElement("div");
      w.className = "warn";
      w.textContent = "주의: 하루 목표치가 너무 많아요! 마감일을 확인해 보세요";
      li.appendChild(w);
    }

    const h = document.createElement("h3");
    h.textContent = task.name;
    if (task.important) {
      const b = document.createElement("span");
      b.className = "badge imp";
      b.textContent = "★ 중요";
      h.appendChild(b);
    }
    if (done) {
      const b = document.createElement("span");
      b.className = "badge done";
      b.textContent = "완료됨";
      h.appendChild(b);
    }
    li.appendChild(h);

    const dueP = document.createElement("p");
    dueP.className = "due-date";
    dueP.textContent = "마감: " + prettyDate(task.due);
    li.appendChild(dueP);

    const dl = document.createElement("dl");
    dl.className = "stats";
    addStat(dl, "D-Day", done ? "-" : ddayLabel(dday), "dday");
    addStat(dl, "남은 분량", task.remain + task.unit, "remain");
    let todayLabel = "오늘 할 양";
    let todayText = today + task.unit;
    if (done) todayText = "모두 끝났어요";
    else if (finishedToday) { todayLabel = "내일 할 양"; todayText = calcTomorrow(task) + task.unit; }
    else if (dday === 0) todayText += " (오늘 마감!)";
    else if (dday < 0) todayText += " (마감 지남!)";
    addStat(dl, todayLabel, todayText, "today");
    li.appendChild(dl);

    if (finishedToday) {
      const p = document.createElement("p");
      p.className = "today-done";
      p.textContent = "✔ 오늘 몫을 끝냈어요! 내일 다시 [오늘 완료]를 누를 수 있어요.";
      li.appendChild(p);
    }

    // 진행률 바: 전체 분량 대비 끝낸 양
    const pct = progressPercent(task);
    const prog = document.createElement("div");
    prog.className = "progress";
    const pLabel = document.createElement("div");
    pLabel.className = "progress-label";
    const pLeft = document.createElement("span");
    pLeft.textContent = "진행률 (" + (task.total - task.remain) + " / " + task.total + task.unit + ")";
    const pRight = document.createElement("strong");
    pRight.textContent = pct + "% 완료";
    pLabel.appendChild(pLeft);
    pLabel.appendChild(pRight);
    const bar = document.createElement("div");
    bar.className = "bar";
    bar.setAttribute("role", "progressbar");
    bar.setAttribute("aria-valuemin", "0");
    bar.setAttribute("aria-valuemax", "100");
    bar.setAttribute("aria-valuenow", String(pct));
    bar.setAttribute("aria-label", task.name + " 진행률");
    const fill = document.createElement("div");
    fill.className = "bar-fill";
    fill.style.width = pct + "%";
    bar.appendChild(fill);
    prog.appendChild(pLabel);
    prog.appendChild(bar);
    li.appendChild(prog);

    // 수정 칸: [수정]을 누른 카드에만 열림
    if (editingId === task.id) li.appendChild(makeEditBox(task));

    const actions = document.createElement("div");
    actions.className = "card-actions";
    const btnDone = document.createElement("button");
    btnDone.type = "button";
    btnDone.className = "primary";
    btnDone.dataset.action = "complete";
    btnDone.textContent = done ? "완료됨" : (finishedToday ? "오늘 몫 완료" : "오늘 완료");
    btnDone.disabled = done || finishedToday;
    btnDone.setAttribute("aria-label", task.name + " 오늘 완료");
    actions.appendChild(btnDone);
    if (task.undo) {
      const btnUndo = document.createElement("button");
      btnUndo.type = "button";
      btnUndo.dataset.action = "undo";
      btnUndo.textContent = "완료 취소";
      btnUndo.setAttribute("aria-label", task.name + " 방금 한 완료 취소");
      actions.appendChild(btnUndo);
    }
    const btnImp = document.createElement("button");
    btnImp.type = "button";
    btnImp.dataset.action = "important";
    btnImp.className = task.important ? "imp-on" : "";
    btnImp.textContent = task.important ? "★ 중요 해제" : "☆ 중요 표시";
    btnImp.setAttribute("aria-pressed", task.important ? "true" : "false");
    btnImp.setAttribute("aria-label", task.name + " 중요 표시");
    const btnEdit = document.createElement("button");
    btnEdit.type = "button";
    btnEdit.dataset.action = "edit";
    btnEdit.textContent = "수정";
    btnEdit.setAttribute("aria-label", task.name + " 마감 날짜·남은 분량 수정");
    btnEdit.setAttribute("aria-expanded", editingId === task.id ? "true" : "false");
    const btnDel = document.createElement("button");
    btnDel.type = "button";
    btnDel.className = "danger";
    btnDel.dataset.action = "delete";
    btnDel.textContent = "삭제";
    btnDel.setAttribute("aria-label", task.name + " 삭제");
    actions.appendChild(btnImp);
    actions.appendChild(btnEdit);
    actions.appendChild(btnDel);
    li.appendChild(actions);

    list.appendChild(li);
  });

  renderSummary();
  renderStorageMsg();
}

// 카드 안 수정 칸 만들기 (마감 날짜, 남은 분량 입력 + 저장/취소)
function makeEditBox(task) {
  const box = document.createElement("div");
  box.className = "edit-box";
  const row = document.createElement("div");
  row.className = "row";
  row.appendChild(makeEditField("edit-due-" + task.id, "마감 날짜", task.due, "달력에서 다시 고르기", "date"));
  row.appendChild(makeEditField("edit-remain-" + task.id, "남은 분량 (" + task.unit + ")", task.remain, "0이면 완료로 바뀌어요", "text"));
  box.appendChild(row);
  const tools = document.createElement("div");
  tools.className = "card-actions";
  const save = document.createElement("button");
  save.type = "button";
  save.className = "primary";
  save.dataset.action = "edit-save";
  save.textContent = "저장";
  const cancel = document.createElement("button");
  cancel.type = "button";
  cancel.dataset.action = "edit-cancel";
  cancel.textContent = "취소";
  tools.appendChild(save);
  tools.appendChild(cancel);
  box.appendChild(tools);
  const msg = document.createElement("p");
  msg.className = "msg error";
  msg.setAttribute("role", "status");
  msg.textContent = editMsg;
  box.appendChild(msg);
  return box;
}

function makeEditField(id, labelText, value, hintText, type) {
  const f = document.createElement("div");
  f.className = "field";
  const label = document.createElement("label");
  label.htmlFor = id;
  label.textContent = labelText;
  const input = document.createElement("input");
  input.id = id;
  input.type = type;
  if (type === "date") input.min = todayText();
  else input.inputMode = "numeric";
  input.value = String(value);
  const hint = document.createElement("span");
  hint.className = "hint";
  hint.textContent = hintText;
  f.appendChild(label);
  f.appendChild(input);
  f.appendChild(hint);
  return f;
}

// 오늘 할 일 요약: 끝나지 않은 과제의 '오늘 할 양'을 단위(쪽/개/문제)별로 더함
function renderSummary() {
  const active = sortedTasks().filter(function (t) { return t.remain > 0; });
  const doneCount = tasks.length - active.length;
  const todo = active.filter(function (t) { return !doneToday(t); });
  const sums = {}; // 예: { "쪽": 20, "개": 10 }
  const order = [];
  todo.forEach(function (t) {
    if (!(t.unit in sums)) { sums[t.unit] = 0; order.push(t.unit); }
    sums[t.unit] += calcToday(t);
  });

  const totalEl = document.getElementById("summary-total");
  const subEl = document.getElementById("summary-sub");
  const listEl = document.getElementById("summary-list");
  listEl.innerHTML = "";

  if (tasks.length === 0) {
    totalEl.textContent = "등록된 과제가 없어요.";
    subEl.textContent = "";
    return;
  }
  if (todo.length === 0) {
    totalEl.textContent = "오늘 할 공부를 모두 끝냈어요!";
  } else {
    totalEl.textContent = "오늘 총 " + order.map(function (u) { return sums[u] + u; }).join(" + ");
  }
  subEl.textContent = "남은 과제 " + active.length + "개 · 끝낸 과제 " + doneCount + "개 (전체 " + tasks.length + "개)";

  active.forEach(function (t) {
    const li = document.createElement("li");
    const a = document.createElement("span");
    a.textContent = (t.important ? "★ " : "") + t.name;
    const b = document.createElement("span");
    b.textContent = doneToday(t) ? "오늘 몫 완료" : calcToday(t) + t.unit;
    li.appendChild(a);
    li.appendChild(b);
    listEl.appendChild(li);
  });
}

function addStat(dl, label, value, cls) {
  const box = document.createElement("div");
  box.className = cls;
  const dt = document.createElement("dt");
  dt.textContent = label;
  const dd = document.createElement("dd");
  dd.textContent = value;
  box.appendChild(dt);
  box.appendChild(dd);
  dl.appendChild(box);
}

function renderStorageMsg() {
  document.getElementById("storage-msg").textContent = storageOk
    ? "과제 목록은 이 브라우저에 자동 저장돼요."
    : "이 환경에서는 저장되지 않아요. 새로고침하면 목록이 사라지지만 계산은 그대로 쓸 수 있어요.";
}

function showMessage(elId, text, isError) {
  const el = document.getElementById(elId);
  el.textContent = text;
  el.className = "msg " + (isError ? "error" : "ok");
}

// 축하 효과: 화면 아래 응원 문구 + 위에서 떨어지는 색종이(움직임 줄이기 설정이면 문구만)
function celebrate(kind, task) {
  const cheer = document.getElementById("cheer");
  if (kind === "all") {
    cheer.textContent = "🎉 '" + task.name + "' 과제를 모두 끝냈어요! 대단해요!";
  } else {
    cheer.textContent = CHEERS[cheerCount % CHEERS.length];
    cheerCount++;
  }
  cheer.classList.remove("hidden");
  clearTimeout(cheerTimer);
  cheerTimer = setTimeout(function () { cheer.classList.add("hidden"); }, 2600);

  const old = document.querySelector(".confetti");
  if (old) old.remove();
  const box = document.createElement("div");
  box.className = "confetti";
  box.setAttribute("aria-hidden", "true");
  const colors = ["#1f5fa8", "#2f6b3a", "#d98a00", "#c2410c", "#7c3aed", "#0f766e"];
  const pieces = kind === "all" ? 60 : 24;
  for (let i = 0; i < pieces; i++) {
    const s = document.createElement("span");
    s.style.left = (Math.random() * 100) + "%";
    s.style.background = colors[i % colors.length];
    s.style.animationDelay = (Math.random() * 0.4) + "s";
    s.style.setProperty("--dx", (Math.random() * 120 - 60) + "px");
    s.style.setProperty("--rot", (Math.random() * 720 - 360) + "deg");
    box.appendChild(s);
  }
  document.body.appendChild(box);
  setTimeout(function () { box.remove(); }, 2200);
}

// 페이지 안 확인창 열기/닫기
function askConfirm(text, action) {
  pendingAction = action;
  document.getElementById("confirm-text").textContent = text;
  document.getElementById("confirm-box").classList.remove("hidden");
  document.getElementById("btn-confirm-no").focus();
}
function closeConfirm() {
  pendingAction = null;
  document.getElementById("confirm-box").classList.add("hidden");
}

// ===== 이벤트 연결 =====
document.getElementById("task-form").addEventListener("submit", function (e) {
  e.preventDefault();
  const nameEl = document.getElementById("in-name");
  const dueEl = document.getElementById("in-due");
  const amountEl = document.getElementById("in-amount");
  const impEl = document.getElementById("in-important");
  const err = addTask(nameEl.value, dueEl.value, amountEl.value, document.getElementById("in-unit").value, impEl.checked);
  if (err) {
    showMessage("form-msg", err, true);
    return;
  }
  showMessage("form-msg", "등록했어요: " + nameEl.value.trim(), false);
  nameEl.value = ""; dueEl.value = ""; amountEl.value = ""; impEl.checked = false;
  nameEl.focus();
  renderTasks();
});

// 카드 안 버튼은 목록 하나에서 한꺼번에 처리
document.getElementById("task-list").addEventListener("click", function (e) {
  const btn = e.target.closest("button[data-action]");
  if (!btn) return;
  const id = Number(btn.closest(".card").dataset.id);
  const action = btn.dataset.action;
  let focusSel = null; // 화면을 다시 그린 뒤 포커스를 둘 곳
  if (action === "complete") {
    const result = completeToday(id);
    if (result) {
      celebrate(result, tasks.find(function (t) { return t.id === id; }));
      focusSel = '.card[data-id="' + id + '"] button[data-action="undo"]';
    }
  }
  if (action === "undo") {
    if (undoComplete(id)) {
      showCheerText("완료를 취소했어요. 다시 [오늘 완료]를 누를 수 있어요.");
      focusSel = '.card[data-id="' + id + '"] button[data-action="complete"]';
    }
  }
  if (action === "important") {
    toggleImportant(id);
    focusSel = '.card[data-id="' + id + '"] button[data-action="important"]';
  }
  if (action === "delete") { deleteTask(id); if (editingId === id) editingId = null; }
  if (action === "edit") {
    // 같은 카드의 [수정]을 다시 누르면 닫힘
    editingId = (editingId === id) ? null : id;
    editMsg = "";
    if (editingId !== null) focusSel = "#edit-due-" + id;
  }
  if (action === "edit-cancel") { editingId = null; editMsg = ""; }
  if (action === "edit-save") {
    const err = editTask(id,
      document.getElementById("edit-due-" + id).value,
      document.getElementById("edit-remain-" + id).value);
    if (err) {
      editMsg = err;
      // 잘못 입력한 값은 그대로 남겨 두고 오류만 보여 줌
      btn.closest(".edit-box").querySelector(".msg").textContent = err;
      return;
    }
    editingId = null; editMsg = "";
  }
  renderTasks();
  if (focusSel) {
    const el = document.querySelector(focusSel);
    if (el) el.focus();
  }
});

// 축하가 아닌 짧은 안내 문구(완료 취소 등)
function showCheerText(text) {
  const cheer = document.getElementById("cheer");
  cheer.textContent = text;
  cheer.classList.remove("hidden");

// 수정 칸에서 Enter를 누르면 [저장]과 같게 동작

document.getElementById("btn-sample").addEventListener("click", function () {
  const run = function () {
    loadSamples();
    renderTasks();
    showMessage("tools-msg", "기본 예시 데이터를 불러왔어요.", false);
  };
  if (tasks.length > 0) askConfirm("지금 목록을 지우고 예시 데이터로 바꿀까요?", run);
  else run();
});

document.getElementById("btn-reset").addEventListener("click", function () {
  askConfirm("모든 과제를 삭제할까요? 되돌릴 수 없어요.", function () {
    clearAll();
    renderTasks();
    showMessage("tools-msg", "모든 데이터를 삭제했어요.", false);
  });
});

document.getElementById("btn-confirm-yes").addEventListener("click", function () {
  const action = pendingAction;
  closeConfirm();
  if (action) action();
});
document.getElementById("btn-confirm-no").addEventListener("click", function () {
  closeConfirm();
  showMessage("tools-msg", "취소했어요.", false);
});

// 날짜가 바뀐 뒤 다시 화면을 보면 D-Day를 새로 계산
let shownDay = todayText();
document.addEventListener("visibilitychange", function () {
  if (document.visibilityState === "visible" && todayText() !== shownDay) {
    shownDay = todayText();
    renderTasks();
  }
});

// 시작
document.getElementById("in-due").min = todayText();
loadData();
renderTasks();
</script>
</body>
</html>
