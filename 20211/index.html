<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>집중 공부 타이머</title>
<meta name="description" content="15분·25분·50분 중 공부 시간을 골라 카운트다운하고, 끝나면 5분 휴식으로 이어 주는 공부 타이머">
<meta name="class" content="O반 (2-5)">
<meta name="status" content="PRD">
<style>
  :root {
    --bg: #f5f7f8;
    --card: #ffffff;
    --text: #1d2327;
    --muted: #5b666e;
    --line: #d7dde2;
    --accent: #0f766e;
    --accent-weak: #e3f3f1;
    --rest: #1d5fa8;
    --rest-weak: #e6eefa;
    --warn: #8a5a00;
    --warn-weak: #fff5dc;
    --ok: #1a7f37;
    --ok-weak: #e8f5ec;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    font-size: 17px;
    line-height: 1.7;
    word-break: keep-all;
    overflow-wrap: anywhere;
  }
  .wrap { max-width: 32rem; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; line-height: 1.3; }
  .intro { color: var(--muted); margin: 0 0 20px; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 24px 16px;
    margin-bottom: 16px;
  }

  /* 상단: 상태 표시 */
  .status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 4px 14px;
    border-radius: 999px;
    font-weight: 700;
    background: #eef1f3;
    color: var(--muted);
  }
  .status[data-phase="study"] { background: var(--accent-weak); color: var(--accent); }
  .status[data-phase="break"] { background: var(--rest-weak); color: var(--rest); }
  .status[data-phase="breakReady"] { background: var(--ok-weak); color: var(--ok); }
  .status[data-phase="paused"] { background: var(--warn-weak); color: var(--warn); }
  .status .icon { font-size: 1.1rem; line-height: 1; }

  /* 중앙: 큰 남은 시간 */
  .time {
    font-size: clamp(4rem, 22vw, 6.5rem);
    font-weight: 800;
    line-height: 1.1;
    margin: 16px 0 4px;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
  }
  .time-label { color: var(--muted); margin: 0; font-size: 0.95rem; }

  /* 하단: 버튼들 */
  .group-title { font-weight: 700; margin: 0 0 8px; font-size: 1rem; }
  .modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 20px; }
  .controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  button {
    font: inherit;
    font-weight: 700;
    min-height: 48px;
    padding: 8px 6px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--text);
    cursor: pointer;
  }
  button:hover { border-color: #aab4bc; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .mode[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-main { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-main:hover { border-color: var(--accent); filter: brightness(1.08); }
  .btn-rest {
    width: 100%;
    margin-top: 12px;
    background: var(--rest);
    border-color: var(--rest);
    color: #fff;
  }
  .btn-rest[hidden] { display: none; }

  /* 경고·안내 문구 영역 */
  .msg { min-height: 1.7em; margin: 16px 0 0; padding: 0; border-radius: 10px; font-weight: 600; }
  .msg:not(:empty) { padding: 10px 14px; }
  .msg.warn { background: var(--warn-weak); color: var(--warn); }
  .msg.done { background: var(--ok-weak); color: var(--ok); }
  .msg.info { background: var(--rest-weak); color: var(--rest); }

  .notice { font-size: 0.95rem; color: var(--muted); margin: 8px 0 0; padding-left: 12px; border-left: 3px solid var(--line); }
</style>
</head>
<body>
<main class="wrap">
  <h1>집중 공부 타이머</h1>
  <p class="intro">공부 시간을 고르고 시작을 누르세요. 시간이 다 되면 5분 휴식으로 이어갈 수 있어요.</p>

  <section class="card" aria-label="타이머">
    <!-- 상단: 지금 상태 -->
    <div id="status" class="status" data-phase="idle" role="status" aria-live="polite">
      <span class="icon" id="statusIcon" aria-hidden="true">⏸️</span>
      <span id="statusText">대기 중</span>
    </div>

    <!-- 중앙: 남은 시간 (MM:SS) -->
    <p class="time" id="timeDisplay" aria-label="남은 시간">25:00</p>
    <p class="time-label" id="timeLabel">공부 25분 준비</p>

    <!-- '휴식 시작' 버튼은 공부가 끝났을 때만 보인다 -->
    <button type="button" class="btn-rest" id="breakBtn" hidden>☕ 휴식 시작 (5분)</button>

    <!-- 경고·안내 문구 영역 -->
    <p class="msg" id="message" role="alert" aria-live="assertive"></p>
  </section>

  <section class="card" aria-label="조작">
    <p class="group-title" id="modeTitle">공부 시간 모드</p>
    <div class="modes" role="group" aria-labelledby="modeTitle">
      <button type="button" class="mode" data-minutes="15" aria-pressed="false">15분</button>
      <button type="button" class="mode" data-minutes="25" aria-pressed="true">25분</button>
      <button type="button" class="mode" data-minutes="50" aria-pressed="false">50분</button>
    </div>

    <div class="controls">
      <button type="button" class="btn-main" id="startBtn">시작</button>
      <button type="button" id="pauseBtn">일시정지</button>
      <button type="button" id="resetBtn">초기화</button>
    </div>
  </section>

  <p class="notice">정해진 시간은 참고용이에요. 자신의 컨디션에 맞추어 유연하게 휴식을 취하세요.</p>
</main>

<script>
  // ===== 기본 설정값 =====
  const DEFAULT_MINUTES = 25;   // 처음 화면과 초기화 후에 선택되는 공부 시간
  const BREAK_MINUTES = 5;      // 휴식 시간
  const PAGE_TITLE = document.title;

  // ===== 상태를 기억하는 변수들 =====
  // isTimerRunning: 지금 시간이 줄어들고 있는지(true) 멈춰 있는지(false)를 기억한다.
  //                 '시작'을 두 번 눌러 타이머가 겹치는 것을 막는 데 쓴다.
  let isTimerRunning = false;
  // phase: 지금 어떤 단계인지
  //   'idle'(대기 중) → 'study'(공부 중) → 'breakReady'(휴식 준비) → 'break'(휴식 중) → 'idle'
  let phase = 'idle';
  let isPaused = false;          // 일시정지 상태인지
  let selectedMinutes = DEFAULT_MINUTES;
  let remainingSeconds = DEFAULT_MINUTES * 60; // 화면에 보이는 남은 시간(초)
  let endTime = 0;               // 타이머가 끝날 '시각'(밀리초)
  let timerId = null;            // setInterval이 돌려준 번호. clearInterval로 멈출 때 필요하다.

  // ===== 화면 요소 =====
  const statusBox = document.getElementById('status');
  const statusIcon = document.getElementById('statusIcon');
  const statusText = document.getElementById('statusText');
  const timeDisplay = document.getElementById('timeDisplay');
  const timeLabel = document.getElementById('timeLabel');
  const message = document.getElementById('message');
  const startBtn = document.getElementById('startBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const resetBtn = document.getElementById('resetBtn');
  const breakBtn = document.getElementById('breakBtn');
  const modeButtons = document.querySelectorAll('.mode');

  // 초(예: 1500)를 "25:00" 모양의 글자로 바꾼다.
  function formatTime(totalSeconds) {
    const minutes = Math.floor(totalSeconds / 60);
    const seconds = totalSeconds % 60;
    return String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0');
  }

  // 안내 문구를 보여 준다. kind: 'warn'(경고) / 'done'(완료) / 'info'(안내)
  function showMessage(text, kind) {
    message.textContent = text;
    message.className = 'msg' + (text ? ' ' + kind : '');
  }

  // 지금 상태에 맞게 상태 표시·남은 시간·버튼 글자를 다시 그린다.
  function render() {
    let icon = '⏸️';
    let text = '대기 중';
    let look = 'idle';
    if (phase === 'study') { icon = '📖'; text = '공부 중'; look = 'study'; }
    if (phase === 'breakReady') { icon = '✅'; text = '휴식 준비'; look = 'breakReady'; }
    if (phase === 'break') { icon = '☕'; text = '휴식 중'; look = 'break'; }
    if (isPaused) { icon = '⏸️'; text = text + ' (일시정지)'; look = 'paused'; }

    statusIcon.textContent = icon;
    statusText.textContent = text;
    statusBox.dataset.phase = look;

    timeDisplay.textContent = formatTime(remainingSeconds);
    timeDisplay.setAttribute('aria-label', '남은 시간 ' + Math.floor(remainingSeconds / 60) + '분 ' + (remainingSeconds % 60) + '초');

    if (phase === 'breakReady') {
      timeLabel.textContent = '공부 끝 · 다음은 휴식 ' + BREAK_MINUTES + '분';
    } else if (phase === 'break') {
      timeLabel.textContent = '휴식 ' + BREAK_MINUTES + '분';
    } else {
      timeLabel.textContent = '공부 ' + selectedMinutes + '분' + (phase === 'idle' ? ' 준비' : '');
    }

    startBtn.textContent = isPaused ? '이어서 시작' : '시작';
    breakBtn.hidden = phase !== 'breakReady';

    // 작동 중일 때는 브라우저 탭 제목에도 남은 시간을 보여 준다.
    if (isTimerRunning) {
      document.title = formatTime(remainingSeconds) + ' ' + text + ' · ' + PAGE_TITLE;
    } else {
      document.title = PAGE_TITLE;
    }
  }

  // ===== 1초마다 실행되는 함수 =====
  function tick() {
    // 남은 시간을 "끝나는 시각 - 지금 시각"으로 계산한다.
    // 그냥 1씩 빼기만 하면, 다른 탭을 보는 동안 브라우저가 타이머를 느리게 돌려서
    // 시간이 실제보다 늦게 줄어들 수 있다. 시계 기준으로 계산하면 항상 정확하다.
    const msLeft = endTime - Date.now();
    remainingSeconds = Math.max(0, Math.ceil(msLeft / 1000));
    render();

    // 조건문(if): 남은 시간이 0이 되면 타이머를 멈추고 다음 단계로 넘어간다.
    if (remainingSeconds <= 0) {
      stopInterval();
      if (phase === 'study') {
        phase = 'breakReady';
        remainingSeconds = 0; // 00:00에서 멈춘 채로 휴식 시작을 기다린다
        render();
        showMessage('🎉 공부 완료! 휴식을 시작하세요', 'done');
        breakBtn.focus();
      } else if (phase === 'break') {
        phase = 'idle';
        remainingSeconds = selectedMinutes * 60;
        render();
        showMessage('⏰ 휴식이 끝났어요. 준비되면 다시 시작을 누르세요.', 'info');
      }
    }
  }

  // 타이머를 움직이기 시작한다.
  function runInterval() {
    endTime = Date.now() + remainingSeconds * 1000;
    isTimerRunning = true;
    // setInterval(할 일, 간격): '간격'(밀리초)마다 '할 일'을 반복한다. 1000밀리초 = 1초.
    // 돌려받은 번호(timerId)를 저장해 두어야 나중에 멈출 수 있다.
    timerId = setInterval(tick, 1000);
    render();
  }

  // 타이머를 멈춘다.
  function stopInterval() {
    // clearInterval(번호): setInterval로 시작한 반복을 멈춘다.
    clearInterval(timerId);
    timerId = null;
    isTimerRunning = false;
  }

  // ===== 버튼 동작 =====
  startBtn.addEventListener('click', function () {
    // 이미 작동 중이면 새 타이머를 만들지 않고 경고만 보여 준다. (중복 실행 방지)
    if (isTimerRunning === true) {
      showMessage('⚠️ 이미 타이머가 작동 중입니다.', 'warn');
      return;
    }
    if (phase === 'breakReady') {
      showMessage('공부 시간이 끝났어요. 위의 ‘휴식 시작’ 버튼을 눌러 주세요.', 'info');
      return;
    }
    if (isPaused) {
      // 일시정지했던 곳부터 이어서 간다.
      isPaused = false;
      showMessage('', '');
      runInterval();
      return;
    }
    // 대기 중이면 선택한 모드 시간으로 공부를 시작한다.
    phase = 'study';
    remainingSeconds = selectedMinutes * 60;
    showMessage('', '');
    runInterval();
  });

  pauseBtn.addEventListener('click', function () {
    if (isTimerRunning === false) {
      showMessage(isPaused ? '이미 일시정지 상태예요. ‘이어서 시작’을 누르면 계속돼요.' : '작동 중인 타이머가 없어요.', 'info');
      return;
    }
    // 멈추기 전에 남은 시간을 정확히 계산해 둔다.
    remainingSeconds = Math.max(0, Math.ceil((endTime - Date.now()) / 1000));
    stopInterval();
    isPaused = true;
    showMessage('일시정지했어요. ‘이어서 시작’을 누르면 계속돼요.', 'info');
    render();
  });

  resetBtn.addEventListener('click', function () {
    // 모든 것을 처음 상태(25분, 대기 중)로 되돌린다.
    stopInterval();
    isPaused = false;
    phase = 'idle';
    setMode(DEFAULT_MINUTES);
    showMessage('', '');
    render();
  });

  breakBtn.addEventListener('click', function () {
    if (phase !== 'breakReady') return;
    phase = 'break';
    remainingSeconds = BREAK_MINUTES * 60;
    showMessage('', '');
    runInterval();
    startBtn.focus();
  });

  // 모드(15/25/50분)를 바꾸고 버튼 모양도 맞춘다.
  function setMode(minutes) {
    selectedMinutes = minutes;
    remainingSeconds = minutes * 60;
    modeButtons.forEach(function (btn) {
      btn.setAttribute('aria-pressed', String(Number(btn.dataset.minutes) === minutes));
    });
  }

  modeButtons.forEach(function (btn) {
    btn.addEventListener('click', function () {
      // 타이머가 돌고 있거나 멈춰 있거나 휴식 단계면 모드를 바꾸지 않는다.
      if (isTimerRunning || isPaused || phase !== 'idle') {
        showMessage('⚠️ 타이머를 사용하는 중에는 모드를 바꿀 수 없어요. 먼저 ‘초기화’를 눌러 주세요.', 'warn');
        return;
      }
      setMode(Number(btn.dataset.minutes));
      showMessage('', '');
      render();
    });
  });

  render();
</script>
</body>
</html>
