<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>쉬는 시간 매점 대기순서 계산기</title>
<meta name="description" content="매점 대기 줄을 큐(먼저 온 사람이 먼저 나가는 구조)로 관리하고, 예상 대기 시간과 남은 쉬는 시간 안에 사 올 수 있는지를 신호등으로 보여 주는 계산기">
<meta name="class" content="O반 (2-5)">
<meta name="status" content="PRD">
<style>
  :root {
    --bg: #f4f7f7;
    --card: #ffffff;
    --text: #1d2426;
    --muted: #56636a;
    --line: #d5dee0;
    --accent: #0f6e6e;
    --accent-weak: #e3f2f1;
    --ok: #1a7f37;
    --ok-weak: #e7f5eb;
    --warn: #8a5a00;
    --warn-weak: #fff4d6;
    --err: #b42318;
    --err-weak: #fdecea;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    font-size: 17px;
    line-height: 1.7;
    word-break: keep-all;
    overflow-wrap: anywhere;
  }
  .wrap { max-width: 42rem; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; line-height: 1.3; }
  h2 { font-size: 1.1rem; margin: 0 0 12px; }
  .intro { color: var(--muted); margin: 0 0 20px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 20px 16px;
    margin-bottom: 16px;
  }
  label { display: block; font-weight: 600; margin: 0 0 4px; }
  .hint { display: block; font-size: 0.9rem; color: var(--muted); font-weight: 400; }
  .field + .field { margin-top: 18px; }
  .time-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .time-row .unit { color: var(--muted); }
  input[type="number"] {
    width: 7rem;
    font: inherit;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    color: var(--text);
  }
  input[type="number"]:focus-visible, input[type="range"]:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  input[type="number"][aria-invalid="true"] { border-color: var(--err); }
  input[type="range"] { width: 100%; accent-color: var(--accent); margin: 4px 0 0; }
  .slider-value { font-weight: 700; color: var(--accent); }
  button {
    font: inherit;
    min-height: 44px;
    padding: 8px 16px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    color: var(--text);
    cursor: pointer;
  }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .btn-outline { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .btn-danger { border-color: var(--err); color: var(--err); }

  .msg { margin: 8px 0 0; font-size: 0.95rem; min-height: 0; }
  .msg:empty { display: none; }
  .msg.error { color: var(--err); background: var(--err-weak); padding: 8px 12px; border-radius: 8px; }
  .msg.info { color: var(--warn); background: var(--warn-weak); padding: 8px 12px; border-radius: 8px; }

  /* 가운데: 대기 인원과 결과 */
  .count-label { color: var(--muted); margin: 0; }
  .count-big { font-size: 3.2rem; font-weight: 800; line-height: 1.1; margin: 0 0 4px; }
  .count-big small { font-size: 1.2rem; font-weight: 600; margin-left: 4px; }
  .my-turn { margin: 0 0 16px; }
  .result { border-top: 1px solid var(--line); padding-top: 16px; }
  .result[hidden] { display: none; }
  .wait { margin: 0 0 10px; font-size: 1.15rem; }
  .wait strong { font-size: 1.5rem; }
  .status {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--line);
  }
  .lights { display: flex; gap: 6px; flex-shrink: 0; }
  .lights span {
    width: 18px; height: 18px; border-radius: 50%;
    background: #dfe4e6; border: 1px solid #c4cdd0;
  }
  .status-text { font-weight: 700; font-size: 1.2rem; }
  .status-sub { display: block; font-weight: 400; font-size: 0.92rem; color: var(--muted); }
  .status.ok { background: var(--ok-weak); border-color: var(--ok); }
  .status.ok .status-text { color: var(--ok); }
  .status.ok .lights .g { background: var(--ok); border-color: var(--ok); }
  .status.warn { background: var(--warn-weak); border-color: var(--warn); }
  .status.warn .status-text { color: var(--warn); }
  .status.warn .lights .y { background: #d99a00; border-color: var(--warn); }
  .status.bad { background: var(--err-weak); border-color: var(--err); }
  .status.bad .status-text { color: var(--err); }
  .status.bad .lights .r { background: var(--err); border-color: var(--err); }
  .notice { margin: 8px 0 0; font-size: 0.9rem; color: var(--muted); }

  /* 버튼 줄 */
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .actions .btn-danger { grid-column: 1 / -1; }

  /* 대기 줄 그림 */
  .line {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .line li {
    min-width: 64px;
    padding: 6px 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    text-align: center;
    font-size: 0.95rem;
    line-height: 1.4;
  }
  .line li .tag { display: block; font-size: 0.75rem; color: var(--muted); }
  .line li.front { border-color: var(--accent); background: var(--accent-weak); font-weight: 700; }
  .line li.front .tag { color: var(--accent); }
  .line li.me { border-style: dashed; border-color: var(--muted); color: var(--muted); }
  .line-empty { color: var(--muted); margin: 0; }
  .line-guide { font-size: 0.9rem; color: var(--muted); margin: 10px 0 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>쉬는 시간 매점 대기순서 계산기</h1>
  <p class="intro">매점 줄이 얼마나 긴지, 남은 쉬는 시간 안에 사 올 수 있는지 미리 계산해 봐요.</p>

  <!-- 상단: 남은 쉬는 시간 + 1인당 처리 시간 -->
  <section class="card" aria-labelledby="setTitle">
    <h2 id="setTitle">시간 설정</h2>
    <div class="field">
      <label for="timeInput">남은 쉬는 시간 <span class="hint">1~60분 사이의 정수로 입력해요.</span></label>
      <div class="time-row">
        <input type="number" id="timeInput" min="1" max="60" step="1" inputmode="numeric" value="10" aria-describedby="timeMessage">
        <span class="unit">분</span>
        <button type="button" class="btn-primary" id="calcButton">계산하기</button>
      </div>
      <div id="timeMessage" class="msg" role="status" aria-live="polite"></div>
    </div>
    <div class="field">
      <label for="speedInput">1인당 처리 시간: <span class="slider-value" id="speedValue">30초</span>
        <span class="hint">한 사람이 계산을 마치는 데 걸리는 평균 시간이에요. (10~120초)</span></label>
      <input type="range" id="speedInput" min="10" max="120" step="5" value="30">
    </div>
  </section>

  <!-- 가운데: 대기 인원 + 상태 -->
  <section class="card" aria-labelledby="countTitle">
    <h2 id="countTitle" class="count-label">지금 대기 인원</h2>
    <p class="count-big" aria-live="polite"><span id="countNum">0</span><small>명</small></p>
    <p class="my-turn" id="myTurn"></p>

    <div class="result" id="result">
      <p class="wait">예상 대기 시간: <strong id="waitText">-</strong></p>
      <div class="status" id="statusBox" role="status" aria-live="polite">
        <div class="lights" aria-hidden="true"><span class="g"></span><span class="y"></span><span class="r"></span></div>
        <div>
          <span class="status-text" id="statusText">-</span>
          <span class="status-sub" id="statusSub"></span>
        </div>
      </div>
      <p class="notice">※ 이 계산은 평균치에 기반하며 실제 상황에 따라 달라질 수 있습니다.</p>
    </div>
  </section>

  <!-- 하단: 버튼 -->
  <section class="card" aria-labelledby="ctrlTitle">
    <h2 id="ctrlTitle">줄 관리</h2>
    <div class="actions">
      <button type="button" class="btn-primary" id="addButton">대기자 1명 추가</button>
      <button type="button" class="btn-outline" id="enterButton">1명 입장 완료</button>
      <button type="button" class="btn-danger" id="resetButton">리셋 (0명, 10분, 30초)</button>
    </div>
    <div id="queueMessage" class="msg" role="status" aria-live="polite"></div>
  </section>

  <!-- 대기 줄 그림 -->
  <section class="card" aria-labelledby="lineTitle">
    <h2 id="lineTitle">매점 대기 줄 (왼쪽이 맨 앞)</h2>
    <ol class="line" id="lineList" aria-label="대기 줄, 맨 앞부터"></ol>
    <p class="line-empty" id="lineEmpty" hidden>지금은 줄에 아무도 없어요.</p>
    <p class="line-guide">새 대기자는 줄 맨 뒤에 서고, 입장은 맨 앞 사람부터 해요. 먼저 온 사람이 먼저 나가는 이 방식을 <strong>큐(Queue)</strong>라고 해요.</p>
  </section>
</div>

<script>
  // ===== 설정값 =====
  const MAX_PEOPLE = 50;     // 줄에 설 수 있는 최대 인원
  const MIN_TIME = 1;        // 남은 쉬는 시간 최소 (분)
  const MAX_TIME = 60;       // 남은 쉬는 시간 최대 (분)
  const START_PEOPLE = 6;    // 처음 열었을 때 줄에 서 있는 인원 (예시)
  const DEFAULT_TIME = 10;   // 기본 남은 시간 (분)
  const DEFAULT_SPEED = 30;  // 기본 1인당 처리 시간 (초)
  const SAFE_MARGIN = 2;     // '여유'로 보려면 남겨야 하는 시간 (분)

  // ===== 큐(Queue) 만들기 =====
  // queue 배열이 곧 매점 대기 줄이에요.
  //   - 배열의 0번 칸 = 줄의 맨 앞(Front) 사람
  //   - 배열의 마지막 칸 = 줄의 맨 뒤(Rear) 사람
  // 새 사람은 push()로 '맨 뒤'에 붙이고,
  // 입장할 때는 shift()로 '맨 앞' 사람을 꺼내요.
  // 그래서 먼저 줄 선 사람이 먼저 나가요 → 선입선출(FIFO: First-In, First-Out)
  let queue = [];
  let nextTicket = 1; // 다음에 줄 설 사람에게 줄 순번 (계속 1씩 커져요)

  // 대기자 1명을 줄 맨 뒤에 넣기 (Enqueue)
  function enqueue() {
    const person = { ticket: nextTicket }; // 가상의 대기 순번 하나
    queue.push(person);                    // push(): 배열 맨 뒤에 추가
    nextTicket = nextTicket + 1;
    return person;
  }

  // 줄 맨 앞 사람을 꺼내기 (Dequeue)
  function dequeue() {
    return queue.shift();                  // shift(): 배열 맨 앞(0번 칸)을 빼고 돌려줌
  }

  // ===== 화면 요소 =====
  const timeInput = document.getElementById('timeInput');
  const timeMessage = document.getElementById('timeMessage');
  const speedInput = document.getElementById('speedInput');
  const speedValue = document.getElementById('speedValue');
  const countNum = document.getElementById('countNum');
  const myTurn = document.getElementById('myTurn');
  const result = document.getElementById('result');
  const waitText = document.getElementById('waitText');
  const statusBox = document.getElementById('statusBox');
  const statusText = document.getElementById('statusText');
  const statusSub = document.getElementById('statusSub');
  const queueMessage = document.getElementById('queueMessage');
  const lineList = document.getElementById('lineList');
  const lineEmpty = document.getElementById('lineEmpty');

  // 메시지를 페이지 안에 보여 주기 (alert 대신)
  function showMessage(el, text, kind) {
    el.textContent = text;
    el.className = 'msg' + (text ? ' ' + kind : '');
  }

  // 초를 "약 N분" 또는 "약 N.N분"으로 바꾸기
  function formatMinutes(seconds) {
    const minutes = Math.round(seconds / 60 * 10) / 10; // 소수 첫째 자리까지
    if (minutes === 0) return '0분';
    return '약 ' + minutes + '분';
  }

  // 남은 시간 입력칸 검사 → 올바르면 분(정수), 아니면 null
  function readTime(showError) {
    const raw = timeInput.value.trim();
    let error = '';
    if (raw === '' && !timeInput.validity.badInput) {
      error = '남은 시간을 입력해 주세요.';
    } else {
      const value = Number(raw);
      if (raw === '' || !Number.isInteger(value) || value < MIN_TIME || value > MAX_TIME) {
        error = '1 이상의 올바른 시간을 입력해 주세요. (1~60분 사이의 정수)';
      }
    }
    if (error) {
      timeInput.setAttribute('aria-invalid', 'true');
      if (showError) showMessage(timeMessage, error, 'error');
      return null;
    }
    timeInput.removeAttribute('aria-invalid');
    showMessage(timeMessage, '', '');
    return Number(raw);
  }

  // 대기 시간을 계산하고 신호등 표시하기
  function calculate(showError) {
    const remain = readTime(showError);
    if (remain === null) {
      result.hidden = true; // 입력이 틀리면 예전 결과를 남기지 않아요
      return;
    }
    const speed = Number(speedInput.value);        // 1인당 처리 시간 (초)
    const waitSec = queue.length * speed;          // 총 예상 대기 시간 = 대기 인원 × 1인당 시간
    const remainSec = remain * 60;                 // 비교는 초 단위로 (소수 오차 방지)

    waitText.textContent = formatMinutes(waitSec);

    let kind, label, sub;
    if (waitSec <= remainSec - SAFE_MARGIN * 60) {
      kind = 'ok';   label = '여유';
      sub = '기다려도 ' + SAFE_MARGIN + '분 이상 남아요.';
    } else if (waitSec <= remainSec) {
      kind = 'warn'; label = '간당간당';
      sub = '쉬는 시간 안에는 되지만 여유가 ' + SAFE_MARGIN + '분보다 적어요.';
    } else {
      kind = 'bad';  label = '구매 불가';
      sub = '기다리는 시간이 남은 쉬는 시간보다 길어요.';
    }
    statusBox.className = 'status ' + kind;
    statusText.textContent = '[' + label + ']';
    statusSub.textContent = '남은 시간 ' + remain + '분 기준 · ' + sub;
    result.hidden = false;
  }

  // 대기 인원, 내 순번, 줄 그림 다시 그리기
  function render() {
    countNum.textContent = queue.length;
    myTurn.textContent = '지금 줄 맨 뒤에 서면 나는 ' + (queue.length + 1) + '번째예요.';

    lineList.innerHTML = '';
    queue.forEach(function (person, index) {
      const li = document.createElement('li');
      if (index === 0) li.className = 'front';
      li.innerHTML = '<span class="tag">' + (index === 0 ? '맨 앞' : (index + 1) + '번째') + '</span>대기 ' + person.ticket + '번';
      lineList.appendChild(li);
    });
    if (queue.length < MAX_PEOPLE) {
      const me = document.createElement('li');
      me.className = 'me';
      me.innerHTML = '<span class="tag">' + (queue.length + 1) + '번째</span>나';
      lineList.appendChild(me);
    }
    lineEmpty.hidden = queue.length !== 0;
  }

  // ===== 버튼 동작 =====
  document.getElementById('addButton').addEventListener('click', function () {
    if (queue.length >= MAX_PEOPLE) {
      showMessage(queueMessage, '대기 인원은 최대 ' + MAX_PEOPLE + '명까지만 넣을 수 있어요.', 'info');
      return;
    }
    const person = enqueue();
    showMessage(queueMessage, '대기 ' + person.ticket + '번이 줄 맨 뒤에 섰어요.', 'info');
    render();
    calculate(false);
  });

  document.getElementById('enterButton').addEventListener('click', function () {
    if (queue.length === 0) {
      showMessage(queueMessage, '대기자가 없습니다.', 'error');
      return;
    }
    const person = dequeue();
    showMessage(queueMessage, '맨 앞의 대기 ' + person.ticket + '번이 매점에 들어갔어요.', 'info');
    render();
    calculate(false);
  });

  document.getElementById('resetButton').addEventListener('click', function () {
    resetAll(0);
    showMessage(queueMessage, '처음 상태로 되돌렸어요. (대기 0명, 남은 시간 10분, 1인당 30초)', 'info');
  });

  document.getElementById('calcButton').addEventListener('click', function () {
    calculate(true);
  });

  // 남은 시간을 고치면 바로 다시 계산 (틀린 값이면 결과를 숨기고 안내)
  timeInput.addEventListener('input', function () { calculate(true); });
  timeInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') calculate(true);
  });

  speedInput.addEventListener('input', function () {
    speedValue.textContent = speedInput.value + '초';
    calculate(false);
  });

  // 처음 상태 만들기: people명이 줄 서 있는 상태
  function resetAll(people) {
    queue = [];
    nextTicket = 1;
    for (let i = 0; i < people; i++) enqueue();
    timeInput.value = DEFAULT_TIME;
    speedInput.value = DEFAULT_SPEED;
    speedValue.textContent = DEFAULT_SPEED + '초';
    showMessage(queueMessage, '', '');
    render();
    calculate(true);
  }

  // 시작: 예시로 6명이 줄 서 있고 남은 시간 10분
  resetAll(START_PEOPLE);
</script>
</body>
</html>
