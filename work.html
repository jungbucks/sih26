<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>작품 실행 · 학생 프로그램 전시판</title>
    <link rel="stylesheet" href="assets/style.css" />
    <script type="module" src="assets/work.js"></script>
  </head>
  <body class="work-page">
    <a class="skip" href="#main">본문으로 이동</a>
    <header>
      <a class="brand" href="./"
        >SIH26 <span>정보과학 교과 수업 - 레이트 바이브 코딩 프로젝트 아카이브</span></a
      >
    </header>
    <main id="main">
      <a href="./" class="back">← 목록으로 돌아가기</a>
      <p id="status" role="status">작품을 불러오는 중…</p>
      <button id="retry" type="button" hidden>다시 시도</button>
      <article id="work" hidden>
        <div class="work-heading">
          <div class="work-title">
            <h1 id="title"></h1>
            <p id="description" class="intro"></p>
          </div>
          <div class="actions">
            <a id="download" class="button primary">HTML 다운로드</a>
            <a id="run" class="button" target="_blank" rel="noopener noreferrer"
              >새 탭 실행 ↗</a
            >
          </div>
        </div>
        <section class="preview-area" aria-labelledby="preview-label">
          <div class="preview-heading">
            <h2 id="preview-label">작품 미리보기</h2>
            <p class="preview-tip">저장·다운로드가 안 되면 ‘새 탭 실행’을 누르세요</p>
            <button id="restart" type="button">
              <span aria-hidden="true">↻</span>다시 시작
            </button>
          </div>
          <p id="preview-status" class="hint" role="status"></p>
          <div id="frame"></div>
        </section>
        <nav id="work-nav" class="work-nav" aria-label="다른 작품" hidden>
          <a id="prev" class="button" hidden></a>
          <a id="next" class="button" hidden></a>
        </nav>
        <div class="work-details">
          <p id="identity" class="eyebrow"></p>
          <p id="meta" class="hint"></p>
          <p id="changes" class="hint"></p>
        </div>
      </article>
    </main>
    <footer id="build-info"></footer>
  </body>
</html>
