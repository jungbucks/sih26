<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수행평가 D-Day 챙기미</title>
<meta name="description" content="수행평가 마감일을 D-Day순으로 정렬해 급한 것부터 보여 주고, 완료한 항목을 따로 관리하는 개인 정리 도구">
<meta name="class" content="O반 (2-5)">
<meta name="status" content="3회 개선">
<meta name="design" content="컬러셋 C13 회색과 빨강 · 트렌드 T11 스위스 스타일 · #d10511">
<style>
  /* 전시판 공용 글꼴 */
  @font-face { font-family: "Wanted Sans"; src: url("../assets/fonts/WantedSansVariable.woff2") format("woff2"); font-weight: 400 1000; font-display: swap; }

  /* 디자인: 컬러셋 C13 회색과 빨강 + 스위스 스타일 (12칸 격자·굵은 고딕·장식 없음) */
  :root {
    --bg: #f2f2f0;
    --card: #ffffff;
    --line: #dcdcd8;
    --text: #111111;
    --muted: #555555;
    --accent: #d10511;      /* 강조색은 가장 중요한 버튼(등록) 한 곳에만 */
    --accent-text: #c00410;
    --rule: #111111;        /* 목록 항목 사이 2px 가로줄 */
    --field-line: #555555;  /* 입력칸·보조 버튼 테두리 */
    --warn: #8a2416;        /* 원래 있던 경고 빨강: 강조색과 헷갈리지 않게 더 어둡게 */
    --warn-soft: #fbeeea;
    /* 글자 크기 3단계 (제목 h1 제외) */
    --fs-s: 15px;
    --fs-m: 17px;
    --fs-l: 24px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Wanted Sans", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    font-size: var(--fs-m);
    line-height: 1.7;
    word-break: keep-all;
    overflow-wrap: anywhere;
  }
  /* 12칸 격자: 모든 요소의 왼쪽 끝을 격자선에 맞춘다 */
  main {
    max-width: 64rem;
    margin: 0 auto;
    padding: 32px 16px 64px;
    display: grid;
    grid-template-columns: repeat(12, minmax(0, 1fr));
    column-gap: 16px;
  }
  main > header, main > section { grid-column: 1 / -1; }
  h1 {
    font-size: 44px;
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.1;
    margin: 0 0 16px;
  }
  h2 {
    font-size: var(--fs-l);
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.3;
    margin: 0 0 16px;
  }
  .notice {
    border-left: 4px solid var(--warn);
    background: var(--warn-soft);
    color: var(--text);
    padding: 10px 14px;
    border-radius: 0;
    font-weight: 600;
    margin: 0 0 24px;
  }
  section { margin-top: 48px; }
  .panel {
    background: var(--card);
    border: 0;
    border-radius: 0;
    padding: 20px 16px;
  }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-weight: 700; margin-bottom: 4px; }
  .req { color: var(--warn); font-weight: 600; font-size: var(--fs-s); }
  .opt { color: var(--muted); font-weight: 400; font-size: var(--fs-s); letter-spacing: 0; }
  input[type="text"], input[type="date"] {
    width: 100%;
    font: inherit;
    padding: 9px 11px;
    border: 1px solid var(--field-line);
    border-radius: 0;
    background: var(--card);
    color: var(--text);
  }
  input:focus-visible, button:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }
  button {
    font: inherit;
    font-weight: 700;
    border-radius: 0;
    border: 1px solid var(--field-line);
    background: var(--card);
    color: var(--text);
    padding: 7px 14px;
    text-align: left;
    cursor: pointer;
    min-height: 40px;
  }
  /* 카드 안 주 버튼(저장 등)은 검정, 빨강 강조는 '등록'과 '완료' 버튼 */
  button.primary { background: var(--text); border-color: var(--text); color: #ffffff; }
  /* 완료 버튼: 빨강(#dc3545, 흰 글자 대비 4.5:1), 마우스를 올리거나 누르면 천천히 어두워진다 */
  button.done-btn {
    background: #dc3545; border-color: #dc3545; color: #ffffff;
    transition: background-color 0.2s ease, border-color 0.2s ease;
  }
  button.done-btn:hover { background: #bb2d3b; border-color: #bb2d3b; }
  button.done-btn:active { background: #a52834; border-color: #a52834; }
  #addButton.primary { background: var(--accent); border-color: var(--accent); color: #ffffff; }
  button.danger { color: var(--warn); border-color: var(--warn); }
  button:disabled,
  #addButton.primary:disabled { background: var(--line); border-color: var(--line); color: var(--muted); cursor: not-allowed; }
  .hint { color: var(--muted); font-size: var(--fs-s); margin: 8px 0 0; }
  .hint.warn { color: var(--warn); font-weight: 600; }
  /* 목록: 상자 없이 항목 사이 2px 가로줄로만 나눈다 */
  .list { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
  .card {
    position: relative;
    background: transparent;
    border: 0;
    border-top: 2px solid var(--rule);
    border-radius: 0;
    padding: 16px 0 18px 28px;
    display: grid;
    grid-template-columns: 7.5rem minmax(0, 1fr); /* D-Day 칸 너비를 고정해 내용 왼쪽 끝을 맞춤 */
    gap: 4px 16px;
  }
  .list .card:last-child { border-bottom: 2px solid var(--rule); }
  /* 순서 번호 대신 같은 모양의 굵은 네모 표시 */
  .card::before {
    content: "";
    position: absolute;
    left: 0;
    top: 26px;
    width: 12px;
    height: 12px;
    background: var(--text);
  }
  .dday {
    grid-row: span 2;
    align-self: start;
    min-width: 0;
    text-align: left;
    font-size: var(--fs-l);
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.3;
    padding: 0;
    border-radius: 0;
    background: transparent;
    color: var(--text);
  }
  .dday.urgent { background: transparent; color: var(--warn); }
  .dday.done { background: transparent; color: var(--muted); }
  .subject { color: var(--muted); font-size: var(--fs-s); font-weight: 600; }
  .title { font-weight: 800; font-size: var(--fs-m); }
  .card.is-done .title { text-decoration: line-through; color: var(--muted); }
  .meta { grid-column: 2; color: var(--muted); font-size: var(--fs-s); }
  .actions { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; align-items: center; justify-content: flex-start; }
  .empty { color: var(--muted); background: transparent; border: 0; border-top: 2px solid var(--rule); border-radius: 0; padding: 16px 0; margin: 0; }
  .confirm-box {
    border: 0;
    border-left: 4px solid var(--warn);
    background: var(--warn-soft);
    border-radius: 0;
    padding: 12px 14px;
    margin-top: 12px;
  }
  .confirm-box p { margin: 0 0 10px; font-weight: 600; }
  .confirm-box .actions { margin-top: 0; }
  .inline-confirm { font-weight: 700; color: var(--warn); }
  /* 다른 카드 수정 중일 때 묻는 상자 */
  .switch-box { grid-column: 1 / -1; margin-top: 8px; }
  .switch-box .note { margin: 0 0 10px; font-weight: 400; font-size: var(--fs-s); color: var(--warn); }
  .save-state { font-size: var(--fs-s); color: var(--muted); margin: 0 0 8px; }
  .save-state.warn { color: var(--warn); font-weight: 600; }
  /* 카드 안 수정 칸 */
  .edit-box { grid-column: 1 / -1; display: grid; gap: 10px; margin-top: 4px; }
  .edit-box .field { margin-bottom: 0; }
  .edit-box label { font-size: var(--fs-s); }
  /* '중요한 수행평가' 체크박스 */
  .field.check label { display: flex; align-items: flex-start; gap: 10px; cursor: pointer; margin-bottom: 0; }
  .field.check label > span { min-width: 0; }
  .field.check input[type="checkbox"] { width: 22px; height: 22px; margin: 3px 0 0; flex: none; accent-color: var(--text); cursor: pointer; }
  /* 중요 카드: 검은 굵은 테두리 + 흰 바탕 + '중요' 배지 (항상 목록 맨 위) */
  .card.is-important {
    background: var(--card);
    border: 3px solid var(--text);
    padding: 14px 14px 16px 34px;
    margin-bottom: 8px; /* 중요 카드끼리 테두리가 겹쳐 두꺼워지지 않게 띄운다 */
  }
  .list .card.is-important:last-child { border-bottom: 3px solid var(--text); }
  .card.is-important::before { left: 12px; top: 23px; }
  .important-badge {
    display: inline-block;
    background: var(--text);
    color: #ffffff;
    font-size: var(--fs-s);
    font-weight: 800;
    line-height: 1.4;
    padding: 2px 8px;
    margin-bottom: 4px;
  }
  .card.is-editing { background: var(--card); padding-right: 16px; }
  [hidden] { display: none !important; }

  /* 넓은 화면: 소제목은 1~4칸, 내용은 5~12칸 (왼쪽 끝을 격자선에 맞춤) */
  @media (min-width: 900px) {
    main > section {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      column-gap: 16px;
      align-items: start;
    }
    main > section > h2 { grid-column: 1 / 5; grid-row: 1 / span 4; }
    main > section > :not(h2) { grid-column: 5 / -1; }
    main > header > .save-state,
    main > header > .notice { max-width: calc(100% * 8 / 12); }
  }
  @media (max-width: 480px) {
    h1 { font-size: 40px; }
  }
  @media (prefers-reduced-motion: reduce) {
    button.done-btn { transition: none; }
  }
</style>
</head>
<body>
<main>
  <!-- ===== 상단: 제목과 주의 안내 ===== -->
  <header>
    <h1>수행평가 D-Day 챙기미</h1>
    <p class="save-state" id="saveState">입력한 내용은 이 브라우저에 자동 저장됩니다.</p>
    <p class="notice" role="note">※ 이 앱은 개인 정리용입니다. 정확한 제출일은 반드시 학교 공식 알림을 확인하세요!</p>
  </header>

  <!-- ===== 입력 영역 ===== -->
  <section aria-labelledby="formHeading">
    <h2 id="formHeading">수행평가 등록</h2>
    <form class="panel" id="addForm" novalidate>
      <div class="field">
        <label for="subjectInput">과목명 <span class="req">(필수)</span></label>
        <input type="text" id="subjectInput" maxlength="20" placeholder="예: 영어" autocomplete="off">
      </div>
      <div class="field">
        <label for="titleInput">수행평가 제목 <span class="req">(필수)</span></label>
        <input type="text" id="titleInput" maxlength="40" placeholder="예: 단어 암기" autocomplete="off">
      </div>
      <div class="field">
        <label for="dueInput">제출 마감일 <span class="req">(필수)</span></label>
        <input type="date" id="dueInput">
      </div>
      <div class="field">
        <label for="memoInput">메모 / 준비물 <span class="opt">(선택)</span></label>
        <input type="text" id="memoInput" maxlength="60" placeholder="예: 원고지 3매 작성" autocomplete="off">
      </div>
      <div class="field check">
        <label for="importantInput"><input type="checkbox" id="importantInput"><span>중요한 수행평가 <span class="opt">(선택 · 체크하면 목록 맨 위에 고정)</span></span></label>
      </div>
      <button type="submit" class="primary" id="addButton" disabled>등록</button>
      <p class="hint" id="formHint" aria-live="polite">과목명, 제목, 마감일을 모두 입력하면 '등록' 버튼이 켜집니다.</p>
    </form>
  </section>

  <!-- ===== 메인 영역 1: 진행 중 ===== -->
  <section aria-labelledby="activeHeading">
    <h2 id="activeHeading">진행 중인 수행평가 (D-Day순) <span id="activeCount" class="opt"></span></h2>
    <ul class="list" id="activeList"></ul>
    <p class="empty" id="activeEmpty" hidden>등록된 수행평가가 없습니다. 새로운 수행평가를 등록해 보세요!</p>
  </section>

  <!-- ===== 메인 영역 2: 완료 ===== -->
  <section aria-labelledby="doneHeading">
    <h2 id="doneHeading">완료된 수행평가 <span id="doneCount" class="opt"></span></h2>
    <ul class="list" id="doneList"></ul>
    <p class="empty" id="doneEmpty" hidden>완료된 수행평가가 없습니다.</p>

    <div style="margin-top:24px">
      <button type="button" class="danger" id="resetButton">전체 데이터 초기화</button>
      <!-- 샌드박스에서는 confirm() 창이 막히므로 화면 안에서 확인을 받는다 -->
      <div class="confirm-box" id="resetConfirm" hidden role="alertdialog" aria-labelledby="resetMsg">
        <p id="resetMsg">저장된 모든 수행평가 데이터가 삭제됩니다. 계속하시겠습니까?</p>
        <div class="actions">
          <button type="button" class="danger" id="resetYes">예, 초기화합니다</button>
          <button type="button" id="resetNo">취소</button>
        </div>
      </div>
      <p class="hint" id="resetHint" aria-live="polite"></p>
    </div>
  </section>
</main>

<script>
// ===== 예시 데이터·설정 =====
const STORAGE_KEY = "sih26:20619:assignments"; // 저장 이름(전시판 규칙에 맞춘 접두사 사용)
const MAX_ITEMS = 30;                           // 최대 30개까지만 저장
const DAY_MS = 1000 * 60 * 60 * 24;             // 하루를 밀리초로 나타낸 값

// 처음 실행할 때 보여 줄 예시 (마감일은 오늘 기준 며칠 뒤로 계산)
function makeExampleData() {
  return [
    { subject: "국어", title: "독서 감상문 제출", due: dateAfter(2), memo: "원고지 3매 작성" },
    { subject: "수학", title: "단원평가 오답노트", due: dateAfter(5), memo: "풀이과정 적기" }
  ].map(function (item, i) {
    return { id: Date.now() + i, createdAt: Date.now() + i, done: false, isImportant: false, ...item };
  });
}

// ===== 데이터·상태 =====
let assignments = [];      // 모든 수행평가 (진행 중 + 완료)
let canSave = true;        // 브라우저 저장이 가능한지
let pendingDeleteId = null; // 삭제 확인 중인 항목의 id
let editingId = null;       // 수정 중인 항목의 id (한 번에 하나만)
let editDraft = null;       // 수정 칸에 입력 중인 값 (저장 전까지는 여기에만 둔다)
let pendingSwitchId = null; // 다른 카드 수정 중에 [수정]을 눌러, 이동할지 묻고 있는 카드의 id

// ===== 처리 함수 =====

// 오늘로부터 n일 뒤 날짜를 "YYYY-MM-DD" 글자로 만든다
function dateAfter(n) {
  const d = new Date();
  d.setDate(d.getDate() + n);
  return toDateText(d);
}
function toDateText(d) {
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return d.getFullYear() + "-" + m + "-" + day;
}

// "YYYY-MM-DD" 글자를 그 날 0시 Date로 바꾼다 (시간 차이로 하루가 어긋나지 않도록)
function parseDate(text) {
  const parts = text.split("-").map(Number);
  return new Date(parts[0], parts[1] - 1, parts[2]);
}

// D-Day 계산: (마감일 - 오늘) ÷ 하루 길이, 그리고 올림(Math.ceil)
// 두 날짜 모두 0시로 맞추고, 서머타임 같은 오차는 반올림으로 정리한다
function calcDday(dueText) {
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const diff = (parseDate(dueText) - today) / DAY_MS;
  return Math.ceil(Math.round(diff * 1000) / 1000);
}

// 숫자를 화면용 글자로: 0 → D-Day, 3 → D-3, -2 → D+2
function ddayLabel(n) {
  if (n === 0) return "D-Day";
  if (n > 0) return "D-" + n;
  return "D+" + (-n);
}

// 정렬: 중요한 항목이 무조건 맨 위, 그다음 D-Day가 작은(급한) 순서, 같으면 먼저 등록한 것이 위로
function sortByDday(list) {
  return list.slice().sort(function (a, b) {
    if (a.isImportant !== b.isImportant) return a.isImportant ? -1 : 1; // 중요 먼저
    const diff = calcDday(a.due) - calcDday(b.due);
    if (diff !== 0) return diff;          // 남은 일수가 다르면 적은 쪽이 앞
    return a.createdAt - b.createdAt;     // 같으면 등록 순서대로
  });
}

// 전시판 미리보기(sandbox iframe) 안인지 확인: 여기서는 브라우저 저장이 아예 막혀 있다
const IN_PREVIEW = window.origin === "null" && location.protocol !== "file:";

// 저장하기: 배열을 JSON 글자로 바꿔 localStorage에 넣는다
// 넣은 뒤 다시 꺼내 읽어 보고, 똑같을 때만 "저장됨"으로 인정한다
function saveData() {
  const text = JSON.stringify(assignments);
  try {
    localStorage.setItem(STORAGE_KEY, text);
    canSave = localStorage.getItem(STORAGE_KEY) === text;
  } catch (e) {
    canSave = false; // 저장이 막힌 환경 (사생활 보호 모드, 전시판 미리보기 등)
  }
  showSaveState();
}

// 불러오기: 저장된 것이 없으면 예시 데이터로 시작한다
function loadData() {
  let text = null;
  try {
    text = localStorage.getItem(STORAGE_KEY);
  } catch (e) {
    canSave = false;
  }
  if (text) {
    try {
      const parsed = JSON.parse(text);
      if (Array.isArray(parsed)) {
        // 예전에 저장한 항목에는 isImportant가 없으므로 false(일반)로 채운다
        assignments = parsed.filter(isValidItem).slice(0, MAX_ITEMS).map(function (x) {
          return { ...x, isImportant: x.isImportant === true };
        });
        return;
      }
    } catch (e) { /* 저장된 내용이 깨졌으면 아래에서 예시로 시작 */ }
  }
  assignments = makeExampleData();
  saveData();
}

function isValidItem(x) {
  return x && typeof x.subject === "string" && typeof x.title === "string" &&
    /^\d{4}-\d{2}-\d{2}$/.test(x.due || "");
}

// 입력창 값 읽기 (앞뒤 공백 제거)
function readForm() {
  return {
    subject: document.getElementById("subjectInput").value.trim(),
    title: document.getElementById("titleInput").value.trim(),
    due: document.getElementById("dueInput").value,
    memo: document.getElementById("memoInput").value.trim(),
    isImportant: document.getElementById("importantInput").checked
  };
}

function isFormComplete(f) {
  return f.subject !== "" && f.title !== "" && /^\d{4}-\d{2}-\d{2}$/.test(f.due);
}

// 새 수행평가 추가
function addAssignment() {
  const f = readForm();
  if (!isFormComplete(f) || assignments.length >= MAX_ITEMS) return false;
  const now = Date.now();
  assignments.push({ id: now + Math.random(), createdAt: now, done: false,
    subject: f.subject, title: f.title, due: f.due, memo: f.memo, isImportant: f.isImportant === true });
  saveData();
  return true;
}

function setDone(id, done) {
  const item = assignments.find(function (a) { return a.id === id; });
  if (!item) return;
  item.done = done;
  saveData();
}

function deleteAssignment(id) {
  assignments = assignments.filter(function (a) { return a.id !== id; });
  saveData();
}

// 수정 저장: 필수 3가지가 채워졌을 때만 바꾸고 저장한다
// (목록은 render()에서 D-Day를 다시 계산해 새로 정렬된다)
function updateAssignment(id, f) {
  const item = assignments.find(function (a) { return a.id === id; });
  if (!item || !isFormComplete(f)) return false;
  item.subject = f.subject;
  item.title = f.title;
  item.due = f.due;
  item.memo = f.memo;
  item.isImportant = f.isImportant === true;
  saveData();
  return true;
}

// 수정 칸에서 비어 있는 필수 항목 이름 모으기
function missingFields(f) {
  const missing = [];
  if (f.subject === "") missing.push("과목명");
  if (f.title === "") missing.push("제목");
  if (!/^\d{4}-\d{2}-\d{2}$/.test(f.due)) missing.push("마감일");
  return missing;
}

// 전체 초기화: 저장을 지우고 예시 데이터로 되돌린다
function resetAll() {
  try { localStorage.removeItem(STORAGE_KEY); } catch (e) { /* 저장이 막혀 있어도 화면은 초기화 */ }
  assignments = makeExampleData();
  saveData();
}

// ===== 화면 갱신 =====

function showSaveState() {
  const el = document.getElementById("saveState");
  if (canSave) {
    el.textContent = "입력한 내용은 이 브라우저에 자동 저장됩니다.";
    el.className = "save-state";
  } else if (IN_PREVIEW) {
    // 전시판 미리보기 칸은 보안 때문에 저장을 막는다 → 새 탭에서 열어야 저장된다
    el.textContent = "주의: 전시판 미리보기에서는 저장이 막혀 새로고침하면 예시로 돌아가요. 저장하려면 '새 탭 실행'으로 여세요.";
    el.className = "save-state warn";
  } else {
    el.textContent = "주의: 이 환경에서는 저장되지 않습니다. 새로고침하면 내용이 사라져요.";
    el.className = "save-state warn";
  }
}

// 등록 버튼 켜기/끄기와 안내 문구
function updateFormState() {
  const f = readForm();
  const button = document.getElementById("addButton");
  const hint = document.getElementById("formHint");
  const missing = [];
  if (f.subject === "") missing.push("과목명");
  if (f.title === "") missing.push("제목");
  if (!/^\d{4}-\d{2}-\d{2}$/.test(f.due)) missing.push("마감일");

  if (assignments.length >= MAX_ITEMS) {
    button.disabled = true;
    hint.textContent = "최대 " + MAX_ITEMS + "개까지 저장할 수 있어요. 끝난 항목을 삭제하면 다시 등록할 수 있습니다.";
    hint.className = "hint warn";
  } else if (missing.length > 0) {
    button.disabled = true;
    hint.textContent = "아직 입력하지 않은 필수 항목: " + missing.join(", ");
    hint.className = "hint";
  } else {
    button.disabled = false;
    hint.textContent = "모두 입력했어요. '등록' 버튼을 누르세요.";
    hint.className = "hint";
  }
}

// 카드 하나 만들기 (사용자 입력은 textContent로만 넣어 안전하게)
function makeCard(item) {
  const li = document.createElement("li");
  li.className = "card" + (item.done ? " is-done" : "") + (item.isImportant ? " is-important" : "");

  const n = calcDday(item.due);
  const badge = document.createElement("div");
  badge.className = "dday" + (item.done ? " done" : (n <= 1 ? " urgent" : ""));
  badge.textContent = item.done ? "완료" : ddayLabel(n);

  const head = document.createElement("div");
  const subject = document.createElement("div");
  subject.className = "subject";
  subject.textContent = item.subject;
  const title = document.createElement("div");
  title.className = "title";
  title.textContent = item.title;
  head.append(subject, title);
  if (item.isImportant) {
    const imp = document.createElement("span");
    imp.className = "important-badge";
    imp.textContent = "★ 중요";
    head.prepend(imp);
  }

  const meta = document.createElement("div");
  meta.className = "meta";
  let metaText = "마감일 " + item.due;
  if (!item.done && n < 0) metaText += " (마감 지남)";
  if (item.done) metaText += " · " + ddayLabel(n);
  meta.textContent = metaText;
  if (item.memo) {
    const memo = document.createElement("div");
    memo.textContent = "메모: " + item.memo;
    meta.appendChild(memo);
  }

  // 수정 중인 카드: 내용 자리에 입력 칸을 보여 주고 [저장]·[취소]만 둔다
  if (editingId === item.id && editDraft) {
    li.className += " is-editing";
    head.replaceChildren(subject, title); // 수정 중에는 배지 대신 체크박스로 보여 준다
    li.append(badge, head, makeEditBox(item));
    return li;
  }

  const actions = document.createElement("div");
  actions.className = "actions";
  if (pendingSwitchId === item.id && editingId !== null) {
    // 다른 카드를 수정하는 중: 그 내용을 어떻게 할지 화면 안에서 묻는다
    li.append(badge, head, meta, makeSwitchBox(item));
    return li;
  }
  if (pendingDeleteId === item.id) {
    // 삭제 확인 (화면 안에서 한 번 더 묻기)
    const q = document.createElement("span");
    q.className = "inline-confirm";
    q.textContent = "이 항목을 삭제할까요?";
    actions.append(q,
      makeButton("삭제 확인", "confirm-delete", item.id, "danger"),
      makeButton("취소", "cancel-delete", item.id, ""));
  } else if (item.done) {
    actions.append(makeButton("복원", "restore", item.id, ""),
                   makeButton("수정", "edit", item.id, ""),
                   makeButton("삭제", "delete", item.id, "danger"));
  } else {
    actions.append(makeButton("완료", "done", item.id, "done-btn"),
                   makeButton("수정", "edit", item.id, ""),
                   makeButton("삭제", "delete", item.id, "danger"));
  }

  li.append(badge, head, meta, actions);
  return li;
}

// "수정 중인 내용이 있어요" 확인 상자: 저장하고 이동 / 저장하지 않고 이동 / 취소
function makeSwitchBox(item) {
  const editing = assignments.find(function (a) { return a.id === editingId; });
  const box = document.createElement("div");
  box.className = "confirm-box switch-box";
  box.setAttribute("role", "alertdialog");
  const msg = document.createElement("p");
  msg.id = "switchMsg";
  msg.textContent = "수정 중인 내용이 있습니다. '" + (editing ? editing.title : "수정 중인 카드") +
    "' 카드를 저장하고 이 카드를 수정할까요, 아니면 저장하지 않고 수정할까요?";
  box.setAttribute("aria-labelledby", "switchMsg");
  box.appendChild(msg);

  // 수정 중인 칸에 필수 항목이 비어 있으면 저장할 수 없으니 그 버튼은 끈다
  const missing = missingFields(readDraft());
  const saveBtn = makeButton("저장하고 이동", "switch-save", item.id, "primary");
  if (missing.length > 0) {
    saveBtn.disabled = true;
    const note = document.createElement("p");
    note.className = "note";
    note.textContent = "수정 중인 카드에 비어 있는 필수 항목(" + missing.join(", ") + ")이 있어 지금은 저장할 수 없어요.";
    box.appendChild(note);
  }
  const actions = document.createElement("div");
  actions.className = "actions";
  actions.append(saveBtn,
    makeButton("저장하지 않고 이동", "switch-discard", item.id, ""),
    makeButton("취소", "switch-cancel", item.id, ""));
  box.appendChild(actions);
  return box;
}

// 카드 안 수정 칸 만들기 (값은 editDraft에서 가져온다)
function makeEditBox(item) {
  const box = document.createElement("div");
  box.className = "edit-box";
  box.append(
    makeEditField("editSubject", "과목명", "(필수)", "text", "subject", 20),
    makeEditField("editTitle", "수행평가 제목", "(필수)", "text", "title", 40),
    makeEditField("editDue", "제출 마감일", "(필수)", "date", "due", 0),
    makeEditField("editMemo", "메모 / 준비물", "(선택)", "text", "memo", 60),
    makeEditCheck()
  );

  const actions = document.createElement("div");
  actions.className = "actions";
  const saveBtn = makeButton("저장", "save-edit", item.id, "primary");
  saveBtn.id = "editSave";
  actions.append(saveBtn, makeButton("취소", "cancel-edit", item.id, ""));

  const hint = document.createElement("p");
  hint.className = "hint";
  hint.id = "editHint";
  hint.setAttribute("aria-live", "polite");

  box.append(actions, hint);
  updateEditState(box);
  return box;
}

function makeEditField(inputId, labelText, tag, type, key, maxLen) {
  const wrap = document.createElement("div");
  wrap.className = "field";
  const label = document.createElement("label");
  label.htmlFor = inputId;
  label.textContent = labelText + " ";
  const span = document.createElement("span");
  span.className = tag === "(필수)" ? "req" : "opt";
  span.textContent = tag;
  label.appendChild(span);
  const input = document.createElement("input");
  input.type = type;
  input.id = inputId;
  input.dataset.key = key;          // editDraft의 어느 칸인지
  input.value = editDraft[key] || "";
  if (maxLen) input.maxLength = maxLen;
  input.autocomplete = "off";
  wrap.append(label, input);
  return wrap;
}

// 수정 칸의 '중요한 수행평가' 체크박스
function makeEditCheck() {
  const wrap = document.createElement("div");
  wrap.className = "field check";
  const label = document.createElement("label");
  label.htmlFor = "editImportant";
  const input = document.createElement("input");
  input.type = "checkbox";
  input.id = "editImportant";
  input.dataset.key = "isImportant";
  input.checked = editDraft.isImportant === true;
  const span = document.createElement("span");
  span.className = "opt";
  span.textContent = "(선택 · 체크하면 목록 맨 위에 고정)";
  const text = document.createElement("span");
  text.append("중요한 수행평가 ", span);
  label.append(input, text);
  wrap.appendChild(label);
  return wrap;
}

// 수정 칸의 값 읽기 (앞뒤 공백 제거)
function readDraft() {
  return {
    subject: (editDraft.subject || "").trim(),
    title: (editDraft.title || "").trim(),
    due: editDraft.due || "",
    memo: (editDraft.memo || "").trim(),
    isImportant: editDraft.isImportant === true
  };
}

// 수정 칸의 [저장] 버튼 켜기/끄기와 안내 문구 (등록 폼과 같은 규칙)
function updateEditState(root) {
  const saveBtn = root.querySelector("#editSave");
  const hint = root.querySelector("#editHint");
  if (!saveBtn || !hint || !editDraft) return;
  const missing = missingFields(readDraft());
  saveBtn.disabled = missing.length > 0;
  hint.textContent = missing.length > 0
    ? "아직 입력하지 않은 필수 항목: " + missing.join(", ")
    : "고친 뒤 '저장'을 누르면 D-Day와 순서가 다시 계산됩니다.";
}

function makeButton(text, action, id, cls) {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = text;
  b.dataset.action = action;
  b.dataset.id = String(id);
  if (cls) b.className = cls;
  return b;
}

function render() {
  const active = sortByDday(assignments.filter(function (a) { return !a.done; }));
  const done = sortByDday(assignments.filter(function (a) { return a.done; }));

  const activeList = document.getElementById("activeList");
  const doneList = document.getElementById("doneList");
  activeList.replaceChildren(...active.map(makeCard));
  doneList.replaceChildren(...done.map(makeCard));

  document.getElementById("activeEmpty").hidden = active.length > 0;
  document.getElementById("doneEmpty").hidden = done.length > 0;
  document.getElementById("activeCount").textContent = "(" + active.length + "개)";
  document.getElementById("doneCount").textContent = "(" + done.length + "개)";
  updateFormState();
}

// ===== 이벤트 연결 =====

document.getElementById("addForm").addEventListener("input", updateFormState);
document.getElementById("addForm").addEventListener("change", updateFormState);

document.getElementById("addForm").addEventListener("submit", function (e) {
  e.preventDefault();
  if (document.getElementById("addButton").disabled) return;
  if (!addAssignment()) return;
  // 입력창 비우기 → 필수 항목이 비므로 버튼이 바로 꺼져 중복 등록이 막힌다
  document.getElementById("addForm").reset();
  render();
  document.getElementById("formHint").textContent = "등록했어요. 다음 수행평가를 입력하세요.";
  document.getElementById("subjectInput").focus();
});

// 목록 버튼들 (완료·복원·삭제)은 목록 전체에서 한 번에 처리
function handleListClick(e) {
  const b = e.target.closest("button[data-action]");
  if (!b) return;
  const id = Number(b.dataset.id);
  const action = b.dataset.action;
  pendingDeleteId = null; // 다른 버튼을 누르면 삭제 확인은 닫는다
  pendingSwitchId = null; // 이동 확인도 닫는다
  let focusAfter = null;  // 다시 그린 뒤 포커스를 둘 버튼
  let focusEdit = false;  // 다시 그린 뒤 수정 칸 첫 입력으로 갈지
  if (action === "done") setDone(id, true);
  else if (action === "restore") setDone(id, false);
  else if (action === "delete") pendingDeleteId = id;
  else if (action === "confirm-delete") {
    deleteAssignment(id);
    if (editingId === id) { editingId = null; editDraft = null; }
  }
  else if (action === "edit") {
    if (editingId !== null && editingId !== id) pendingSwitchId = id; // 다른 카드 수정 중 → 먼저 묻기
    else { startEdit(id); focusEdit = true; }
  }
  else if (action === "switch-save") {
    // 수정 중이던 카드를 저장한 뒤 새 카드 수정 시작 (필수 항목이 비면 저장 안 함)
    if (!updateAssignment(editingId, readDraft())) { pendingSwitchId = id; render(); return; }
    startEdit(id); focusEdit = true;
  }
  else if (action === "switch-discard") { startEdit(id); focusEdit = true; } // 저장하지 않고 새 카드로
  else if (action === "switch-cancel") { focusEdit = true; } // 원래 카드 수정 그대로 유지
  else if (action === "cancel-edit") { editingId = null; editDraft = null; focusAfter = id; }
  else if (action === "save-edit") {
    if (!updateAssignment(id, readDraft())) return; // 필수 항목이 비면 저장하지 않음
    editingId = null; editDraft = null; focusAfter = id;
  }
  render();
  if (pendingSwitchId !== null) {
    // 확인 상자의 첫 번째로 누를 수 있는 버튼으로 이동
    const sw = document.querySelector('.switch-box button:not(:disabled)');
    if (sw) sw.focus();
  } else if (focusEdit) {
    const first = document.getElementById("editSubject");
    if (first) first.focus();
  } else if (focusAfter !== null) {
    // 저장/취소 후에는 그 카드의 [수정] 버튼으로 돌아온다 (정렬로 자리가 바뀌어도 찾아감)
    const again = document.querySelector('button[data-action="edit"][data-id="' + String(focusAfter) + '"]');
    if (again) again.focus();
  }
}

// [수정]을 누르면 지금 값을 복사해 수정 칸에 채운다 (다른 카드 수정 중이면 먼저 확인 상자로 묻는다)
function startEdit(id) {
  const item = assignments.find(function (a) { return a.id === id; });
  if (!item) return;
  editingId = id;
  editDraft = { subject: item.subject, title: item.title, due: item.due, memo: item.memo || "", isImportant: item.isImportant === true };
}

// 수정 칸에 입력할 때: 값만 기억하고 버튼 상태만 바꾼다 (다시 그리면 입력 중 커서가 사라지므로)
function handleEditInput(e) {
  const input = e.target;
  if (!editDraft || !input.dataset || !input.dataset.key) return;
  editDraft[input.dataset.key] = input.type === "checkbox" ? input.checked : input.value;
  const box = input.closest(".edit-box");
  if (box) updateEditState(box);
}

// 수정 칸에서 Enter = 저장, Esc = 취소
function handleEditKey(e) {
  if (!editDraft || !e.target.closest(".edit-box")) return;
  const box = e.target.closest(".edit-box");
  if (e.key === "Enter" && e.target.tagName === "INPUT") {
    e.preventDefault();
    const saveBtn = box.querySelector("#editSave");
    if (saveBtn && !saveBtn.disabled) saveBtn.click();
  } else if (e.key === "Escape") {
    e.preventDefault();
    const cancelBtn = box.querySelector('button[data-action="cancel-edit"]');
    if (cancelBtn) cancelBtn.click();
  }
}

["activeList", "doneList"].forEach(function (listId) {
  const list = document.getElementById(listId);
  list.addEventListener("click", handleListClick);
  list.addEventListener("input", handleEditInput);
  list.addEventListener("change", handleEditInput);
  list.addEventListener("keydown", handleEditKey);
});

// 전체 초기화 (화면 안 확인 상자)
document.getElementById("resetButton").addEventListener("click", function () {
  document.getElementById("resetConfirm").hidden = false;
  document.getElementById("resetHint").textContent = "";
  document.getElementById("resetYes").focus();
});
document.getElementById("resetNo").addEventListener("click", function () {
  document.getElementById("resetConfirm").hidden = true;
  document.getElementById("resetButton").focus();
});
document.getElementById("resetYes").addEventListener("click", function () {
  resetAll();
  pendingDeleteId = null;
  editingId = null; editDraft = null; pendingSwitchId = null;
  document.getElementById("resetConfirm").hidden = true;
  render();
  document.getElementById("resetHint").textContent = "초기화했어요. 예시 데이터 2개로 다시 시작합니다.";
});

// 시작
loadData();
showSaveState();
render();
</script>
</body>
