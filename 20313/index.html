<!DOCTYPE html>
<html lang="ko">
<head>
<!-- ===== 메타 ===== -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>그림 주제 뽑기</title>
<meta name="description" content="그림 분야·난이도·연습 목적을 고르면 조건에 맞는 그림 연습 주제 10개를 번호·설명이 있는 카드로 한꺼번에 추천해 주는 프로그램">
<meta name="class" content="O반 (2-5)">
<meta name="status" content="4회 개선">
<meta name="design" content="컬러셋 C13 회색과 빨강 · 트렌드 T01 리퀴드 글래스 · #d10511">

<!-- ===== 스타일 ===== -->
<style>
  /* 전시판 공용 글꼴 (못 불러오면 아래 대체 글꼴로 표시) */
  @font-face { font-family: "Wanted Sans"; src: url("../assets/fonts/WantedSansVariable.woff2") format("woff2"); font-weight: 400 1000; font-display: swap; }

  :root {
    --bg: #f2f2f0;        /* 무채색 페이지 바탕 */
    --card: #ffffff;
    --text: #111111;
    --muted: #555555;
    --line: #dcdcd8;      /* 옅은 구분선 */
    --field-line: #555555; /* 선택칸·보조 버튼 테두리 */
    --accent: #d10511;    /* 강조 빨강: 주제 추천 버튼·결과 번호에만 */
    --accent-text: #c00410;
    --accent-soft: #fde8e8;
    --warn-bg: #fff5e1;   /* 경고 안내: 원래의 노랑 계열 유지 (강조 빨강과 구분) */
    --warn-line: #b07612;
    --alert-bg: #ffe08a;  /* 필수 항목 경고: 같은 노랑 계열을 더 진하게 */
    --alert-line: #7a4a00;
    --ok-bg: #edf4ec;     /* 완료 안내: 원래의 초록 계열 유지 */
    --ok-line: #4f7a4a;
    --shadow: 0 4px 16px rgba(0,0,0,.06);
    /* 리퀴드 글래스 (버튼에만) */
    --glass-bg: color-mix(in srgb, #ffffff 45%, transparent);
    --glass-border: 1px solid rgba(255,255,255,.6);
    --glass-shadow: inset 0 1px 0 rgba(255,255,255,.75), inset 0 -1px 0 rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.12);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    /* 유리 버튼 뒤로 비쳐 보이는 번진 빨간 빛 (글자 아래는 12% 이하) */
    background:
      radial-gradient(340px circle at 30% 560px, rgba(209,5,17,.12), transparent 70%),
      radial-gradient(260px circle at 0% 100%, rgba(209,5,17,.10), transparent 70%),
      var(--bg);
    color: var(--text);
    font-family: "Wanted Sans", system-ui, -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    font-size: 17px;
    line-height: 1.7;
    word-break: keep-all;
    overflow-wrap: anywhere;
    min-height: 100vh;
  }
  main { max-width: 40rem; margin: 0 auto; padding: 24px 16px 56px; }
  h1 { font-size: 1.75rem; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 4px; line-height: 1.3; }
  .sub { margin: 0 0 24px; color: var(--muted); font-size: 1rem; }

  .panel {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    box-shadow: var(--shadow);
    padding: 16px;
    margin-bottom: 16px;
  }

  /* 조건 선택: fieldset + 칩 모양 라디오 버튼 (선택칸이라 불투명 + 진한 테두리) */
  fieldset { border: 0; margin: 0 0 16px; padding: 0; min-width: 0; }
  fieldset:last-child { margin-bottom: 0; }
  legend { font-weight: 700; padding: 0; margin-bottom: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { position: relative; }
  .chip input {
    position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0;
  }
  .chip span {
    display: inline-flex; align-items: center; gap: 6px;
    min-height: 44px; padding: 8px 16px;
    border: 1px solid var(--field-line); border-radius: 999px;
    background: #fff; color: var(--text);
    font-size: 1rem; cursor: pointer; user-select: none;
  }
  .chip span::before {   /* 선택 여부를 색이 아닌 모양(✓)으로도 보여 줌 */
    content: none;
  }
  .chip input:checked + span {
    background: var(--accent-soft); border-color: var(--accent); color: var(--accent-text); font-weight: 700;
  }
  .chip input:checked + span::before { content: "✓"; }
  .chip input:focus-visible + span { outline: 3px solid var(--text); outline-offset: 2px; }

  /* 버튼: 리퀴드 글래스 (두께감 + 가장자리 빛 반사가 있는 반투명 유리) */
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  button {
    font: inherit; font-size: 1rem; font-weight: 600;
    min-height: 44px; padding: 10px 20px;
    border-radius: 999px; border: var(--glass-border);
    background: var(--glass-bg); color: var(--text);
    -webkit-backdrop-filter: blur(12px) saturate(160%);
    backdrop-filter: blur(12px) saturate(160%);
    /* 마지막 그림자 한 겹: 밝은 바탕에서도 누르는 곳이 잘 보이도록 옅은 테두리 */
    box-shadow: var(--glass-shadow), 0 0 0 1px rgba(17,17,17,.32);
    cursor: pointer;
    transition: transform .12s ease;
  }
  button:active { transform: scale(.97); }
  button:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
  .btn-primary {
    flex: 1 1 100%;
    background: color-mix(in srgb, var(--accent) 94%, transparent);
    color: #fff; font-weight: 800;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.45), inset 0 -1px 0 rgba(0,0,0,.18), 0 8px 24px rgba(209,5,17,.22);
  }
  button:disabled {
    background: #ebebe8; color: #666666; border: 1px dashed #8a8a85;
    -webkit-backdrop-filter: none; backdrop-filter: none;
    box-shadow: none; cursor: not-allowed; transform: none;
  }

  /* 안내 메시지 (색만이 아니라 [안내] 글자도 함께 표시) */
  .message {
    margin: 0 0 16px; padding: 12px 16px; border-radius: 14px;
    border: 1px solid var(--warn-line); background: var(--warn-bg); color: var(--text); font-weight: 600;
  }
  .message.ok { border-color: var(--ok-line); background: var(--ok-bg); }
  /* 필수 항목을 고르지 않았을 때의 경고: 더 진한 노랑 바탕 + 두꺼운 테두리 + 검은 '선택 필요' 표시로 눈에 띄게
     (다른 안내 메시지는 위의 기본 모양 그대로) */
  .message.alert {
    border: 2px solid var(--alert-line); background: var(--alert-bg); color: #111111;
    box-shadow: 0 4px 14px rgba(122,74,0,.18);
  }
  .message.alert .tag {
    padding: 2px 10px; border-radius: 999px;
    background: #111111; color: #ffffff; font-weight: 800;
  }
  .message.alert strong { font-weight: 800; text-decoration: underline; text-underline-offset: 3px; }
  .message[hidden] { display: none; }
  .tag { display: inline-block; margin-right: 6px; font-weight: 700; }

  /* 결과 영역 */
  .result { text-align: left; }
  .result-label { margin: 0 0 4px; color: var(--muted); font-size: 0.95rem; font-weight: 600; }

  /* 추천 주제 카드: 화면 너비에 맞춰 한 줄에 들어가는 만큼 놓고, 넘치면 다음 줄로 (불투명) */
  .cards {
    list-style: none; margin: 8px 0 0; padding: 0;
    display: grid; gap: 12px;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 14rem), 1fr));
  }
  .card {
    min-width: 0;
    display: flex; flex-direction: column; gap: 6px;
    /* 바깥 상자 모서리 20px = 안쪽 4px + 여백 16px */
    padding: 14px; border: 1px solid var(--line); border-radius: 4px; background: #fff;
    position: relative; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  /* 선택한 카드: 테두리만 강조 빨강으로 (바깥 그림자 1px을 더해 굵게 보이지만 크기·위치는 그대로, 애니메이션 없음) */
  .card.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .card:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
  /* 이전에 추천했던 주제 표시: 카드 오른쪽 위 검은 작은 글씨 */
  .card-prev {
    position: absolute; top: 10px; right: 12px;
    font-size: 0.8rem; font-weight: 700; line-height: 1.4; color: #111111;
  }
  .card-num {
    display: inline-flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent-text); font-weight: 800; font-size: 0.95rem;
  }
  .card-title { margin: 0; font-size: 1.1rem; font-weight: 700; line-height: 1.45; color: var(--text); }
  .card-desc { margin: 0; color: var(--muted); font-size: 0.95rem; line-height: 1.6; }
  .placeholder { margin: 0; color: var(--muted); }
  .note {
    margin: 14px 0 0; padding-top: 12px; border-top: 1px dashed var(--line);
    color: var(--muted); font-size: 1rem;
  }

  @media (prefers-reduced-motion: reduce) {
    button { transition: none; }
    button:active { transform: none; }
  }
</style>
</head>
<body>
<main>
  <h1>그림 주제 뽑기</h1>
  <p class="sub">그림 분야, 난이도, 연습 목적을 하나씩 고른 뒤 ‘주제 추천’을 눌러 보세요. 같은 조건에서 다시 누르면 아직 나오지 않은 새 주제로 바뀌어요.</p>

  <!-- 조건 선택 -->
  <form class="panel" id="conditions" onsubmit="return false;">
    <fieldset>
      <legend>그림 분야</legend>
      <div class="chips">
        <label class="chip"><input type="radio" name="field" value="인물·캐릭터"><span>인물·캐릭터</span></label>
        <label class="chip"><input type="radio" name="field" value="풍경·자연"><span>풍경·자연</span></label>
        <label class="chip"><input type="radio" name="field" value="사물·정물"><span>사물·정물</span></label>
      </div>
    </fieldset>
    <fieldset>
      <legend>난이도</legend>
      <div class="chips">
        <label class="chip"><input type="radio" name="level" value="쉬움"><span>쉬움</span></label>
        <label class="chip"><input type="radio" name="level" value="보통"><span>보통</span></label>
        <label class="chip"><input type="radio" name="level" value="어려움"><span>어려움</span></label>
      </div>
    </fieldset>
    <fieldset>
      <legend>연습 목적</legend>
      <div class="chips">
        <label class="chip"><input type="radio" name="purpose" value="형태 연습"><span>형태 연습</span></label>
        <label class="chip"><input type="radio" name="purpose" value="명암 연습"><span>명암 연습</span></label>
        <label class="chip"><input type="radio" name="purpose" value="색 표현 연습"><span>색 표현 연습</span></label>
      </div>
    </fieldset>
  </form>

  <!-- 버튼 -->
  <div class="actions">
    <button type="button" class="btn-primary" id="btnRecommend">주제 추천</button>
    <button type="button" id="btnReset" disabled>처음부터 다시 뽑기</button>
  </div>

  <!-- 안내 메시지 (선택 누락·초기화 안내) -->
  <p class="message" id="message" role="status" aria-live="polite" hidden></p>

  <!-- 결과 영역 -->
  <section class="panel result" id="result" aria-live="polite" aria-label="추천 결과">
    <p class="placeholder">아직 추천된 주제가 없어요. 조건을 고르고 ‘주제 추천’을 눌러 주세요.</p>
  </section>
</main>

<script>
// ===== 주제 데이터 =====
// 주제 데이터를 저장하는 부분:
// TOPIC_SETS 객체에는 "분야|난이도|연습 목적" 조합마다 주제 10개가 [주제, 간단한 설명] 모양으로 들어 있어요.
// (분야 3 × 난이도 3 × 목적 3 = 27가지 조합, 조합마다 10개 = 모두 270개)
// 아래 TOPIC_SETS_ADDED에서 조합마다 10개씩 더 붙여서, 실제로는 조합마다 20개(모두 540개)를 써요.
const TOPIC_SETS = {
  // --- 인물·캐릭터 ---
  "인물·캐릭터|쉬움|형태 연습": [
    ["다양한 표정의 얼굴 그리기", "동그란 얼굴에 웃음·화남·놀람 같은 표정을 눈썹과 입 모양만 바꿔 그려요."],
    ["동그라미와 네모로 간단한 캐릭터 그리기", "기본 도형만 이어 붙여 머리·몸·팔다리를 만들어요."],
    ["막대 인형으로 여러 가지 자세 그리기", "선과 동그라미로 서기·앉기·손 들기 자세를 빠르게 그려요."],
    ["정면 얼굴의 눈·코·입 기본 위치 그리기", "얼굴을 가로세로 십자선으로 나눈 뒤 눈·코·입 자리를 잡아요."],
    ["좋아하는 동물을 의인화한 캐릭터 그리기", "동물의 귀·꼬리 같은 특징을 살려 두 발로 선 캐릭터를 만들어요."],
    ["여러 가지 머리 모양의 얼굴 그리기", "같은 얼굴에 짧은 머리·긴 머리·묶은 머리를 바꿔 가며 그려요."],
    ["손을 흔들며 인사하는 캐릭터 그리기", "팔과 손의 방향을 바꿔 반갑게 인사하는 동작을 표현해요."],
    ["2등신 꼬마 캐릭터 그리기", "머리와 몸 크기를 비슷하게 맞춰 단순하고 귀여운 캐릭터를 만들어요."],
    ["거울 속 내 얼굴을 단순한 선으로 그리기", "거울을 보며 얼굴형과 눈에 띄는 특징만 짧은 선으로 잡아요."],
    ["가방을 멘 학생 캐릭터 그리기", "몸 위로 가방끈과 가방이 겹쳐 보이는 모양을 그려요."]
  ],
  "인물·캐릭터|쉬움|명암 연습": [
    ["간단한 얼굴의 빛과 그림자 표현하기", "빛이 오는 쪽을 정하고 반대쪽 볼과 코 옆을 어둡게 칠해요."],
    ["옆에서 빛을 받은 둥근 캐릭터 얼굴 그리기", "공처럼 둥근 얼굴에 밝은 면에서 어두운 면으로 이어지는 명암을 넣어요."],
    ["펼친 손바닥 아래에 생긴 그림자 표현하기", "책상 위로 손을 들었을 때 생기는 그림자 모양을 관찰해 그려요."],
    ["코 아래에 생기는 작은 그림자 그리기", "위에서 빛이 올 때 코 밑에 생기는 그림자 하나에만 집중해요."],
    ["세 단계 진하기로 얼굴 칠하기", "밝음·중간·어두움 세 단계만 써서 얼굴의 명암을 단순하게 나눠요."],
    ["땅에 비친 캐릭터의 그림자 그리기", "서 있는 캐릭터의 발밑에 빛과 반대 방향으로 그림자를 그려요."],
    ["반짝이는 눈동자 하이라이트 넣기", "눈동자를 어둡게 칠하고 작은 흰 점을 남겨 반짝이는 눈을 만들어요."],
    ["검정과 흰색만으로 캐릭터 그리기", "회색 없이 검정과 흰색만으로 빛과 그림자를 나눠요."],
    ["주먹 쥔 손의 밝은 면과 어두운 면 그리기", "주먹을 하나의 덩어리로 보고 위쪽은 밝게, 아래쪽은 어둡게 칠해요."],
    ["머리카락 덩어리에 명암 넣기", "머리카락을 몇 개의 덩어리로 나누고 각 덩어리 아래쪽을 어둡게 칠해요."]
  ],
  "인물·캐릭터|쉬움|색 표현 연습": [
    ["좋아하는 색 세 가지로 캐릭터 옷 칠하기", "색을 세 가지로만 정해 옷과 소품을 칠해요."],
    ["같은 얼굴을 따뜻한 색과 차가운 색으로 칠하기", "같은 그림 두 장을 주황 계열과 파랑 계열로 칠해 느낌을 비교해요."],
    ["볼과 입술의 자연스러운 색 표현하기", "피부색 위에 분홍을 옅게 겹쳐 생기 있는 얼굴을 만들어요."],
    ["줄무늬 티셔츠를 입은 캐릭터 칠하기", "두 가지 색을 번갈아 칠해 줄무늬가 몸을 따라 휘어 보이게 해요."],
    ["계절별 옷 색으로 같은 캐릭터 칠하기", "봄·여름·가을·겨울에 어울리는 색으로 같은 캐릭터를 네 번 칠해요."],
    ["기분에 어울리는 색으로 얼굴 칠하기", "기쁨·슬픔·화남 표정마다 어울리는 색을 골라 칠해요."],
    ["머리카락을 두 가지 색으로 칠하기", "기본 머리색과 조금 더 밝은 색을 함께 써서 윤기를 표현해요."],
    ["무지개색 우비를 입은 캐릭터 칠하기", "빨강부터 보라까지 순서대로 칠하며 색의 순서를 익혀요."],
    ["한 가지 색의 진하기만 바꿔 캐릭터 칠하기", "한 색을 힘 조절이나 물 양으로 진하고 옅게 바꿔 칠해요."],

const NOTE_TEXT = "추천한 주제 10개는 그림 연습을 위한 아이디어예요.";
const MSG_NONE = "조건에 맞는 주제가 없어요. 다른 조건을 선택해 주세요.";

// 조건 이름(라디오 name)과 화면에 보이는 항목 이름
const GROUPS = [
  { key: "field", label: "그림 분야" },
  { key: "level", label: "난이도" },
  { key: "purpose", label: "연습 목적" }

// ===== 상태 =====
// records 객체: "분야|난이도|연습 목적" 조건마다 추천 기록을 따로 저장해요.
//   seen      : 이 조건에서 이미 추천한 주제 이름 (처음 추천된 순서대로)
//   reuseDeck : 모든 주제를 한 번씩 추천한 뒤, 이전 주제를 다시 꺼내 쓸 순서 (무작위로 섞어 둔 줄)
// 다른 조건으로 바꿨다가 돌아와도 그 조건의 기록을 이어서 써요.
// 브라우저에 저장하지 않으므로 페이지를 새로 열면 모든 기록이 비어요.
const records = {};

function condKey(cond) {
  return cond.field + "|" + cond.level + "|" + cond.purpose;
}
function getRecord(cond) {
  const key = condKey(cond);
  if (!records[key]) records[key] = { seen: [], reuseDeck: [] };
  return records[key];
}

// ===== 처리 함수 =====

// 화면에서 고른 세 조건을 읽어 와요. 고르지 않은 항목은 null
function readConditions() {
  const result = {};
  GROUPS.forEach(g => {
    const checked = document.querySelector('input[name="' + g.key + '"]:checked');
    result[g.key] = checked ? checked.value : null;
  });
  return result;
}

// 조건에 맞는 주제를 찾는 부분:
// TOPICS 배열을 처음부터 끝까지 살펴보며 분야·난이도·목적이 세 개 모두 같은 주제만 골라 새 배열로 만들어요.
function findMatching(list, cond) {
  return list.filter(t => t.field === cond.field && t.level === cond.level && t.purpose === cond.purpose);
}

// 이미 추천한 주제를 제외하는 부분:
// 조건에 맞는 주제 중에서 추천 기록(이름 배열)에 들어 있지 않은 주제만 남겨요. (includes로 중복 확인)
function excludeDrawn(matching, drawn) {
  return matching.filter(t => !drawn.includes(t.name));
}

// 주제를 무작위로 여러 개 고르는 부분:
// 남은 주제를 복사한 뒤 무작위로 섞고(뒤에서부터 한 칸씩 임의의 칸과 바꾸기), 앞에서 count개를 꺼내요.
// 섞기만 하므로 같은 주제가 두 번 뽑히는 일은 없어요.
function pickRandomMany(remaining, count) {
  const copy = remaining.slice();
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = copy[i]; copy[i] = copy[j]; copy[j] = tmp;
  }
  return copy.slice(0, count);
}

// 주제 여러 개 뽑기: 결과를 { type, items } 형태로 돌려줘요.
// type은 "topics"(주제 있음) / "none"(조건에 맞는 주제가 아예 없음)
// items의 한 칸은 { topic, reused } — reused가 true면 '이전 추천' 표시를 붙여요.
function drawTopics(list, cond, record, count) {
  const matching = findMatching(list, cond);
  if (matching.length === 0) {
    return { type: "none" };
  }
  const want = Math.min(count, matching.length);

  // ① 아직 한 번도 추천하지 않은 주제가 남아 있으면 그중에서 먼저 무작위로 골라요.
  const fresh = excludeDrawn(matching, record.seen);
  const items = pickRandomMany(fresh, want).map(t => ({ topic: t, reused: false }));

  // ② 새 주제가 모자라면(= 모든 주제를 한 번씩 추천했으면) 이전에 추천한 주제로 채워요.
  //    이전 주제는 무작위로 섞은 줄(reuseDeck)에서 앞에서부터 꺼내고, 줄이 비면 다시 섞어요.
  const seenTopics = matching.filter(t => record.seen.includes(t.name));
  while (items.length < want) {
    const used = items.map(it => it.topic.name);
    record.reuseDeck = record.reuseDeck.filter(name => !used.includes(name));
    if (record.reuseDeck.length === 0) {
      record.reuseDeck = pickRandomMany(seenTopics.filter(t => !used.includes(t.name)), seenTopics.length).map(t => t.name);
      if (record.reuseDeck.length === 0) break;
    }
    const name = record.reuseDeck.shift();
    items.push({ topic: seenTopics.find(t => t.name === name), reused: true });
  }

  // 이번에 처음 보여 준 주제를 기록에 더해요.
  items.forEach(it => { if (!it.reused) record.seen.push(it.topic.name); });
  // 새 주제와 이전 주제가 섞여 나올 때도 순서는 무작위로
  return { type: "topics", items: pickRandomMany(items, items.length) };
}

}
function hideMessage() {
  messageEl.hidden = true;
  messageEl.textContent = "";
}

function showPlaceholder(text) {
  resultEl.innerHTML = "";
  const p = document.createElement("p");
  p.className = "placeholder";
  p.textContent = text;
  resultEl.appendChild(p);
}

// 추천 주제를 카드로 보여 주는 부분:
// 주제 하나마다 카드(li) 하나를 만들고, 카드 안에 번호·주제·간단한 설명을 넣어요.
// 이전에 추천했던 주제면 카드 오른쪽 위에 '이전 추천'을 붙여요.
// 카드를 누르면(또는 Enter·스페이스) 선택/선택 취소가 바뀌어요. 여러 장을 함께 선택할 수 있어요.
// 카드를 새로 만들 때마다 모두 선택되지 않은 상태로 시작해요.
function showTopics(items) {
  resultEl.innerHTML = "";
  const label = document.createElement("p");
  label.className = "result-label";
  label.textContent = "추천 주제 " + items.length + "개";
  const list = document.createElement("ol");
  list.className = "cards";
  list.id = "topicCards";
  list.setAttribute("role", "listbox");
  list.setAttribute("aria-multiselectable", "true");
  list.setAttribute("aria-label", "추천 주제 (눌러서 선택)");
  items.forEach((it, i) => {
    const t = it.topic;
    const card = document.createElement("li");
    card.className = "card";
    card.setAttribute("role", "option");
    card.setAttribute("aria-selected", "false");
    card.tabIndex = 0;
    const num = document.createElement("span");
    num.className = "card-num";
    num.textContent = String(i + 1);
    card.appendChild(num);
    if (it.reused) {
      const prev = document.createElement("span");
      prev.className = "card-prev";
      prev.textContent = "이전 추천";
      card.appendChild(prev);
    }
    const title = document.createElement("h3");
    title.className = "card-title";
    title.textContent = t.name;
    const desc = document.createElement("p");
    desc.className = "card-desc";
    desc.textContent = t.desc;
    card.append(title, desc);
    card.addEventListener("click", () => toggleCard(card));
    card.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault(); // 스페이스로 화면이 내려가지 않게
        toggleCard(card);
      }
    });
    list.appendChild(card);
  });
  const note = document.createElement("p");
  note.className = "note";
  note.textContent = NOTE_TEXT;
  resultEl.append(label, list, note);
}

function showNotice(text) {
  resultEl.innerHTML = "";
  const p = document.createElement("p");
  p.className = "message";
  p.style.margin = "0";
  const tag = document.createElement("span");
  tag.className = "tag";
  tag.textContent = "⚠ 안내 ";
  p.append(tag, document.createTextNode(text));
  resultEl.appendChild(p);
}

// 카드 선택/선택 취소: 테두리 색만 바뀌고 크기·위치는 그대로
function toggleCard(card) {
  const selected = !card.classList.contains("selected");
  card.classList.toggle("selected", selected);
  card.setAttribute("aria-selected", selected ? "true" : "false");
}

// [처음부터 다시 뽑기]는 지금 고른 조건에 추천 기록이 있을 때만 누를 수 있어요.
function updateButtons() {
  const cond = readConditions();
  const complete = GROUPS.every(g => cond[g.key] !== null);
  const record = complete ? records[condKey(cond)] : null;
  btnReset.disabled = !(record && record.seen.length > 0);
}

// ===== 이벤트 =====

// [주제 추천] 버튼을 눌렀을 때의 동작
// 클릭 처리는 한 번에 하나씩 끝까지 실행되므로, 빠르게 여러 번 눌러도
// 매번 추천 기록이 먼저 갱신된 뒤 다음 클릭이 처리되어 새 주제가 남아 있는 동안 같은 주제가 다시 나오지 않아요.
// 새 카드 10개가 기존 카드 10개를 바꿔 끼우고(아래에 쌓이지 않음), 화면 위치는 그대로 둬요.
function handleDraw() {
  const cond = readConditions();
  const missing = GROUPS.filter(g => cond[g.key] === null).map(g => g.label);
  if (missing.length > 0) {
    showMissingAlert(missing);
    return;
  }
  hideMessage();

  const result = drawTopics(TOPICS, cond, getRecord(cond), DRAW_COUNT);
  if (result.type === "none") {
    showNotice(MSG_NONE);
    return;
  }
  showTopics(result.items);
  updateButtons();
}

btnRecommend.addEventListener("click", handleDraw);

// 조건 변경과 초기화에 따라 기록을 갱신하는 부분 ①: 조건 변경
// 세 조건 중 하나라도 바뀌면 결과 카드(와 카드 선택 상태)를 지워요.
// 조건별 추천 기록은 지우지 않으므로, 예전 조건으로 돌아오면 그 기록을 이어서 써요.
document.getElementById("conditions").addEventListener("change", () => {
  hideMessage();
  showPlaceholder("조건이 바뀌었어요. ‘주제 추천’을 눌러 새 조건의 주제를 받아 보세요.");
  updateButtons();
});

// 조건 변경과 초기화에 따라 기록을 갱신하는 부분 ②: 처음부터 다시 뽑기
// 현재 조건의 추천 기록만 비워요. 고른 조건과 다른 조건의 기록은 그대로 남아요.
btnReset.addEventListener("click", () => {
  const cond = readConditions();
  if (GROUPS.every(g => cond[g.key] !== null)) delete records[condKey(cond)];
  showPlaceholder("추천 기록을 지웠어요.");
  showMessage("처음부터 다시 뽑을 수 있어요. ‘주제 추천’을 눌러 주세요.", "ok");
  updateButtons();
  btnRecommend.focus(); // 버튼이 비활성화되며 포커스를 잃지 않도록 추천 버튼으로 옮겨요
});
</script>
</body>
</html>
