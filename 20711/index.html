<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>레시피 메모지</title>
<meta name="description" content="내가 만든 빵 레시피를 직접 적어 카테고리별로 오른쪽 요리책 인덱스 탭에 모아 두고, 끝낸 단계를 눌러 줄을 그어 가며 요리 흐름을 확인하는 주방용 레시피 메모지">
  <meta name="class" content="M반 (2-8)">
  <meta name="status" content="4회 개선">
<style>
  :root {
    --bg: #fafaf8;
    --surface: #ffffff;
    --text: #1f2328;
    --muted: #6b7078;
    --done: #9aa0a6;
    --line: #e3e3de;
    --field: #767b82;         /* 입력칸 테두리 */
    --accent: #2f6b4f;        /* 선택된 인덱스 탭 색 */
    --accent-soft: #e8f1ec;   /* 선택 안 된 인덱스 탭 색 */
    --error: #b42318;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-size: 17px;
    line-height: 1.7;
    word-break: keep-all;
    overflow-wrap: break-word;
  }
  main {
    max-width: 44rem;
    margin: 0 auto;
    padding: 32px 16px 56px;
  }
  h1 { font-size: 1.5rem; line-height: 1.4; margin: 0 0 4px; }
  .lead { margin: 0 0 24px; color: var(--muted); }
  h2 { font-size: 1.1rem; margin: 0 0 12px; }
  .save-note { margin: -12px 0 20px; color: var(--muted); font-size: 0.9rem; }
  .save-note[hidden] { display: none; }

  button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
    outline: 3px solid #1a5fb4;
    outline-offset: 2px;
  }

  /* 메모지 위쪽 카테고리 탭 (전체 + 내가 만든 카테고리) */
  .cat-bar {
    position: relative;
    z-index: 2;
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    gap: 6px;
    margin-bottom: -1px;
    padding: 0 8px;
  }
  .cat-tabs { display: contents; }
  .cat-tab, .cat-add {
    min-height: 44px;
    max-width: 100%;
    padding: 6px 14px;
    font: inherit;
    font-size: 0.92rem;
    font-weight: 600;
    line-height: 1.35;
    border-radius: 10px 10px 0 0;
    cursor: pointer;
    overflow-wrap: anywhere;
  }
  .cat-tab {
    background: var(--accent-soft);
    color: var(--text);
    border: 1px solid #b9cfc2;
    border-bottom: none;
  }
  .cat-tab:hover { background: #d6e6dc; }
  .cat-tab[aria-pressed="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .cat-add {
    background: var(--surface);
    color: var(--accent);
    border: 2px dashed var(--accent);
    border-bottom: none;
    font-weight: 700;
  }
  .cat-add:hover { background: var(--accent-soft); }
  .cat-form {
    display: grid;
    gap: 6px;
    margin: 0 0 16px;
    padding: 12px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
  }
  .cat-form[hidden] { display: none; }
  .cat-form label { font-weight: 700; }
  .cat-form input {
    width: 100%;
    font: inherit;
    padding: 8px 10px;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--field);
    border-radius: 8px;
  }

  /* 요리책: 왼쪽은 레시피 페이지, 오른쪽은 인덱스(견출지) 탭 */
  .book {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 96px;
    align-items: start;
  }
  .page {
    position: relative;
    z-index: 1;
    min-height: 320px;
    padding: 20px 16px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px 0 10px 10px;
  }
  .index {
    display: grid;
    gap: 6px;
    padding-top: 14px;
  }
  .tabs { display: grid; gap: 6px; }
  .tab {
    width: calc(100% - 8px);
    min-height: 52px;
    margin-left: -1px;
    padding: 8px 8px 8px 10px;
    font: inherit;
    font-size: 0.92rem;
    font-weight: 600;
    line-height: 1.35;
    text-align: left;
    background: var(--accent-soft);
    color: var(--text);
    border: 1px solid #b9cfc2;
    border-left: none;
    border-radius: 0 10px 10px 0;
    cursor: pointer;
    overflow-wrap: anywhere;
    transition: width 0.15s ease, background-color 0.15s ease;
  }
  .tab:hover { background: #d6e6dc; }
  /* 선택된 탭: 페이지에 붙은 채로 바깥으로 살짝 더 튀어나오고 진한 색 */
  .tab[aria-pressed="true"] {
    position: relative;
    z-index: 2;
    width: 100%;
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 2px 2px 6px rgba(0, 0, 0, 0.18);
  }
  .add-btn {
    width: calc(100% - 8px);
    min-height: 52px;
    margin-top: 4px;
    padding: 8px;
    font: inherit;
    font-size: 0.9rem;
    font-weight: 700;
    line-height: 1.35;
    background: var(--surface);
    color: var(--accent);
    border: 2px dashed var(--accent);
    border-left: none;
    border-radius: 0 10px 10px 0;
    cursor: pointer;
  }
  .add-btn:hover { background: var(--accent-soft); }
  /* 휴지통 탭: 레시피 탭과 구분되게 무채색 (선택되면 다른 탭처럼 진한 색) */
  .tab-trash {
    margin-top: 4px;
    background: var(--surface);
    border-color: var(--field);
  }

  /* 레시피 목록 */
  .placeholder {
    margin: 0;
    padding: 20px 16px;
    border: 1px dashed #c9c9c2;
    border-radius: 10px;
    color: var(--muted);
  }
  .hint { margin: 0 0 10px; color: var(--muted); font-size: 0.95rem; }
  .steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .step {
    display: flex;
    gap: 8px;
    align-items: flex-start;
    padding: 8px 12px 8px 6px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--text);
    word-break: keep-all;
  }
  /* 완료 체크는 동그란 번호만 누르기 (누르는 칸은 44px, 동그라미는 28px) */
  .num-btn {
    flex: none;
    width: 44px; height: 44px;
    display: grid;
    place-items: center;
    padding: 0;
    background: none;
    border: none;
    border-radius: 50%;
    cursor: pointer;
  }
  .step-num {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 2px solid var(--accent);
    color: var(--accent);
    font-weight: 700;
    font-size: 0.9rem;
    display: grid;
    place-items: center;
  }
  .num-btn:hover .step-num { background: var(--accent-soft); }
  /* 새 단계를 적는 줄의 번호 자리 (아직 완료 체크 대상이 아니라 버튼이 아님) */
  .num-slot {
    flex: none;
    width: 44px; height: 44px;
    display: grid;
    place-items: center;
  }
  .step-body { flex: 1; min-width: 0; padding-top: 6px; }
  .step-text { display: block; }
  .step-memo { display: block; margin-top: 2px; font-size: 0.9rem; color: var(--muted); }
  .step-state { flex: none; font-size: 0.85rem; color: var(--muted); margin-top: 10px; }

  /* 단계 순서 바꾸기 손잡이 (끌어서 옮기기, 키보드는 위·아래 화살표) */
  .drag-handle {
    flex: none;
    width: 44px; height: 44px;
    margin-right: -8px;
    display: grid;
    place-items: center;
    padding: 0;
    background: none;
    border: none;
    border-radius: 8px;
    color: var(--muted);
    cursor: grab;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  .drag-handle:hover { background: var(--bg); color: var(--text); }
  .drag-handle:disabled { opacity: 0.35; cursor: default; }
  .drag-handle svg { width: 18px; height: 18px; fill: currentColor; }
  .steps > li.dragging { position: relative; z-index: 5; }
  .steps > li.dragging .step {
    border-color: var(--accent);
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.18);
  }
  .steps > li.dragging .drag-handle { cursor: grabbing; }

  /* 글씨 부분: 누르면 고치기, 꾹 누르면 지우기 */
  .edit-text {
    display: block;
    width: 100%;
    padding: 2px 4px;
    font: inherit;
    color: inherit;
    text-align: left;
    background: none;
    border: none;
    border-radius: 6px;
    cursor: text;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  .edit-text:hover { background: var(--bg); }
  .edit-text.pressing { background: #fbe9e7; }   /* 꾹 누르는 중 */
  .recipe-name { width: calc(100% + 8px); margin: 0 -4px 2px; font-size: 1.1rem; font-weight: 700; }

  /* 그 자리에서 고치는 칸 */
  .inline-edit { display: grid; gap: 6px; margin-bottom: 10px; }
  .step .inline-edit { margin-bottom: 0; }
  .inline-edit label { font-size: 0.92rem; font-weight: 600; }
  .inline-edit input, .inline-edit textarea {
    width: 100%;
    font: inherit;
    padding: 8px 10px;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--field);
    border-radius: 8px;
  }
  .inline-edit textarea { resize: vertical; }
  .inline-error { margin: 0; color: var(--error); font-weight: 600; font-size: 0.92rem; }
  .inline-error:empty { display: none; }
  .inline-actions { display: flex; flex-wrap: wrap; gap: 8px; }

  /* 완료한 단계: 글씨가 연해지고 가운데 줄이 그어짐 */
  .step.done { background: #f3f3f0; }
  .step.done .step-text,
  .step.done .step-memo {
    text-decoration: line-through;
    color: var(--done);
  }
  .step.done .step-num {
    border-color: var(--done);
    background: var(--done);
    color: #fff;
  }

  /* 저장된 레시피 맨 아래의 단계 추가 버튼 */
  .add-step-more { width: 100%; margin-top: 10px; }
  .limit-note { margin: 10px 0 0; color: var(--muted); font-size: 0.92rem; }

  /* 휴지통 목록 */
  .trash-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 8px;
  }
  .trash-item {
    padding: 10px 12px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
  }
  .trash-name { display: block; font-weight: 700; }
  .trash-meta { display: block; margin-bottom: 8px; font-size: 0.9rem; color: var(--muted); }
  .trash-note { margin: 0 0 10px; color: var(--accent); font-weight: 600; font-size: 0.95rem; }
  .trash-note:empty { display: none; }

  /* 화면 아래 고정 입력창 */
  .editor {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 10;
    max-height: 75vh;
    overflow-y: auto;
    background: var(--surface);
    border-top: 3px solid var(--accent);
    box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.15);
  }
  .editor[hidden] { display: none; }
  .editor-inner { max-width: 44rem; margin: 0 auto; padding: 16px 16px 20px; }
  .field-label { display: block; font-weight: 700; margin-bottom: 4px; }
  .editor input, .editor textarea, .editor select {
    width: 100%;
    font: inherit;
    padding: 8px 10px;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--field);
    border-radius: 8px;
  }
  .editor textarea { resize: vertical; min-height: 64px; }
  .editor select { min-height: 44px; }
  .editor .cat-field { margin-top: 12px; }
  .editor fieldset { margin: 16px 0 0; padding: 0; border: none; min-width: 0; }
  .editor legend { padding: 0; font-weight: 700; }
  .editor .small { margin: 0 0 8px; color: var(--muted); font-size: 0.9rem; }
  .step-field {
    display: grid;
    gap: 6px;
    margin-bottom: 10px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--bg);
  }
  .step-field label { font-size: 0.92rem; font-weight: 600; }
  .editor-error { margin: 10px 0 0; color: var(--error); font-weight: 600; }
  .editor-error:empty { display: none; }
  .editor-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .btn {
    min-height: 44px;
    padding: 8px 16px;
    font: inherit;
    font-weight: 700;
    border-radius: 10px;
    cursor: pointer;
  }
  .btn-sub { background: var(--surface); color: var(--accent); border: 2px solid var(--accent); }
  .btn-main { background: var(--accent); color: #fff; border: 2px solid var(--accent); }
  .btn-plain { background: var(--surface); color: var(--text); border: 1px solid var(--field); }
  .editor-actions .btn-plain { margin-left: auto; }
  .btn-danger { background: var(--error); color: #fff; border: 2px solid var(--error); }
  .btn-forever { background: var(--surface); color: var(--error); border: 2px solid var(--error); }

  /* 삭제 확인 창 (페이지 안에서 띄움) */
  .confirm-back {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: grid;
    place-items: center;
    padding: 16px;
    background: rgba(0, 0, 0, 0.45);
  }
  .confirm-back[hidden] { display: none; }
  .confirm-box {
    width: 100%;
    max-width: 22rem;
    padding: 20px;
    background: var(--surface);
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
  }
  .confirm-box h2 { margin: 0 0 6px; }
  .confirm-box p { margin: 0; color: var(--muted); }

  @media (min-width: 640px) {
    .book { grid-template-columns: minmax(0, 1fr) 140px; }
    .page { padding: 24px 24px; }
    .tab, .add-btn { font-size: 0.98rem; padding-left: 14px; }
  }
</style>
</head>
<body>
<main>
  <h1>레시피 메모지</h1>
  <p class="lead">위쪽 카테고리 탭으로 종류를 고르고, 오른쪽 인덱스 탭에서 레시피를 고르세요. 끝낸 단계의 동그란 번호를 눌러 줄을 그어 가고, 잘못 눌렀다면 한 번 더 누르면 돌아옵니다. 모든 단계를 끝낸 레시피는 다음에 열 때 체크가 비워져 있어요.</p>
  <p id="save-note" class="save-note" hidden>이 브라우저에서는 저장이 되지 않아요. 새로고침하면 적어 둔 레시피가 사라집니다.</p>

  <!-- 새 카테고리 이름 적는 칸 (+ 카테고리 추가를 누르면 나타남) -->
  <form id="cat-form" class="cat-form" novalidate hidden>
    <label for="cat-name">새 카테고리 이름</label>
    <input id="cat-name" type="text" maxlength="10" autocomplete="off">
    <p id="cat-error" class="inline-error" role="alert"></p>
    <div class="inline-actions">
      <button type="submit" class="btn btn-main">추가</button>
      <button type="button" id="cat-cancel" class="btn btn-plain">취소</button>
    </div>
  </form>

  <!-- 메모지 위쪽: 카테고리 탭 -->
  <div class="cat-bar" role="group" aria-label="레시피 카테고리">
    <div id="cat-tabs" class="cat-tabs"></div>
    <button type="button" id="cat-add-btn" class="cat-add">+ 카테고리 추가</button>
  </div>

  <div class="book">
    <!-- 왼쪽: 레시피 순서 목록 -->
    <section class="page" aria-labelledby="recipe-title">
      <h2 id="recipe-title">레시피 순서</h2>
      <div id="recipe-area"></div>
    </section>

    <!-- 오른쪽: 요리책 인덱스 탭 + 레시피 추가 버튼 -->
    <nav class="index" aria-label="레시피 인덱스">
      <div id="tabs" class="tabs"></div>
      <button type="button" id="add-btn" class="add-btn">+ 레시피 추가</button>
      <button type="button" id="trash-tab" class="tab tab-trash" aria-pressed="false">🗑️ 휴지통</button>
    </nav>
  </div>
</main>

<!-- 화면 아래 고정 입력창 (+ 레시피 추가를 누르면 나타남) -->
<section id="editor" class="editor" aria-labelledby="editor-title" hidden>
  <form id="editor-form" class="editor-inner" novalidate>
    <h2 id="editor-title">새 레시피 적기</h2>
    <label class="field-label" for="new-name">빵 이름</label>
    <input id="new-name" type="text" maxlength="20" autocomplete="off">
    <div class="cat-field">
      <label class="field-label" for="new-cat">카테고리</label>
      <select id="new-cat"></select>
    </div>
    <fieldset>
      <legend>요리 순서</legend>
      <p class="small">한 칸에 한 단계씩 적어요. 메모는 비워도 되고, 순서를 비워 둔 칸은 저장되지 않아요.</p>
      <div id="step-fields"></div>
    </fieldset>
    <p id="editor-error" class="editor-error" role="alert"></p>
    <div class="editor-actions">
      <button type="button" id="add-step-btn" class="btn btn-sub">+ 단계 추가</button>
      <button type="submit" class="btn btn-main">저장</button>
      <button type="button" id="cancel-btn" class="btn btn-plain">취소</button>
    </div>
  </form>
</section>

<!-- 삭제 확인 창 (글씨를 꾹 누르면 나타남) -->
<div id="confirm" class="confirm-back" hidden>
  <div class="confirm-box" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-msg">
    <h2 id="confirm-title">정말 삭제할까요?</h2>
    <p id="confirm-msg"></p>
    <div class="editor-actions">
      <button type="button" id="confirm-yes" class="btn btn-danger">삭제</button>
      <button type="button" id="confirm-no" class="btn btn-plain">취소</button>
    </div>
  </div>
</div>

<script>
// ===== 레시피 데이터 =====
// 레시피가 저장되는 곳입니다. 처음에는 아무 레시피도 없는 빈 배열이에요.
// 레시피마다 번호(id), 빵 이름(name), 요리 단계(steps), 단계별 완료 여부(done)를 가지고 있어요.
// steps의 한 칸은 { text: 요리 순서, memo: 메모 } 이고, 화면 목록의 한 줄(li)이 됩니다.
// done 배열은 steps와 같은 순서로 true(완료)/false(미완료)를 기억해서,
// 다른 탭을 봤다가 돌아와도 체크한 단계가 그대로 남아 있어요.
// trash는 지운 레시피를 모아 두는 휴지통이에요. 레시피 모양은 똑같고, 최근에 지운 것이 앞에 와요.
// categories는 위쪽 카테고리 탭 목록({ id, name })이고, 레시피의 cat에 속한 카테고리 id가 들어가요.
// cat이 ""이면 '분류 없음' 레시피로, '전체' 탭에서만 보여요.
let recipes = [];
let trash = [];
let categories = [];
let selectedCat = "all";    // 지금 고른 카테고리 탭 ("all" = 전체)
let selectedId = null;
let showingTrash = false;   // 지금 휴지통 탭을 보고 있는지
let trashNote = "";         // 휴지통 화면 위에 잠깐 보여 줄 안내

const STORE_KEY = "sih26:20711:recipes";
const MAX_STEPS = 30;
const MAX_NAME = 20;
const UNNAMED = "이름 없는 레시피";
const LONG_PRESS_MS = 600;   // 이만큼 꾹 누르면 삭제 확인 창
const ALL = "all";
const MAX_CATS = 12;
const MAX_CAT_NAME = 10;
let canSave = true;

// 지금 그 자리에서 고치는 곳: null, { type: "name" }, { type: "step", index: 단계 번호 },
// { type: "add" } (맨 아래에 새 단계 적는 중)
let editing = null;

// ===== 저장/불러오기 (저장이 막힌 환경에서도 화면은 그대로 작동) =====
function saveData() {
  if (!canSave) return;
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({
      recipes: recipes, selectedId: selectedId, trash: trash,
      categories: categories, selectedCat: selectedCat
    }));
  } catch (e) {
    canSave = false;
    document.getElementById("save-note").hidden = false;
  }
}

// 저장된 레시피 한 개를 검사해 다듬어 돌려줌 (모양이 맞지 않으면 null)
function cleanRecipe(r, fallbackId) {
  if (!r || typeof r.name !== "string" || !Array.isArray(r.steps)) return null;
  const steps = r.steps
    .filter(function (s) { return s && typeof s.text === "string" && s.text.trim(); })
    .map(function (s) { return { text: s.text, memo: typeof s.memo === "string" ? s.memo : "" }; });
  if (!r.name.trim() || steps.length === 0) return null;
  const done = steps.map(function (s, i) { return Array.isArray(r.done) && r.done[i] === true; });
  return { id: String(r.id || fallbackId), name: r.name, steps: steps, done: done, cat: catOrNone(r.cat) };
}

// 있는 카테고리 id면 그대로, 없으면 "" (분류 없음). 카테고리가 생기기 전 데이터에는 cat이 없어요.
function catOrNone(id) {
  return categories.some(function (c) { return c.id === id; }) ? id : "";
}

function findCat(id) {
  return categories.find(function (c) { return c.id === id; }) || null;
}

// 지금 고른 카테고리 탭에서 오른쪽 인덱스에 보일 레시피들
function visibleRecipes() {
  if (selectedCat === ALL) return recipes;
  return recipes.filter(function (r) { return r.cat === selectedCat; });
}

function loadData() {
  let raw = null;
  try {
    raw = localStorage.getItem(STORE_KEY);
  } catch (e) {
    canSave = false;
    document.getElementById("save-note").hidden = false;
    return;
  }
  if (!raw) return;
  try {
    const data = JSON.parse(raw);
    if (!data || !Array.isArray(data.recipes)) return;
    // 카테고리를 먼저 읽어야 레시피의 cat이 맞는지 볼 수 있어요.
    if (Array.isArray(data.categories)) {
      data.categories.forEach(function (c) {
        if (!c || typeof c.name !== "string" || !c.name.trim() || !c.id) return;
        if (categories.length >= MAX_CATS || findCat(String(c.id))) return;
        categories.push({ id: String(c.id), name: c.name.trim().slice(0, MAX_CAT_NAME) });
      });
    }
    if (findCat(data.selectedCat)) selectedCat = data.selectedCat;
    data.recipes.forEach(function (r) {
      const recipe = cleanRecipe(r, Date.now() + "-" + recipes.length);
      if (recipe) recipes.push(recipe);
    });
    if (visibleRecipes().some(function (r) { return r.id === data.selectedId; })) selectedId = data.selectedId;
    // 휴지통이 생기기 전에 저장한 데이터에는 trash가 없어요. 그때는 빈 휴지통으로 시작합니다.
    if (Array.isArray(data.trash)) {
      data.trash.forEach(function (r) {
        const recipe = cleanRecipe(r, Date.now() + "-t" + trash.length);
        if (recipe) trash.push(recipe);
      });
    }
  } catch (e) {
    // 저장된 내용이 깨져 있으면 읽지 않고 빈 상태로 시작합니다.
  }
}

function findRecipe(id) {
  return recipes.find(function (r) { return r.id === id; }) || null;
}

// 같은 이름의 레시피가 이미 있는지 (exceptId는 자기 자신이라 빼고 봄)
function nameTaken(name, exceptId) {
  const key = name.trim().toLowerCase();
  return recipes.some(function (r) { return r.id !== exceptId && r.name.trim().toLowerCase() === key; });
}

// 빵 이름을 비웠을 때 붙일 이름: 이름 없는 레시피, 이름 없는 레시피 2, 3 …
function autoName(exceptId) {
  let name = UNNAMED;
  let n = 2;
  while (nameTaken(name, exceptId)) {
    name = UNNAMED + " " + n;
    n++;
  }
  return name;
}

// 복구할 때 같은 이름이 이미 있으면 뒤에 번호를 붙임: 식빵 → 식빵 2 → 식빵 3 … (이름 길이 제한 안에서)
function freeName(name) {
  let result = name;
  let n = 2;
  while (nameTaken(result, null)) {
    const tail = " " + n;
    result = name.slice(0, MAX_NAME - tail.length).trim() + tail;
    n++;
  }
  return result;
}

// 모든 단계를 끝낸 레시피는 다시 열 때 체크를 모두 비움 (하나라도 남았으면 그대로)
function resetIfFinished(recipe) {
  if (!recipe || recipe.done.length === 0) return false;
  if (!recipe.done.every(function (d) { return d === true; })) return false;
  recipe.done = recipe.done.map(function () { return false; });
  return true;
}

// ===== 화면 요소 =====
const tabsBox = document.getElementById("tabs");
const recipeArea = document.getElementById("recipe-area");
const addBtn = document.getElementById("add-btn");
const trashTab = document.getElementById("trash-tab");
const recipeTitle = document.getElementById("recipe-title");
const editor = document.getElementById("editor");
const editorForm = document.getElementById("editor-form");
const nameInput = document.getElementById("new-name");
const stepFields = document.getElementById("step-fields");
const editorError = document.getElementById("editor-error");
const catTabsBox = document.getElementById("cat-tabs");
const catAddBtn = document.getElementById("cat-add-btn");
const catForm = document.getElementById("cat-form");
const catInput = document.getElementById("cat-name");
const catError = document.getElementById("cat-error");
const newCatSelect = document.getElementById("new-cat");

// ===== 화면 갱신 함수 =====

// 위쪽 카테고리 탭 그리기: 전체 + 만든 순서대로
function renderCats() {
  catTabsBox.textContent = "";
  [{ id: ALL, name: "전체" }].concat(categories).forEach(function (c) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "cat-tab";
    btn.dataset.cat = c.id;
    btn.textContent = c.name;
    btn.setAttribute("aria-pressed", c.id === selectedCat ? "true" : "false");
    catTabsBox.appendChild(btn);
  });
}

// 오른쪽 인덱스 탭 그리기: 고른 카테고리의 레시피만, 선택된 탭만 눌린 상태(튀어나옴 + 진한 색)
function renderTabs() {
  tabsBox.textContent = "";
  visibleRecipes().forEach(function (r) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "tab";
    btn.dataset.id = r.id;
    btn.title = r.name;
    btn.textContent = r.name;
    btn.setAttribute("aria-pressed", !showingTrash && r.id === selectedId ? "true" : "false");
    tabsBox.appendChild(btn);
  });
  trashTab.setAttribute("aria-pressed", showingTrash ? "true" : "false");
}

// 고치는 칸 아래의 [저장] [취소] 버튼과 안내 줄
function createInlineActions() {
  const err = document.createElement("p");
  err.className = "inline-error";
  err.setAttribute("role", "alert");
  const actions = document.createElement("div");
  actions.className = "inline-actions";
  const ok = document.createElement("button");
  ok.type = "button";
  ok.className = "btn btn-main";
  ok.dataset.action = "save-edit";
  ok.textContent = "저장";
  const no = document.createElement("button");
  no.type = "button";
  no.className = "btn btn-plain";
  no.dataset.action = "cancel-edit";
  no.textContent = "취소";
  actions.append(ok, no);
  return [err, actions];
}

// 빵 이름 고치는 칸
function createNameEditor(recipe) {
  const box = document.createElement("div");
  box.className = "inline-edit";
  const input = document.createElement("input");
  input.type = "text";
  input.className = "ie-name";
  input.maxLength = 20;
  input.autocomplete = "off";
  input.value = recipe.name;
  input.setAttribute("aria-label", "빵 이름");
  box.append(input, ...createInlineActions());
  return box;
}

// 단계 글씨 고치는 칸 (요리 순서 + 메모)
function createStepEditor(step, index) {
  const box = document.createElement("div");
  box.className = "inline-edit";
  const t = document.createElement("textarea");
  t.className = "ie-text";
  t.rows = 2;
  t.maxLength = 200;
  t.value = step.text;
  t.setAttribute("aria-label", (index + 1) + "단계");
  const mLabel = document.createElement("label");
  mLabel.htmlFor = "ie-memo";
  mLabel.textContent = "메모 (선택)";
  const m = document.createElement("input");
  m.type = "text";
  m.id = "ie-memo";
  m.className = "ie-memo";
  m.maxLength = 100;
  m.autocomplete = "off";
  m.value = step.memo;
  box.append(t, mLabel, m, ...createInlineActions());
  return box;
}

// 단계 하나(li)를 만들어 돌려줌. 완료 여부(isDone)도 함께 그려 줌
// 동그란 번호 = 완료 체크, 글씨 = 누르면 고치기 / 꾹 누르면 지우기
function createStepItem(step, index, isDone) {
  const li = document.createElement("li");
  const row = document.createElement("div");
  row.className = "step" + (isDone ? " done" : "");
  row.dataset.index = String(index);

  const numBtn = document.createElement("button");
  numBtn.type = "button";
  numBtn.className = "num-btn";
  numBtn.setAttribute("aria-pressed", isDone ? "true" : "false");
  numBtn.setAttribute("aria-label", (index + 1) + "단계 완료 표시");
  const num = document.createElement("span");
  num.className = "step-num";
  num.textContent = String(index + 1);
  numBtn.appendChild(num);

  const body = document.createElement("div");
  body.className = "step-body";
  if (editing && editing.type === "step" && editing.index === index) {
    body.appendChild(createStepEditor(step, index));
  } else {
    const textBtn = document.createElement("button");
    textBtn.type = "button";
    textBtn.className = "edit-text";
    textBtn.dataset.target = "step";
    textBtn.setAttribute("aria-describedby", "edit-help");
    const text = document.createElement("span");
    text.className = "step-text";
    text.textContent = step.text;   // textContent로 넣어 안전하게 표시
    textBtn.appendChild(text);
    if (step.memo) {
      const memo = document.createElement("span");
      memo.className = "step-memo";
      memo.textContent = "메모: " + step.memo;
      textBtn.appendChild(memo);
    }
    body.appendChild(textBtn);
  }

  const state = document.createElement("span");
  state.className = "step-state";
  state.textContent = isDone ? "완료" : "";   // 색만으로 구분하지 않기 위해 "완료" 글자도 표시

  // 순서 바꾸기 손잡이: 고치는 중에는 잠가 둠 (고치던 단계 번호가 바뀌지 않게)
  const handle = document.createElement("button");
  handle.type = "button";
  handle.className = "drag-handle";
  handle.disabled = editing !== null;
  handle.setAttribute("aria-label", (index + 1) + "단계 순서 옮기기 (위·아래 화살표 키)");
  handle.title = "끌어서 순서 바꾸기";
  handle.innerHTML = '<svg viewBox="0 0 18 18" aria-hidden="true"><circle cx="6" cy="3.5" r="1.6"/><circle cx="12" cy="3.5" r="1.6"/><circle cx="6" cy="9" r="1.6"/><circle cx="12" cy="9" r="1.6"/><circle cx="6" cy="14.5" r="1.6"/><circle cx="12" cy="14.5" r="1.6"/></svg>';

  row.append(numBtn, body, state, handle);
  li.appendChild(row);
  return li;
}

// 목록 맨 아래에 새 단계를 적는 줄: 다음 번호 + 단계 고치는 칸과 같은 입력칸
function createNewStepItem(index) {
  const li = document.createElement("li");
  const row = document.createElement("div");
  row.className = "step";
  const slot = document.createElement("span");
  slot.className = "num-slot";
  const num = document.createElement("span");
  num.className = "step-num";
  num.textContent = String(index + 1);
  slot.appendChild(num);
  const body = document.createElement("div");
  body.className = "step-body";
  body.appendChild(createStepEditor({ text: "", memo: "" }, index));
  row.append(slot, body);
  li.appendChild(row);
  return li;
}

// 휴지통 화면 그리기: 지운 레시피마다 [복구하기] [영구 삭제]
function showTrash() {
  recipeTitle.textContent = "휴지통";
  const note = document.createElement("p");
  note.className = "trash-note";
  note.setAttribute("role", "status");
  note.textContent = trashNote;
  recipeArea.appendChild(note);

  if (trash.length === 0) {
    const p = document.createElement("p");
    p.className = "placeholder";
    p.textContent = "휴지통이 비어 있어요. 지운 레시피는 여기로 옮겨져요.";
    recipeArea.appendChild(p);
    return;
  }

  const hint = document.createElement("p");
  hint.className = "hint";
  hint.textContent = "복구하기: 인덱스 탭으로 되돌리기 · 영구 삭제: 완전히 지우기";
  recipeArea.appendChild(hint);

  const list = document.createElement("ul");
  list.className = "trash-list";
  trash.forEach(function (r) {
    const li = document.createElement("li");
    li.className = "trash-item";
    const name = document.createElement("span");
    name.className = "trash-name";
    name.textContent = r.name;
    const meta = document.createElement("span");
    meta.className = "trash-meta";
    meta.textContent = "단계 " + r.steps.length + "개";
    const actions = document.createElement("div");
    actions.className = "inline-actions";
    const restore = document.createElement("button");
    restore.type = "button";
    restore.className = "btn btn-sub";
    restore.dataset.action = "restore";
    restore.dataset.id = r.id;
    restore.textContent = "복구하기";
    restore.setAttribute("aria-label", r.name + " 복구하기");
    const forever = document.createElement("button");
    forever.type = "button";
    forever.className = "btn btn-forever";
    forever.dataset.action = "forever";
    forever.dataset.id = r.id;
    forever.textContent = "영구 삭제";
    forever.setAttribute("aria-label", r.name + " 영구 삭제");
    actions.append(restore, forever);
    li.append(name, meta, actions);
    list.appendChild(li);
  });
  recipeArea.appendChild(list);
}

// 레시피 목록 그리기: 저장해 둔 완료 상태(done)를 그대로 다시 그림
function showRecipe() {
  recipeArea.textContent = "";
  if (showingTrash) {
    showTrash();
    return;
  }
  recipeTitle.textContent = "레시피 순서";
  const recipe = findRecipe(selectedId);

  if (!recipe) {
    const p = document.createElement("p");
    p.className = "placeholder";
    const cat = findCat(selectedCat);
    if (recipes.length === 0) {
      p.textContent = "아직 레시피가 없어요. 오른쪽 '+ 레시피 추가'를 눌러 첫 레시피를 적어 보세요.";
    } else if (cat && visibleRecipes().length === 0) {
      p.textContent = "'" + cat.name + "' 카테고리에 아직 레시피가 없어요. 오른쪽 '+ 레시피 추가'를 눌러 적어 보세요.";
    } else {
      p.textContent = "오른쪽 인덱스 탭에서 레시피를 고르면 순서가 여기에 나타납니다.";
    }
    recipeArea.appendChild(p);
    return;
  }

  // 빵 이름: 누르면 고치기, 꾹 누르면 레시피 통째로 지우기
  if (editing && editing.type === "name") {
    recipeArea.appendChild(createNameEditor(recipe));
  } else {
    const nameBtn = document.createElement("button");
    nameBtn.type = "button";
    nameBtn.className = "edit-text recipe-name";
    nameBtn.dataset.target = "name";
    nameBtn.setAttribute("aria-describedby", "edit-help");
    nameBtn.textContent = recipe.name;
    recipeArea.appendChild(nameBtn);
  }

  const hint = document.createElement("p");
  hint.className = "hint";
  hint.id = "edit-help";
  hint.textContent = "번호 누르기: 완료 · 글씨 누르기: 고치기 · 글씨 꾹 누르기: 지우기 · 오른쪽 점 손잡이 끌기: 순서 바꾸기";
  recipeArea.appendChild(hint);

  const list = document.createElement("ol");
  list.className = "steps";
  recipe.steps.forEach(function (step, i) {
    list.appendChild(createStepItem(step, i, recipe.done[i]));
  });

  // 맨 아래: 새 단계 적는 줄, 또는 [+ 단계 추가] 버튼
  const adding = editing && editing.type === "add";
  if (adding) list.appendChild(createNewStepItem(recipe.steps.length));
  recipeArea.appendChild(list);
  if (adding) return;
  if (recipe.steps.length >= MAX_STEPS) {
    const full = document.createElement("p");
    full.className = "limit-note";
    full.textContent = "단계는 " + MAX_STEPS + "개까지 적을 수 있어요.";
    recipeArea.appendChild(full);
    return;
  }
  const more = document.createElement("button");
  more.type = "button";
  more.className = "btn btn-sub add-step-more";
  more.dataset.action = "add-step";
  more.textContent = "+ 단계 추가";
  recipeArea.appendChild(more);
}

// 레시피 열기: 다른 레시피나 휴지통에서 넘어올 때, 모든 단계를 끝낸 레시피면 체크를 비우고 보여 줌
function selectRecipe(id) {
  if (id !== selectedId || showingTrash) resetIfFinished(findRecipe(id));
  selectedId = id;
  showingTrash = false;
  editing = null;
  renderTabs();
  showRecipe();
  saveData();
}

// 카테고리 탭 고르기: 그 카테고리의 레시피만 오른쪽 인덱스에 보임
// 보던 레시피가 그 카테고리에 없으면 첫 레시피를 열고, 하나도 없으면 빈 안내를 보여 줌
function selectCategory(id) {
  if (id !== ALL && !findCat(id)) return;
  selectedCat = id;
  const visible = visibleRecipes();
  const stay = !showingTrash && visible.some(function (r) { return r.id === selectedId; });
  renderCats();
  if (stay) {
    editing = null;
    renderTabs();
    showRecipe();
    saveData();
  } else if (visible.length > 0) {
    selectedId = null;
    selectRecipe(visible[0].id);
  } else {
    selectedId = null;
    showingTrash = false;
    editing = null;
    renderTabs();
    showRecipe();
    saveData();
  }
}

// 새 카테고리 이름 적는 칸 열기/닫기
function openCatForm() {
  catForm.hidden = false;
  catInput.value = "";
  catError.textContent = "";
  catInput.focus();
}

function closeCatForm() {
  catForm.hidden = true;
  catError.textContent = "";
  catAddBtn.focus();
}

// 카테고리 추가: 이름 검사 후 탭을 만들고 바로 그 탭을 고름 (빈 카테고리도 그대로 남음)
function addCategory() {
  const name = catInput.value.trim();
  const key = name.toLowerCase();
  let message = "";
  if (!name) message = "카테고리 이름을 적어 주세요.";
  else if (key === "전체" || categories.some(function (c) { return c.name.toLowerCase() === key; })) {
    message = "'" + name + "' 카테고리가 이미 있어요. 다른 이름을 적어 주세요.";
  } else if (categories.length >= MAX_CATS) message = "카테고리는 " + MAX_CATS + "개까지 만들 수 있어요.";
  if (message) {
    catError.textContent = message;
    catInput.focus();
    return;
  }
  const cat = { id: "c" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), name: name };
  categories.push(cat);
  catForm.hidden = true;
  catError.textContent = "";
  selectCategory(cat.id);
  const tab = catTabsBox.querySelector('[data-cat="' + cat.id + '"]');
  if (tab) tab.focus();
}

// 휴지통 탭 열기 (보던 레시피는 selectedId에 그대로 기억)
function openTrash() {
  showingTrash = true;
  editing = null;
  trashNote = "";
  renderTabs();
  showRecipe();
}

// 휴지통에서 하나를 뺀 뒤, 같은 자리의 다음 레시피 버튼으로 초점을 옮김
function focusTrashAt(at) {
  const buttons = recipeArea.querySelectorAll('[data-action="restore"]');
  (buttons[at] || buttons[at - 1] || trashTab).focus();
}

// 복구: 휴지통에서 빼서 인덱스 탭 맨 아래로 되돌림. 같은 이름이 생겼으면 번호를 붙임
function restoreRecipe(id) {
  const at = trash.findIndex(function (r) { return r.id === id; });
  if (at < 0) return;
  const recipe = trash[at];
  const oldName = recipe.name;
  trash.splice(at, 1);
  recipe.name = freeName(oldName);
  recipe.cat = catOrNone(recipe.cat);
  recipes.push(recipe);
  const cat = findCat(recipe.cat);
  const where = cat ? "'" + cat.name + "' 카테고리" : "'분류 없음'";
  trashNote = recipe.name === oldName
    ? "'" + recipe.name + "' 레시피를 " + where + (cat ? "로" : "으로") + " 복구했어요."
    : "같은 이름의 레시피가 있어서 '" + recipe.name + "'(이)라는 이름으로 " + where + "에 복구했어요.";
  renderTabs();
  showRecipe();
  saveData();
  focusTrashAt(at);
}

// 영구 삭제: 휴지통에서도 지움 (되돌릴 수 없음)
function deleteForever(id) {
  const at = trash.findIndex(function (r) { return r.id === id; });
  if (at < 0) return;
  const name = trash[at].name;
  trash.splice(at, 1);
  trashNote = "'" + name + "' 레시피를 완전히 지웠어요.";
  showRecipe();
  saveData();
  focusTrashAt(at);
}

// 단계 하나의 완료 상태를 뒤집기 (완료 ↔ 미완료) + 레시피 데이터에 기억
function toggleStep(numBtn) {
  const recipe = findRecipe(selectedId);
  if (!recipe) return;
  const row = numBtn.closest(".step");
  const i = Number(row.dataset.index);
  const isDone = row.classList.toggle("done");
  recipe.done[i] = isDone;
  numBtn.setAttribute("aria-pressed", isDone ? "true" : "false");
  row.querySelector(".step-state").textContent = isDone ? "완료" : "";
  saveData();
  // 마지막 단계까지 끝나도 팝업이나 화면 전환 없이 목록을 그대로 둡니다.
  // 체크는 다음에 이 레시피를 다시 열 때 비워집니다.
}

// ===== 그 자리에서 고치기 =====

// 글씨 버튼이 이름인지, 몇 번째 단계인지
function targetOf(el) {
  if (el.dataset.target === "name") return { type: "name" };
  return { type: "step", index: Number(el.closest(".step").dataset.index) };
}

// 고치기 끝난 뒤 그 글씨 버튼으로 초점을 돌려줌
function focusTarget(target) {
  const nameEl = recipeArea.querySelector('.edit-text[data-target="name"]');
  let el = nameEl;
  if (target.type === "step") el = recipeArea.querySelector('.step[data-index="' + target.index + '"] .edit-text');
  if (target.type === "add") el = recipeArea.querySelector('[data-action="add-step"]') || nameEl;
  if (el) el.focus();
}

function startEdit(target) {
  editing = target;
  showRecipe();
  const field = recipeArea.querySelector(".inline-edit input, .inline-edit textarea");
  if (field) {
    field.focus();
    field.setSelectionRange(field.value.length, field.value.length);
  }
}

function cancelEdit() {
  const target = editing;
  editing = null;
  showRecipe();
  if (target) focusTarget(target);
}

function showEditError(message, field) {
  recipeArea.querySelector(".inline-error").textContent = message;
  field.focus();
}

function commitEdit() {
  const recipe = findRecipe(selectedId);
  if (!recipe || !editing) return;
  if (editing.type === "name") {
    const input = recipeArea.querySelector(".ie-name");
    let name = input.value.trim();
    if (!name) name = autoName(recipe.id);
    if (nameTaken(name, recipe.id)) {
      showEditError("'" + name + "' 레시피가 이미 있어요. 다른 이름을 적어 주세요.", input);
      return;
    }
    recipe.name = name;
  } else {
    const t = recipeArea.querySelector(".ie-text");
    const text = t.value.trim();
    const memo = recipeArea.querySelector(".ie-memo").value.trim();
    if (!text) {
      showEditError(editing.type === "add"
        ? "요리 순서를 적어 주세요. 그만두려면 [취소]를 누르세요."
        : "요리 순서는 비울 수 없어요. 이 단계를 지우려면 글씨를 꾹 누르세요.", t);
      return;
    }
    if (editing.type === "add") {
      recipe.steps.push({ text: text, memo: memo });
      recipe.done.push(false);
    } else {
      recipe.steps[editing.index] = { text: text, memo: memo };
    }
  }
  const target = editing;
  editing = null;
  renderTabs();
  showRecipe();
  saveData();
  focusTarget(target);
}

// ===== 꾹 눌러 지우기 + 확인 창 =====
const confirmBack = document.getElementById("confirm");
const confirmTitle = document.getElementById("confirm-title");
const confirmMsg = document.getElementById("confirm-msg");
const confirmYes = document.getElementById("confirm-yes");
const confirmNo = document.getElementById("confirm-no");
let pendingDelete = null;   // 확인 창에서 [삭제]를 누르면 지울 것
let focusBeforeConfirm = null;

function shorten(text, max) {
  return text.length > max ? text.slice(0, max) + "…" : text;
}

function openConfirm(title, message, yesLabel, target) {
  confirmTitle.textContent = title;
  confirmMsg.textContent = message;
  confirmYes.textContent = yesLabel;
  pendingDelete = target;
  focusBeforeConfirm = document.activeElement;
  confirmBack.hidden = false;
  confirmNo.focus();   // 실수로 지우지 않게 [취소]에 먼저 초점
}

function askDelete(target) {
  const recipe = findRecipe(selectedId);
  if (!recipe) return;
  // 하나 남은 단계를 지우면 빈 레시피가 되므로 레시피를 통째로 휴지통으로 옮김
  if (target.type === "step" && recipe.steps.length === 1) target = { type: "name" };
  if (target.type === "name") {
    openConfirm("휴지통으로 옮길까요?",
      "'" + recipe.name + "' 레시피와 단계 " + recipe.steps.length + "개를 휴지통으로 옮겨요. 휴지통에서 복구할 수 있어요.",
      "휴지통으로", target);
  } else {
    openConfirm("정말 삭제할까요?",
      (target.index + 1) + "단계 '" + shorten(recipe.steps[target.index].text, 20) + "'을(를) 지워요. 뒤 단계 번호는 하나씩 앞당겨져요.",
      "삭제", target);
  }
}

function askForever(id) {
  const recipe = trash.find(function (r) { return r.id === id; });
  if (!recipe) return;
  openConfirm("영구 삭제할까요?",
    "'" + recipe.name + "' 레시피를 완전히 지워요. 되돌릴 수 없어요.",
    "영구 삭제", { type: "forever", id: id });
}

function closeConfirm() {
  confirmBack.hidden = true;
  pendingDelete = null;
  if (focusBeforeConfirm && document.contains(focusBeforeConfirm)) focusBeforeConfirm.focus();
}

function doDelete() {
  const recipe = findRecipe(selectedId);
  const target = pendingDelete;
  confirmBack.hidden = true;
  pendingDelete = null;
  if (target && target.type === "forever") {
    deleteForever(target.id);
    return;
  }
  if (!recipe || !target) return;
  editing = null;
  if (target.type === "name") {
    // 다음에 열 레시피는 지금 카테고리 안에서 고름
    const visible = visibleRecipes().slice();
    const vi = visible.indexOf(recipe);
    recipes.splice(recipes.indexOf(recipe), 1);
    trash.unshift(recipe);   // 바로 지우지 않고 휴지통 맨 앞으로
    const next = visible[vi + 1] || visible[vi - 1] || null;
    selectedId = null;
    if (next) {
      selectRecipe(next.id);
    } else {
      renderTabs();
      showRecipe();
      saveData();
    }
    const tab = tabsBox.querySelector('[aria-pressed="true"]');
    (tab || addBtn).focus();
  } else {
    recipe.steps.splice(target.index, 1);
    recipe.done.splice(target.index, 1);
    showRecipe();
    saveData();
    focusTarget({ type: "name" });
  }
}

confirmYes.addEventListener("click", doDelete);
confirmNo.addEventListener("click", closeConfirm);
confirmBack.addEventListener("click", function (event) {
  if (event.target === confirmBack) closeConfirm();
});
confirmBack.addEventListener("keydown", function (event) {
  if (event.key === "Escape") {
    closeConfirm();
  } else if (event.key === "Tab") {   // 확인 창 안에서만 초점이 돌게
    event.preventDefault();
    (document.activeElement === confirmYes ? confirmNo : confirmYes).focus();
  }
});

// 꾹 누르기 감지: 손가락(마우스)을 누른 채 LONG_PRESS_MS 동안 거의 안 움직이면 삭제 확인
let pressTimer = null;
let pressEl = null;
let pressX = 0;
let pressY = 0;
let skipClick = false;   // 꾹 누른 뒤 따라오는 클릭은 '고치기'로 넘어가지 않게 무시

function cancelPress() {
  clearTimeout(pressTimer);
  pressTimer = null;
  if (pressEl) pressEl.classList.remove("pressing");
  pressEl = null;
}

recipeArea.addEventListener("pointerdown", function (event) {
  skipClick = false;
  const el = event.target.closest(".edit-text");
  if (!el || (event.pointerType === "mouse" && event.button !== 0)) return;
  cancelPress();
  pressEl = el;
  pressX = event.clientX;
  pressY = event.clientY;
  el.classList.add("pressing");
  pressTimer = setTimeout(function () {
    const target = targetOf(pressEl);
    cancelPress();
    skipClick = true;
    askDelete(target);
  }, LONG_PRESS_MS);
});
recipeArea.addEventListener("pointermove", function (event) {
  if (pressEl && Math.abs(event.clientX - pressX) + Math.abs(event.clientY - pressY) > 10) cancelPress();
});
function endPress() {
  cancelPress();
  // 손을 뗀 뒤 클릭이 안 따라오는 경우를 위해 잠시 뒤 원래대로
  if (skipClick) setTimeout(function () { skipClick = false; }, 400);
}
document.addEventListener("pointerup", endPress);
document.addEventListener("pointercancel", endPress);
// 꾹 누른 뒤 손을 떼면 따라오는 클릭 한 번은 버림 (터치는 그 클릭이 방금 뜬 확인 창 바깥을 눌러 창이 바로 닫힐 수 있음)
document.addEventListener("click", function (event) {
  if (!skipClick) return;
  skipClick = false;
  event.stopPropagation();
  event.preventDefault();
}, true);
// 휴대폰에서 꾹 누를 때 뜨는 복사/메뉴 창을 막음
recipeArea.addEventListener("contextmenu", function (event) {
  if (event.target.closest(".edit-text")) event.preventDefault();
});

// ===== 단계 순서 바꾸기 (손잡이 끌어 놓기 / 키보드 위·아래 화살표) =====
// 단계를 옮길 때 완료 여부(done)도 같은 자리로 함께 옮겨서, 체크한 단계는 옮긴 뒤에도 그대로 줄이 그어져 있어요.

// order: 새 순서대로 늘어놓은 '원래 단계 번호' 배열 (예: [1, 2, 0] = 1단계를 맨 아래로)
function applyStepOrder(order) {
  const recipe = findRecipe(selectedId);
  if (!recipe) return;
  const steps = recipe.steps;
  const done = recipe.done;
  recipe.steps = order.map(function (i) { return steps[i]; });
  recipe.done = order.map(function (i) { return done[i] === true; });
}

function focusHandle(index) {
  const h = recipeArea.querySelectorAll(".drag-handle")[index];
  if (h) h.focus();
}

// 키보드: 손잡이에서 ↑ ↓ 로 한 칸씩 옮기기
function moveStepBy(from, delta) {
  const recipe = findRecipe(selectedId);
  if (!recipe) return;
  const to = from + delta;
  if (to < 0 || to >= recipe.steps.length) return;
  const order = recipe.steps.map(function (s, i) { return i; });
  order.splice(to, 0, order.splice(from, 1)[0]);
  applyStepOrder(order);
  showRecipe();
  saveData();
  focusHandle(to);
}

let drag = null;   // 끄는 중인 단계 { li, list, from, grabY, pointerId }

// 끄는 동안 번호를 지금 자리 기준으로 바로 고쳐 보여 줌
function renumberDuringDrag() {
  Array.prototype.forEach.call(drag.list.children, function (li, i) {
    li.querySelector(".step-num").textContent = String(i + 1);
  });
}

recipeArea.addEventListener("pointerdown", function (event) {
  const handle = event.target.closest(".drag-handle");
  if (!handle || handle.disabled || drag) return;
  if (event.pointerType === "mouse" && event.button !== 0) return;
  event.preventDefault();
  const li = handle.closest("li");
  const rect = li.getBoundingClientRect();
  drag = {
    li: li,
    list: li.parentNode,
    from: Number(li.querySelector(".step").dataset.index),
    grabY: event.clientY - rect.top,
    pointerId: event.pointerId
  };
  try { handle.setPointerCapture(event.pointerId); } catch (e) { /* 잡기 실패해도 문서 이벤트로 이어감 */ }
  li.classList.add("dragging");
});

function onDragMove(event) {
  if (!drag || event.pointerId !== drag.pointerId) return;
  event.preventDefault();
  const li = drag.li;
  li.style.transform = "";
  const height = li.getBoundingClientRect().height;
  const center = event.clientY - drag.grabY + height / 2;   // 끄는 단계의 가운데 높이
  // 가운데가 어느 단계의 절반을 넘었는지 보고 그 앞에 끼워 넣음
  const others = Array.prototype.filter.call(drag.list.children, function (x) { return x !== li; });
  let before = null;
  for (let i = 0; i < others.length; i++) {
    const r = others[i].getBoundingClientRect();
    if (center < r.top + r.height / 2) { before = others[i]; break; }
  }
  if (before) {
    if (li.nextElementSibling !== before) drag.list.insertBefore(li, before);
  } else if (drag.list.lastElementChild !== li) {
    drag.list.appendChild(li);
  }
  renumberDuringDrag();
  // 손가락(마우스)을 따라 움직이게: 지금 자리와 손 위치의 차이만큼 띄워 보여 줌
  const naturalTop = li.getBoundingClientRect().top;
  li.style.transform = "translateY(" + (event.clientY - drag.grabY - naturalTop) + "px)";
  // 화면 위·아래 끝에 가까우면 조금씩 스크롤
  if (event.clientY < 48) window.scrollBy(0, -12);
  else if (event.clientY > window.innerHeight - 48) window.scrollBy(0, 12);
}

function endDrag(event) {
  if (!drag || event.pointerId !== drag.pointerId) return;
  const d = drag;
  drag = null;
  d.li.classList.remove("dragging");
  d.li.style.transform = "";
  if (event.type === "pointercancel") {   // 브라우저가 끌기를 끊으면 원래 순서로
    showRecipe();
    return;
  }
  const order = Array.prototype.map.call(d.list.children, function (x) {
    return Number(x.querySelector(".step").dataset.index);
  });
  const to = order.indexOf(d.from);
  const changed = order.some(function (v, i) { return v !== i; });
  if (changed) applyStepOrder(order);
  showRecipe();
  if (changed) saveData();
  focusHandle(to);
}

document.addEventListener("pointermove", onDragMove, { passive: false });
document.addEventListener("pointerup", endDrag);
document.addEventListener("pointercancel", endDrag);

// ===== 아래 고정 입력창 =====

// 입력창이 화면 아래를 가리지 않도록 그 높이만큼 페이지 아래 여백을 줌
function fitBodyPadding() {
  document.body.style.paddingBottom = editor.hidden ? "" : editor.offsetHeight + "px";
}

// "요리 순서 + 메모" 칸 한 묶음을 밑에 추가
function addStepField() {
  const count = stepFields.children.length;
  if (count >= MAX_STEPS) {
    editorError.textContent = "단계는 " + MAX_STEPS + "개까지 적을 수 있어요.";
    return;
  }
  const n = count + 1;
  const box = document.createElement("div");
  box.className = "step-field";

  const tLabel = document.createElement("label");
  tLabel.htmlFor = "step-text-" + n;
  tLabel.textContent = n + "단계";
  const t = document.createElement("textarea");
  t.id = "step-text-" + n;
  t.className = "f-text";
  t.rows = 2;
  t.maxLength = 200;

  const mLabel = document.createElement("label");
  mLabel.htmlFor = "step-memo-" + n;
  mLabel.textContent = "메모 (선택)";
  const m = document.createElement("input");
  m.type = "text";
  m.setAttribute("aria-label", n + "단계 메모 (선택)");
  m.id = "step-memo-" + n;
  m.className = "f-memo";
  m.maxLength = 100;
  m.autocomplete = "off";

  box.append(tLabel, t, mLabel, m);
  stepFields.appendChild(box);
  fitBodyPadding();
  return t;
}

// 레시피를 넣을 카테고리 고르는 칸: 분류 없음 + 만든 카테고리. 지금 보는 카테고리를 미리 골라 둠
function fillCatSelect() {
  newCatSelect.textContent = "";
  [{ id: "", name: "분류 없음 (전체에서만 보여요)" }].concat(categories).forEach(function (c) {
    const opt = document.createElement("option");
    opt.value = c.id;
    opt.textContent = c.name;
    newCatSelect.appendChild(opt);
  });
  newCatSelect.value = selectedCat === ALL ? "" : selectedCat;
}

function openEditor() {
  if (editor.hidden) {
    editorForm.reset();
    stepFields.textContent = "";
    editorError.textContent = "";
    fillCatSelect();
    addStepField();
    editor.hidden = false;
    fitBodyPadding();
  }
  nameInput.focus();
}

function closeEditor() {
  editor.hidden = true;
  editorError.textContent = "";
  fitBodyPadding();
  addBtn.focus();
}

// 저장: 입력을 검사하고, 맞으면 새 레시피를 만들어 인덱스 탭에 추가
// (빵 이름을 비우면 '이름 없는 레시피'로 저장)
function saveRecipe() {
  const typed = nameInput.value.trim();
  if (typed && nameTaken(typed, null)) {
    editorError.textContent = "'" + typed + "' 레시피가 이미 있어요. 다른 이름을 적어 주세요.";
    nameInput.focus();
    return;
  }

  const steps = [];
  const boxes = stepFields.querySelectorAll(".step-field");
  for (let i = 0; i < boxes.length; i++) {
    const t = boxes[i].querySelector(".f-text");
    const text = t.value.trim();
    const memo = boxes[i].querySelector(".f-memo").value.trim();
    if (!text && memo) {
      editorError.textContent = (i + 1) + "단계에 메모만 있어요. 요리 순서도 적어 주세요.";
      t.focus();
      return;
    }
    if (text) steps.push({ text: text, memo: memo });
  }
  if (steps.length === 0) {
    editorError.textContent = "요리 순서를 한 단계 이상 적어 주세요.";
    boxes[0].querySelector(".f-text").focus();
    return;
  }

  const recipe = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    name: typed || autoName(null),
    steps: steps,
    done: steps.map(function () { return false; }),
    cat: catOrNone(newCatSelect.value)
  };
  recipes.push(recipe);
  editor.hidden = true;
  editorError.textContent = "";
  fitBodyPadding();
  // 다른 카테고리를 보던 중이면 새 레시피가 보이도록 그 카테고리 탭으로 옮김 (분류 없음이면 전체)
  if (selectedCat !== ALL && selectedCat !== recipe.cat) {
    selectedCat = recipe.cat || ALL;
    renderCats();
  }
  selectRecipe(recipe.id);
  const newTab = tabsBox.querySelector('[data-id="' + recipe.id + '"]');
  if (newTab) newTab.focus();
}

// ===== 이벤트 연결 =====

// 인덱스 탭을 누르면 그 레시피를 보여줌 (모든 단계를 끝낸 레시피면 체크를 비우고 보여줌)
tabsBox.addEventListener("click", function (event) {
  const tab = event.target.closest(".tab");
  if (!tab) return;
  selectRecipe(tab.dataset.id);
});
trashTab.addEventListener("click", openTrash);

// 동그란 번호를 클릭했을 때 줄이 그어지고, 다시 클릭하면 취소되는 부분입니다.
// 목록은 탭을 바꿀 때마다 새로 그려지므로, 바깥 상자(recipeArea)에 한 번만 리스너를 달고
// 실제로 눌린 번호 버튼(.num-btn)을 찾아 그 단계에 "done" 클래스를 붙였다 뗐다(toggle) 합니다.
// "done" 클래스가 붙으면 CSS가 글씨를 연하게 하고 가운데 줄(line-through)을 긋습니다.
// 글씨(.edit-text)를 누르면 그 자리에서 고치는 칸으로 바뀝니다.
recipeArea.addEventListener("click", function (event) {
  const numBtn = event.target.closest(".num-btn");
  if (numBtn) {
    toggleStep(numBtn);
    return;
  }
  const textBtn = event.target.closest(".edit-text");
  if (textBtn) {
    startEdit(targetOf(textBtn));
    return;
  }
  const action = event.target.closest("[data-action]");
  if (!action) return;
  if (action.dataset.action === "save-edit") commitEdit();
  if (action.dataset.action === "cancel-edit") cancelEdit();
  if (action.dataset.action === "add-step") startEdit({ type: "add" });
  if (action.dataset.action === "restore") restoreRecipe(action.dataset.id);
  if (action.dataset.action === "forever") askForever(action.dataset.id);
});

// 키보드: 고치는 칸에서 Enter = 저장(여러 줄 칸 제외), Esc = 취소 / 글씨에서 Delete = 지우기
recipeArea.addEventListener("keydown", function (event) {
  if (event.target.closest(".inline-edit")) {
    if (event.key === "Escape") {
      cancelEdit();
    } else if (event.key === "Enter" && event.target.tagName === "INPUT" && !event.isComposing) {
      event.preventDefault();
      commitEdit();
    }
    return;
  }
  if (event.key === "Delete" && event.target.closest(".edit-text")) {
    event.preventDefault();
    askDelete(targetOf(event.target.closest(".edit-text")));
  }
  const handle = event.target.closest(".drag-handle");
  if (handle && !drag && (event.key === "ArrowUp" || event.key === "ArrowDown")) {
    event.preventDefault();
    moveStepBy(Number(handle.closest(".step").dataset.index), event.key === "ArrowUp" ? -1 : 1);
  }
});

// 카테고리 탭·추가
catTabsBox.addEventListener("click", function (event) {
  const tab = event.target.closest(".cat-tab");
  if (tab) selectCategory(tab.dataset.cat);
});
catAddBtn.addEventListener("click", openCatForm);
document.getElementById("cat-cancel").addEventListener("click", closeCatForm);
catForm.addEventListener("submit", function (event) {
  event.preventDefault();
  addCategory();
});
catForm.addEventListener("keydown", function (event) {
  if (event.key === "Escape") closeCatForm();
});

addBtn.addEventListener("click", openEditor);
document.getElementById("add-step-btn").addEventListener("click", function () {
  editorError.textContent = "";
  const t = addStepField();
  if (t) t.focus();
});
document.getElementById("cancel-btn").addEventListener("click", closeEditor);
editorForm.addEventListener("submit", function (event) {
  event.preventDefault();
  saveRecipe();
});
window.addEventListener("resize", fitBodyPadding);

// ===== 시작 =====
loadData();
if (!selectedId && visibleRecipes().length > 0) selectedId = visibleRecipes()[0].id;
// 새로 연 것도 '다시 여는 것'이라, 모든 단계를 끝낸 레시피면 체크를 비움
if (resetIfFinished(findRecipe(selectedId))) saveData();
renderCats();
renderTabs();
showRecipe();
</script>
</body>
</html>
