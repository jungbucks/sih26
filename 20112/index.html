<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>출시 예정 게임 위시리스트 관리기</title>
<meta name="description" content="사고 싶은 게임의 출시일을 등록하면 오늘 날짜 기준으로 구매 가능/출시 예정을 나눠 보여 주고, 산 게임은 따로 모아 기록하는 위시리스트">
  <meta name="class" content="M반 (2-8)">
  <meta name="status" content="1회 개선">

<!-- ===================== 스타일 ===================== -->
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --text: #1f2328;
    --muted: #5b636e;
    --line: #d8dde3;
    --accent: #1d5fa8;
    --accent-weak: #e8f0fa;
    --ok: #1d7a3e;
    --ok-weak: #e6f4ea;
    --danger: #b3261e;
    --danger-weak: #fbeaea;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", "Noto Sans KR", sans-serif;
    font-size: 17px;
    line-height: 1.7;
    word-break: keep-all;
    overflow-wrap: break-word;
  }
  .banner {
    background: var(--accent);
    color: #fff;
    text-align: center;
    padding: 10px 16px;
    font-weight: 700;
  }
  main { max-width: 44rem; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 1.5rem; margin: 8px 0 4px; line-height: 1.4; }
  .lead { color: var(--muted); margin: 0 0 20px; }
  section { margin-top: 28px; }
  h2 { font-size: 1.2rem; margin: 0 0 10px; display: flex; align-items: baseline; gap: 8px; }
  h2 .count { font-size: 0.95rem; color: var(--muted); font-weight: 400; }

  /* 입력 폼 */
  .form-box { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .field { display: flex; flex-direction: column; min-width: 0; }
  .field label { font-weight: 600; font-size: 0.95rem; margin-bottom: 4px; }
  .field .opt { color: var(--muted); font-weight: 400; }
  input {
    font: inherit; font-size: 16px;
    padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px;
    width: 100%; min-width: 0; background: #fff; color: var(--text);
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  input.invalid { border: 2px solid var(--danger); background: var(--danger-weak); }
  .msg { margin: 12px 0 0; font-weight: 600; }
  .msg.error { color: var(--danger); }
  .msg.info { color: var(--ok); }
  .msg:empty { display: none; }

  button {
    font: inherit; font-size: 16px; cursor: pointer;
    border-radius: 8px; padding: 9px 16px; border: 1px solid transparent;
  }
  .btn-primary { background: var(--accent); color: #fff; margin-top: 14px; width: 100%; font-weight: 700; }
  .btn-primary:hover { background: #174e8b; }
  .btn-ok { background: var(--ok); color: #fff; font-weight: 600; }
  .btn-ok:hover { background: #15602f; }
  .btn-ghost { background: #fff; color: var(--text); border-color: var(--line); }
  .btn-danger { background: #fff; color: var(--danger); border-color: var(--danger); font-weight: 600; }
  .btn-danger-solid { background: var(--danger); color: #fff; font-weight: 600; }
  button:focus-visible { outline: 3px solid #f0b400; outline-offset: 2px; }

  /* 카드 목록 */
  .list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; gap: 12px;
  }
  .card .info { min-width: 0; }
  .card .title { font-weight: 700; font-size: 1.05rem; margin: 0; }
  .card .meta { color: var(--muted); font-size: 0.95rem; margin: 2px 0 0; }
  .tag {
    display: inline-block; font-size: 0.85rem; font-weight: 700;
    padding: 1px 8px; border-radius: 999px; margin-left: 6px; vertical-align: 2px;
  }
  .tag-ok { background: var(--ok-weak); color: var(--ok); }
  .tag-dday { background: var(--accent-weak); color: var(--accent); }
  .tag-done { background: #eceef1; color: var(--muted); }
  .empty { color: var(--muted); background: var(--card); border: 1px dashed var(--line); border-radius: 12px; padding: 14px; margin: 0; }

  /* 최하단 초기화 */
  .footer-zone { margin-top: 40px; border-top: 1px solid var(--line); padding-top: 20px; }
  .confirm-box {
    margin-top: 12px; border: 2px solid var(--danger); background: var(--danger-weak);
    border-radius: 12px; padding: 14px;
  }
  .confirm-box p { margin: 0 0 10px; font-weight: 600; }
  .confirm-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .save-note { color: var(--muted); font-size: 0.95rem; margin-top: 12px; }
  .save-note.warn { color: var(--danger); font-weight: 600; }

  /* 카드 오른쪽 버튼 묶음 ([구매 완료]·[수정]·[삭제]) */
  .actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; flex-shrink: 0; }
  .actions button { padding: 7px 12px; }
  .tag-today { background: #fff3c4; color: #7a5200; }

  /* 오늘 출시 안내 상자 + 알림 상태 줄 */
  .today-box {
    background: #fff8db; border: 2px solid #e0b400; border-radius: 12px;
    padding: 12px 14px; margin: 0 0 14px;
  }
  .today-box h2 { font-size: 1.05rem; margin: 0 0 4px; }
  .today-box ul { margin: 0; padding-left: 1.2em; }
  .today-box li { font-weight: 600; }
  .notify-row {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 10px 14px; font-size: 0.95rem;
  }
  .notify-row .state { color: var(--muted); }
  .notify-row .state b { color: var(--text); }
  .notify-row button { padding: 6px 12px; font-size: 15px; }

  /* 가운데 팝업(모달) — 샌드박스에서는 alert/confirm이 막혀서 페이지 안에 직접 만든다 */
  body.modal-open { overflow: hidden; }
  .modal-back {
    position: fixed; inset: 0; background: rgba(20, 24, 30, 0.55);
    display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10;
  }
  .modal-back[hidden] { display: none; }
  .modal {
    background: var(--card); border-radius: 14px; padding: 18px; width: 100%; max-width: 30rem;
    max-height: calc(100vh - 32px); overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.25);
  }
  .modal-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; }
  .modal-head h2 { margin: 0; }
  .modal-x { background: #fff; border: 1px solid var(--line); padding: 2px 10px; font-size: 20px; line-height: 1.4; }
  .modal .confirm-actions { margin-top: 16px; justify-content: flex-end; }
  .modal .del-name { margin: 4px 0 0; color: var(--muted); }

  @media (max-width: 480px) {
    .grid { grid-template-columns: 1fr; }
    .card { flex-direction: column; align-items: stretch; }
    .card .btn-ok { width: 100%; }
    .actions { justify-content: stretch; }
    .actions button { flex: 1 1 auto; }
  }
</style>
</head>
<body>

<!-- ===================== 화면 구조 ===================== -->
<div class="banner" role="note">계획적인 소비를 합시다!</div>

<main>
  <h1>출시 예정 게임 위시리스트 관리기</h1>
  <p class="lead">사고 싶은 게임과 출시일을 적어 두면, 오늘 날짜를 기준으로 지금 살 수 있는 게임과 아직 기다려야 하는 게임을 나눠서 보여 줍니다.</p>

  <!-- 오늘 출시 안내: 출시일이 오늘(D-Day 0)인 게임이 있을 때만 보인다 -->
  <div id="today-box" class="today-box" hidden role="status" aria-live="polite">
    <h2>오늘 출시</h2>
    <ul id="today-list"></ul>
  </div>

  <!-- 브라우저 알림 상태 -->
  <div class="notify-row">
    <span class="state">브라우저 알림: <b id="notify-state">확인 중…</b></span>
    <button type="button" id="notify-btn" class="btn-ghost" hidden>브라우저 알림 켜기</button>
  </div>

  <!-- 입력 섹션 -->
  <section aria-labelledby="form-title">
    <h2 id="form-title">게임 등록하기</h2>
    <form id="game-form" class="form-box" novalidate>
      <div class="grid">
        <div class="field">
          <label for="in-title">게임 이름 (필수)</label>
          <input id="in-title" type="text" maxlength="40" placeholder="예: 픽셀 아일랜드" autocomplete="off">
        </div>
        <div class="field">
          <label for="in-date">출시 예정일 (필수)</label>
          <input id="in-date" type="date">
        </div>
        <div class="field">
          <label for="in-price">가격 <span class="opt">(선택, 원)</span></label>
          <input id="in-price" type="number" min="0" step="100" inputmode="numeric" placeholder="예: 25000">
        </div>
        <div class="field">
          <label for="in-platform">실행 기종 <span class="opt">(선택)</span></label>
          <input id="in-platform" type="text" maxlength="20" placeholder="예: PC, Switch" autocomplete="off">
        </div>
      </div>
      <button type="submit" class="btn-primary">게임 등록</button>
      <p id="form-msg" class="msg" role="status" aria-live="polite"></p>
    </form>
  </section>

  <!-- 수정·삭제 결과 안내 -->
  <p id="list-msg" class="msg info" role="status" aria-live="polite" tabindex="-1"></p>

  <!-- 중앙 섹션 1: 구매 가능 게임 -->
  <section aria-labelledby="avail-title">
    <h2 id="avail-title">구매 가능 게임 <span class="count" id="avail-count"></span></h2>
    <ul id="avail-list" class="list"></ul>
  </section>

  <!-- 중앙 섹션 2: 출시 예정 게임 -->
  <section aria-labelledby="up-title">
    <h2 id="up-title">출시 예정 게임 <span class="count" id="up-count"></span></h2>
    <ul id="up-list" class="list"></ul>
  </section>

  <!-- 하단 섹션: 내가 산 게임 -->
  <section aria-labelledby="bought-title">
    <h2 id="bought-title">내가 산 게임 <span class="count" id="bought-count"></span></h2>
    <ul id="bought-list" class="list"></ul>
  </section>

  <!-- 최하단: 전체 데이터 초기화 -->
  <div class="footer-zone">
    <button type="button" id="reset-btn" class="btn-danger">전체 데이터 초기화</button>
    <div id="confirm-box" class="confirm-box" hidden role="alertdialog" aria-labelledby="confirm-text">
      <p id="confirm-text">정말 모든 게임 기록을 지울까요? 지운 뒤에는 되돌릴 수 없습니다.</p>
      <div class="confirm-actions">
        <button type="button" id="confirm-yes" class="btn-danger-solid">네, 모두 지우기</button>
        <button type="button" id="confirm-no" class="btn-ghost">취소</button>
      </div>
    </div>
    <p id="save-note" class="save-note"></p>
  </div>
</main>

<!-- 수정 팝업(모달) -->
<div id="edit-back" class="modal-back" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="edit-title">
    <div class="modal-head">
      <h2 id="edit-title">게임 정보 수정</h2>
      <button type="button" class="modal-x" data-close="edit" aria-label="수정 창 닫기">×</button>
    </div>
    <form id="edit-form" novalidate>
      <div class="grid">
        <div class="field">
          <label for="ed-title">게임 이름 (필수)</label>
          <input id="ed-title" type="text" maxlength="40" autocomplete="off">
        </div>
        <div class="field">
          <label for="ed-date">출시 예정일 (필수)</label>
          <input id="ed-date" type="date">
        </div>
        <div class="field">
          <label for="ed-price">가격 <span class="opt">(선택, 원)</span></label>
          <input id="ed-price" type="number" min="0" step="100" inputmode="numeric">
        </div>
        <div class="field">
          <label for="ed-platform">실행 기종 <span class="opt">(선택)</span></label>
          <input id="ed-platform" type="text" maxlength="20" autocomplete="off">
        </div>
      </div>
      <p id="edit-msg" class="msg error" role="status" aria-live="polite"></p>
      <div class="confirm-actions">
        <button type="button" class="btn-ghost" data-close="edit">취소</button>
        <button type="submit" class="btn-ok">저장</button>
      </div>
    </form>
  </div>
</div>

<!-- 삭제 확인 팝업(모달) -->
<div id="del-back" class="modal-back" hidden>
  <div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="del-title" aria-describedby="del-name">
    <div class="modal-head">
      <h2 id="del-title">정말 삭제하시겠습니까?</h2>
      <button type="button" class="modal-x" data-close="del" aria-label="삭제 창 닫기">×</button>
    </div>
    <p id="del-name" class="del-name"></p>
    <div class="confirm-actions">
      <button type="button" class="btn-ghost" data-close="del">취소</button>
      <button type="button" id="del-yes" class="btn-danger-solid">확인</button>
    </div>
  </div>
</div>

<script>
// ===================== 예시 데이터·설정 =====================
const STORAGE_KEY = "sih26:20112:games";   // 게임 배열을 저장하는 이름표
const MAX_GAMES = 30;                       // 등록 가능한 최대 개수
const NOTIFIED_KEY = "sih26:20112:notified"; // 오늘 이미 알림을 보낸 게임 id 기록

// 전시판 미리보기(샌드박스 iframe) 안에서 실행 중인지 확인한다.
// 이때는 저장과 브라우저 알림이 막혀 있으므로 '새 탭 실행'을 안내한다.
const IN_PREVIEW = window.origin === "null" && location.protocol !== "file:";

// 처음 실행할 때 자동으로 넣어 주는 가상 예시 데이터
const SAMPLE_GAMES = [
  { title: "픽셀 아일랜드", date: "2026-03-01", price: 25000, platform: "PC" },
  { title: "우주 탐험대", date: "2026-12-25", price: 58000, platform: "Switch" }
];

// ===================== 데이터·상태 =====================
// 게임 하나 = { id, title, date, price, platform, purchased }
let games = [];
let canSave = true;   // localStorage를 쓸 수 있는지 여부

// ===================== 처리 함수 =====================

// localStorage에서 게임 배열을 읽어 온다.
// 저장된 적이 없으면 null을 돌려준다(→ 예시 데이터 사용).
// 샌드박스 등에서 localStorage 접근 자체가 막히면 예외가 나므로 try/catch로 감싼다.
function loadGames() {
  try {
    const text = localStorage.getItem(STORAGE_KEY);
    if (text === null) return null;          // 한 번도 저장한 적 없음
    const data = JSON.parse(text);           // 글자(JSON) → 배열
    return Array.isArray(data) ? data : null;
  } catch (e) {
    canSave = false;                          // 저장소를 못 씀 → 메모리에서만 동작
    return null;
  }
}

// 지금 games 배열을 JSON 글자로 바꿔 localStorage에 저장한다.
// 실패해도 프로그램은 계속 돌아가고, 화면 아래에 "저장되지 않음"을 알려 준다.
function saveGames() {
  try {
    const text = JSON.stringify(games);
    localStorage.setItem(STORAGE_KEY, text);
    // 정말 저장됐는지 다시 읽어서 확인한다
    canSave = localStorage.getItem(STORAGE_KEY) === text;
  } catch (e) {
    canSave = false;
  }
  renderSaveNote();
}

// 새 게임 객체를 만든다. id는 겹치지 않도록 시간+난수로 만든다.
function makeGame(title, date, price, platform) {
  return {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
    title: title,
    date: date,
    price: price,
    platform: platform,
    purchased: false
  };
}

// 오늘 날짜를 "YYYY-MM-DD" 글자로 만든다(내 컴퓨터 시계 기준).
function todayString() {
  const now = new Date();
  const y = now.getFullYear();
  const m = String(now.getMonth() + 1).padStart(2, "0");
  const d = String(now.getDate()).padStart(2, "0");
  return y + "-" + m + "-" + d;
}

// "YYYY-MM-DD" 글자를 그 날 0시의 Date 객체로 바꾼다.
// new Date("2026-03-01")처럼 쓰면 세계 표준시(UTC)로 해석돼 하루가 어긋날 수 있어서
// 연·월·일을 직접 나눠 넣는다.
function toDate(str) {
  const parts = str.split("-");
  return new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
}

// 출시일까지 남은 날 수를 계산한다. (출시일 - 오늘)
// Date 객체끼리 빼면 밀리초 차이가 나오므로 하루(1000*60*60*24)로 나눈다.
function daysUntil(dateStr) {
  const diffMs = toDate(dateStr) - toDate(todayString());
  return Math.round(diffMs / (1000 * 60 * 60 * 24));
}

// 게임을 분류한다.
// 출시일이 오늘이거나 이미 지났으면 → "구매 가능"
// 출시일이 오늘보다 뒤면           → "출시 예정"
function classify(game) {
  if (game.purchased) {
    return "bought";                       // 이미 산 게임
  } else if (daysUntil(game.date) <= 0) {
    return "available";                    // 남은 날이 0 이하 = 출시됨
  } else {
    return "upcoming";                     // 아직 출시 전
  }
}

// 날짜 입력값이 실제로 있는 날짜인지 확인한다(예: 2026-02-30은 X).
function isValidDate(str) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(str)) return false;
  const d = toDate(str);
  const parts = str.split("-").map(Number);
  return d.getFullYear() === parts[0] && d.getMonth() + 1 === parts[1] && d.getDate() === parts[2];
}

// 정렬: 출시일이 빠른(가까운) 순서. 같으면 등록한 순서 유지.
function byDate(a, b) {
  return a.date < b.date ? -1 : a.date > b.date ? 1 : 0;
}

// [구매 완료] 처리: purchased를 true로 바꾸고 저장한다.
function markPurchased(id) {
  const game = games.find(function (g) { return g.id === id; });
  if (!game) return;
  game.purchased = true;
  saveGames();
  render();
}

// 전체 데이터 초기화: 배열을 비우고, 빈 배열을 저장해 예시 데이터가 다시 생기지 않게 한다.
function resetAll() {
  games = [];
  try {
    localStorage.removeItem(STORAGE_KEY);
  } catch (e) { /* 저장소를 못 쓰는 환경이면 무시 */ }
  saveGames();   // 빈 배열 저장 → 다음 접속에도 빈 상태
  render();
}

// ===================== 화면 갱신 =====================

// 가격 숫자를 "25,000원" 모양으로 바꾼다.
function formatPrice(price) {
  if (price === null || price === undefined || price === "") return "";
  return Number(price).toLocaleString("ko-KR") + "원";
}

// 날짜 "2026-03-01" → "2026년 3월 1일"
function formatDate(str) {
  const p = str.split("-").map(Number);
  return p[0] + "년 " + p[1] + "월 " + p[2] + "일";
}

// 카드 하나(li)를 만든다. 사용자 입력은 textContent로만 넣어 안전하게 처리한다.
function makeCard(game, kind) {
  const li = document.createElement("li");
  li.className = "card";

  const info = document.createElement("div");
  info.className = "info";

  const title = document.createElement("p");
  title.className = "title";
  title.textContent = game.title;

  const tag = document.createElement("span");
  tag.className = "tag";
  if (kind === "available") {
    tag.classList.add("tag-ok");
    tag.textContent = "구매 가능!";
  } else if (kind === "upcoming") {
    tag.classList.add("tag-dday");
    tag.textContent = "D-" + daysUntil(game.date);
  } else {
    tag.classList.add("tag-done");
    tag.textContent = "구매 완료";
  }
  title.appendChild(tag);

  // 출시일이 바로 오늘(D-Day 0)이면 "오늘 출시" 표시를 하나 더 붙인다
  if (kind === "available" && daysUntil(game.date) === 0) {
    const today = document.createElement("span");
    today.className = "tag tag-today";
    today.textContent = "오늘 출시";
    title.appendChild(today);
  }

  const meta = document.createElement("p");
  meta.className = "meta";
  const pieces = ["출시일 " + formatDate(game.date)];
  if (game.platform) pieces.push(game.platform);
  if (game.price !== null && game.price !== "") pieces.push(formatPrice(game.price));
  meta.textContent = pieces.join(" · ");

  info.appendChild(title);
  info.appendChild(meta);
  li.appendChild(info);

  // 오른쪽 버튼 묶음
  const actions = document.createElement("div");
  actions.className = "actions";

  // 버튼 하나를 만드는 작은 도우미 (data-action으로 어떤 버튼인지 구분)
  function addButton(action, label, className) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = className;
    btn.textContent = label;
    btn.setAttribute("aria-label", game.title + " " + label);
    btn.dataset.id = game.id;
    btn.dataset.action = action;
    actions.appendChild(btn);
  }

  // 구매 가능 카드에만 [구매 완료] 버튼
  if (kind === "available") addButton("buy", "구매 완료", "btn-ok");
  // 모든 카드에 [수정]·[삭제] 버튼
  addButton("edit", "수정", "btn-ghost");
  addButton("delete", "삭제", "btn-danger");

  li.appendChild(actions);
  return li;
}

// 목록 하나를 그린다. 비어 있으면 안내 문구를 넣는다.
function renderList(listEl, countEl, items, kind, emptyText) {
  listEl.textContent = "";
  countEl.textContent = items.length + "개";
  if (items.length === 0) {
    const li = document.createElement("li");
    li.className = "empty";
    li.textContent = emptyText;
    listEl.appendChild(li);
    return;
  }
  items.forEach(function (g) { listEl.appendChild(makeCard(g, kind)); });
}

// 전체 화면을 다시 그린다. (오늘 날짜 기준으로 매번 다시 분류)
function render() {
  const avail = [], up = [], bought = [];
  games.slice().sort(byDate).forEach(function (g) {
    const kind = classify(g);
    if (kind === "available") avail.push(g);
    else if (kind === "upcoming") up.push(g);
    else bought.push(g);
  });
  renderList(document.getElementById("avail-list"), document.getElementById("avail-count"), avail, "available", "등록된 게임이 없습니다.");
  renderList(document.getElementById("up-list"), document.getElementById("up-count"), up, "upcoming", "등록된 게임이 없습니다.");
  renderList(document.getElementById("bought-list"), document.getElementById("bought-count"), bought, "bought", "아직 구매한 게임이 없습니다.");
  renderToday();
  sendTodayNotifications();
}

// ===================== 출시일 당일 알림 =====================

// 이름 끝 글자에 받침이 있으면 "이", 없으면 "가"를 고른다.
// 한글 글자는 (글자코드 - 0xAC00) % 28 이 0이면 받침이 없다.
function subjectParticle(name) {
  const last = name.charAt(name.length - 1);
  const code = last.charCodeAt(0);
  if (code >= 0xAC00 && code <= 0xD7A3) {
    return (code - 0xAC00) % 28 === 0 ? "가" : "이";
  }
  // 숫자로 끝나면 읽는 소리로 판단 (영·일·삼·육·칠·팔 → 이 / 이·사·오·구 → 가)
  if (/[0-9]/.test(last)) return "013678".indexOf(last) >= 0 ? "이" : "가";
  return "이(가)";   // 영어 등은 정확히 알 수 없어서 둘 다 적는다
}

// "픽셀 아일랜드가 오늘 출시되었습니다!" 같은 안내 문장을 만든다
function releaseMessage(game) {
  return game.title + subjectParticle(game.title) + " 오늘 출시되었습니다!";
}

// 아직 사지 않았고 출시일이 바로 오늘(D-Day 0)인 게임만 골라낸다
function todayGames() {
  return games.filter(function (g) { return !g.purchased && daysUntil(g.date) === 0; });
}

// 화면 위쪽 "오늘 출시" 상자 — 브라우저 알림이 막혀 있어도 항상 보인다
function renderToday() {
  const list = todayGames();
  const box = document.getElementById("today-box");
  const ul = document.getElementById("today-list");
  ul.textContent = "";
  list.forEach(function (g) {
    const li = document.createElement("li");
    li.textContent = releaseMessage(g);
    ul.appendChild(li);
  });
  box.hidden = list.length === 0;
}

// 이 브라우저에서 데스크톱 알림을 쓸 수 있는지 확인한다
function notifySupported() {
  return !IN_PREVIEW && ("Notification" in window);
}

// 지금 알림 권한 상태: "granted"(허용) / "denied"(거부) / "default"(아직 안 정함) / "unavailable"
function notifyPermission() {
  if (!notifySupported()) return "unavailable";
  try { return Notification.permission; } catch (e) { return "unavailable"; }
}

// 알림 상태 글자와 [브라우저 알림 켜기] 버튼을 갱신한다
function renderNotifyState() {
  const state = document.getElementById("notify-state");
  const btn = document.getElementById("notify-btn");
  const p = notifyPermission();
  btn.hidden = p !== "default";
  if (p === "granted") {
    state.textContent = "허용됨 (출시일 당일에 이 페이지를 열면 알려 드려요)";
  } else if (p === "denied") {
    state.textContent = "거부됨 (브라우저 주소창의 사이트 설정에서 바꿀 수 있어요)";
  } else if (p === "default") {
    state.textContent = "아직 정하지 않음";
  } else if (IN_PREVIEW) {
    state.textContent = "이 화면에서는 사용할 수 없음 ('새 탭 실행'으로 열면 쓸 수 있어요)";
  } else {
    state.textContent = "이 브라우저에서는 사용할 수 없음";
  }
}

// 알림 권한을 요청한다. 옛 브라우저는 Promise 대신 콜백으로 답을 주므로 둘 다 처리한다.
function askNotifyPermission() {
  if (notifyPermission() !== "default") { renderNotifyState(); return; }
  function done() { renderNotifyState(); sendTodayNotifications(); }
  try {
    const result = Notification.requestPermission(done);
    if (result && typeof result.then === "function") result.then(done, done);
  } catch (e) {
    renderNotifyState();
  }
}

// 오늘 이미 알림을 보낸 게임 id 목록 (같은 게임을 하루에 여러 번 알리지 않기 위해)
let notifiedMemory = { date: "", ids: [] };   // 저장소를 못 쓸 때 쓰는 메모리 기록
function loadNotified() {
  try {
    const data = JSON.parse(localStorage.getItem(NOTIFIED_KEY));
    if (data && typeof data.date === "string" && Array.isArray(data.ids)) notifiedMemory = data;
  } catch (e) { /* 저장소를 못 쓰면 메모리 기록만 사용 */ }
  // 날짜가 바뀌었으면 기록을 비운다
  if (notifiedMemory.date !== todayString()) notifiedMemory = { date: todayString(), ids: [] };
  return notifiedMemory;
}
function saveNotified(record) {
  notifiedMemory = record;
  try { localStorage.setItem(NOTIFIED_KEY, JSON.stringify(record)); } catch (e) { /* 무시 */ }
}

// 권한이 허용돼 있으면, 오늘 출시 게임마다 데스크톱 알림을 하루 한 번씩 보낸다
function sendTodayNotifications() {
  if (notifyPermission() !== "granted") return;
  const record = loadNotified();
  let changed = false;
  todayGames().forEach(function (g) {
    if (record.ids.indexOf(g.id) >= 0) return;   // 오늘 이미 알림
    try {
      new Notification("게임 출시 알림", { body: releaseMessage(g), tag: "sih26-20112-" + g.id });
      record.ids.push(g.id);
      changed = true;
    } catch (e) { /* 일부 휴대폰 브라우저는 이 방식의 알림을 막는다 → 화면 안내만 사용 */ }
  });
  if (changed) saveNotified(record);
}

// 저장 상태 안내
function renderSaveNote() {
  const note = document.getElementById("save-note");
  if (canSave) {
    note.className = "save-note";
    note.textContent = "목록은 이 브라우저에 자동 저장됩니다. (최대 " + MAX_GAMES + "개)";
  } else {
    note.className = "save-note warn";
    note.textContent = IN_PREVIEW
      ? "주의: 전시판 미리보기에서는 저장이 막혀 있습니다. 저장하려면 '새 탭 실행'으로 열어 주세요."
      : "주의: 이 환경에서는 저장이 되지 않습니다. 페이지를 닫으면 목록이 사라집니다.";
  }
}

function showMessage(text, type) {
  const msg = document.getElementById("form-msg");
  msg.className = "msg " + type;
  msg.textContent = text;
}

// ===================== 이벤트 연결 =====================

// 입력칸 4개(이름·날짜·가격·기종)를 검사한다. 등록 폼과 수정 팝업이 함께 쓴다.
// 문제가 있으면 빨간 테두리 + 안내 문구(say 함수로 표시) 후 null을 돌려준다.
// 문제가 없으면 { title, date, price, platform } 객체를 돌려준다.
function readFields(prefix, say) {
  const titleIn = document.getElementById(prefix + "-title");
  const dateIn = document.getElementById(prefix + "-date");
  const priceIn = document.getElementById(prefix + "-price");
  const platIn = document.getElementById(prefix + "-platform");

  const title = titleIn.value.trim();
  const date = dateIn.value;

  // 1) 필수 항목 검사: 빈 칸은 빨간 테두리
  titleIn.classList.toggle("invalid", title === "");
  dateIn.classList.toggle("invalid", date === "");
  titleIn.setAttribute("aria-invalid", title === "" ? "true" : "false");
  dateIn.setAttribute("aria-invalid", date === "" ? "true" : "false");
  if (title === "" || date === "") {
    say("게임 이름과 출시 예정일을 꼭 입력해 주세요.");
    (title === "" ? titleIn : dateIn).focus();
    return null;
  }
  // 2) 날짜 형식 검사
  if (!isValidDate(date)) {
    dateIn.classList.add("invalid");
    say("출시 예정일이 올바른 날짜가 아닙니다. 달력에서 다시 골라 주세요.");
    return null;
  }
  // 3) 가격 검사 (선택 항목이지만 적었다면 0 이상의 숫자여야 함)
  let price = null;
  priceIn.classList.remove("invalid");
  if (priceIn.value !== "" || (priceIn.validity && priceIn.validity.badInput)) {
    const n = Number(priceIn.value);
    if (priceIn.value === "" || !isFinite(n) || n < 0) {
      priceIn.classList.add("invalid");
      say("가격은 0 이상의 숫자로 적어 주세요. 모르면 비워 두어도 됩니다.");
      return null;
    }
    price = Math.round(n);
  }
  return { title: title, date: date, price: price, platform: platIn.value.trim() };
}

// [게임 등록]
function handleSubmit(event) {
  event.preventDefault();
  const titleIn = document.getElementById("in-title");
  const v = readFields("in", function (text) { showMessage(text, "error"); });
  if (!v) return;
  const title = v.title;
  // 4) 최대 개수 검사
  if (games.length >= MAX_GAMES) {
    showMessage("게임은 최대 " + MAX_GAMES + "개까지 등록할 수 있습니다. 초기화 후 다시 등록해 주세요.", "error");
    return;
  }

  const game = makeGame(v.title, v.date, v.price, v.platform);
  games.push(game);
  saveGames();
  render();

  const where = classify(game) === "available" ? "'구매 가능 게임'" : "'출시 예정 게임'";
  showMessage("“" + title + "”을(를) " + where + " 목록에 등록했습니다.", "info");
  document.getElementById("game-form").reset();
  titleIn.focus();
}

// 입력하면 빨간 테두리 해제
function clearInvalid(event) {
  event.target.classList.remove("invalid");
  event.target.removeAttribute("aria-invalid");
}

// 카드의 [구매 완료]·[수정]·[삭제] 버튼 (목록마다 하나의 이벤트만 걸어 둔다)
function handleListClick(event) {
  const btn = event.target.closest("button[data-id]");
  if (!btn) return;
  if (btn.dataset.action === "buy") markPurchased(btn.dataset.id);
  else if (btn.dataset.action === "edit") openEdit(btn.dataset.id, btn);
  else if (btn.dataset.action === "delete") openDelete(btn.dataset.id, btn);
}

// ===================== 팝업(모달) 공통 =====================
let openModal = null;     // 지금 열린 팝업의 바깥 상자 (없으면 null)
let returnFocus = null;   // 팝업을 닫은 뒤 커서를 돌려줄 버튼
let targetId = null;      // 지금 수정/삭제 중인 게임 id

function showModal(backId, firstFocus, opener) {
  openModal = document.getElementById(backId);
  returnFocus = opener || null;
  openModal.hidden = false;
  document.body.classList.add("modal-open");
  firstFocus.focus();
}

// 팝업을 닫는다. 카드가 다시 그려졌으면 같은 게임의 버튼을 찾아 커서를 돌려준다.
function hideModal() {
  if (!openModal) return;
  openModal.hidden = true;
  openModal = null;
  document.body.classList.remove("modal-open");
  let target = returnFocus;
  if (!target || !document.body.contains(target)) {
    target = targetId ? document.querySelector('button[data-id="' + targetId + '"][data-action="edit"]') : null;
  }
  // 지운 경우처럼 돌아갈 버튼이 없으면 결과 안내 문구로 커서를 옮긴다
  if (!target) target = document.getElementById("list-msg").textContent ? document.getElementById("list-msg") : document.getElementById("in-title");
  target.focus();
  targetId = null;
}

// Esc로 닫기 + Tab 키가 팝업 밖으로 나가지 않게 가둔다
function handleModalKey(event) {
  if (!openModal) return;
  if (event.key === "Escape") {
    event.preventDefault();
    hideModal();
    return;
  }
  if (event.key === "Tab") {
    const items = openModal.querySelectorAll("button, input");
    const first = items[0], last = items[items.length - 1];
    if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
    else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
  }
}

// ===================== 수정 팝업 =====================
function openEdit(id, opener) {
  const game = games.find(function (g) { return g.id === id; });
  if (!game) return;
  targetId = id;
  // 기존 정보를 입력칸에 미리 채운다
  document.getElementById("ed-title").value = game.title;
  document.getElementById("ed-date").value = game.date;
  document.getElementById("ed-price").value = (game.price === null || game.price === undefined) ? "" : game.price;
  document.getElementById("ed-platform").value = game.platform || "";
  ["ed-title", "ed-date", "ed-price"].forEach(function (k) {
    const el = document.getElementById(k);
    el.classList.remove("invalid");
    el.removeAttribute("aria-invalid");
  });
  document.getElementById("edit-msg").textContent = "";
  showModal("edit-back", document.getElementById("ed-title"), opener);
}

// [저장]: 검사를 통과하면 배열 → localStorage → 화면 순서로 바로 반영한다
function handleEditSubmit(event) {
  event.preventDefault();
  const game = games.find(function (g) { return g.id === targetId; });
  if (!game) { hideModal(); return; }
  const v = readFields("ed", function (text) { document.getElementById("edit-msg").textContent = text; });
  if (!v) return;
  game.title = v.title;
  game.date = v.date;
  game.price = v.price;
  game.platform = v.platform;
  saveGames();
  render();
  setListMessage("“" + game.title + "” 정보를 수정했습니다.");
  hideModal();
}

// ===================== 삭제 확인 팝업 =====================
function openDelete(id, opener) {
  const game = games.find(function (g) { return g.id === id; });
  if (!game) return;
  targetId = id;
  document.getElementById("del-name").textContent = "“" + game.title + "”을(를) 목록에서 지웁니다. 지운 뒤에는 되돌릴 수 없습니다.";
  // 실수로 지우지 않도록 처음 커서는 [취소]에 둔다
  showModal("del-back", document.querySelector('#del-back [data-close="del"].btn-ghost'), opener);
}

// [확인]을 누른 경우에만 실제로 지운다
function confirmDelete() {
  const index = games.findIndex(function (g) { return g.id === targetId; });
  if (index >= 0) {
    const removed = games.splice(index, 1)[0];
    saveGames();
    render();
    setListMessage("“" + removed.title + "”을(를) 삭제했습니다.");
  }
  returnFocus = null;   // 지운 카드의 버튼은 사라졌으므로
  targetId = null;
  hideModal();
}

function setListMessage(text) {
  document.getElementById("list-msg").textContent = text;
}

// 초기화 확인 UI (샌드박스에서는 confirm 창이 막혀 페이지 안에서 확인)
function openConfirm() {
  document.getElementById("confirm-box").hidden = false;
  document.getElementById("confirm-no").focus();
}
function closeConfirm() {
  document.getElementById("confirm-box").hidden = true;
  document.getElementById("reset-btn").focus();
}

function init() {
  const saved = loadGames();
  if (saved === null) {
    // 처음 실행: 예시 데이터를 넣는다
    games = SAMPLE_GAMES.map(function (s) { return makeGame(s.title, s.date, s.price, s.platform); });
    if (canSave) saveGames();
  } else {
    games = saved.slice(0, MAX_GAMES);
  }
  render();
  renderSaveNote();

  document.getElementById("game-form").addEventListener("submit", handleSubmit);
  ["in-title", "in-date", "in-price"].forEach(function (id) {
    document.getElementById(id).addEventListener("input", clearInvalid);
  });
  ["ed-title", "ed-date", "ed-price"].forEach(function (id) {
    document.getElementById(id).addEventListener("input", clearInvalid);
  });
  // 세 목록 모두 카드 버튼(구매 완료·수정·삭제)을 처리한다
  ["avail-list", "up-list", "bought-list"].forEach(function (id) {
    document.getElementById(id).addEventListener("click", handleListClick);
  });
  // 팝업: [저장]·[확인]·[취소]/X·Esc
  document.getElementById("edit-form").addEventListener("submit", handleEditSubmit);
  document.getElementById("del-yes").addEventListener("click", confirmDelete);
  document.querySelectorAll("[data-close]").forEach(function (btn) {
    btn.addEventListener("click", hideModal);
  });
  document.addEventListener("keydown", handleModalKey);

  // 브라우저 알림: 접속하자마자 권한을 묻고, 버튼으로도 다시 물을 수 있게 한다
  // (많은 브라우저가 클릭 없이 묻는 요청은 무시하므로 버튼이 꼭 필요하다)
  document.getElementById("notify-btn").addEventListener("click", askNotifyPermission);
  renderNotifyState();
  askNotifyPermission();
  document.getElementById("reset-btn").addEventListener("click", openConfirm);
  document.getElementById("confirm-no").addEventListener("click", closeConfirm);
  document.getElementById("confirm-yes").addEventListener("click", function () {
    resetAll();

init();
