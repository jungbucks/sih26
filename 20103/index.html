<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D-Day 수행평가 알림이</title>
<meta name="description" content="과목·과제·마감일을 적으면 마감이 가까운 순으로 D-Day를 보여 주고, 제출 완료한 과제는 아래로 모아 주는 수행평가 알림이">
<meta name="class" content="M반 (2-8)">
<meta name="status" content="PRD">
<style>
  @font-face { font-family: "Wanted Sans"; src: url("../assets/fonts/WantedSansVariable.woff2") format("woff2"); font-weight: 400 900; font-display: swap; }
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --text: #1c1d21;
    --muted: #5d6170;
    --line: #e2e4ea;
    --accent: #1e40af;
    --accent-soft: #e8edfb;
    --today: #c62828;
    --today-soft: #fdecec;
    --done-bg: #f0f1f4;
    --over: #6b4e00;
    --over-soft: #fff6dc;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Wanted Sans", -apple-system, "Malgun Gothic", sans-serif;
    font-size: 17px;
    line-height: 1.65;
    letter-spacing: -0.01em;
    word-break: keep-all;
    overflow-wrap: anywhere;
  }
  .wrap { max-width: 42rem; margin: 0 auto; padding: 24px 16px 48px; }
  header { margin-bottom: 24px; }
  h1 { font-size: 1.6rem; line-height: 1.3; margin: 0 0 4px; font-weight: 800; }
  h1 small { display: block; font-size: 0.9rem; font-weight: 600; color: var(--muted); }
  .today-line { margin: 0; color: var(--muted); font-size: 0.95rem; }
  h2 { font-size: 1.15rem; margin: 0 0 12px; font-weight: 700; display: flex; align-items: baseline; gap: 8px; }
  h2 .count { font-size: 0.85rem; font-weight: 600; color: var(--muted); }
  section { margin-top: 32px; }

  /* 입력 폼 */
  form.panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
  .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
  .field label { font-size: 0.9rem; font-weight: 600; }
  .field input {
    font: inherit; font-size: 1rem; padding: 10px 12px; border: 1px solid #c9ccd6; border-radius: 8px;
    background: #fff; color: var(--text); width: 100%; min-width: 0;
  }
  .field input:focus-visible { outline: 3px solid var(--accent-soft); border-color: var(--accent); }
  .field input[aria-invalid="true"] { border-color: var(--today); }
  .hint { font-size: 0.82rem; color: var(--muted); margin: 0; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button {
    font: inherit; font-size: 0.95rem; font-weight: 600; cursor: pointer;
    padding: 9px 14px; border-radius: 8px; border: 1px solid #c9ccd6; background: #fff; color: var(--text);
    min-height: 40px;
  }
  button:hover { background: #f2f3f6; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { background: #1a3893; }
  button.danger { color: var(--today); border-color: #e6b3b3; }
  button.danger.solid { background: var(--today); border-color: var(--today); color: #fff; }
  .msg { margin: 12px 0 0; padding: 10px 12px; border-radius: 8px; font-size: 0.92rem; font-weight: 600; }
  .msg:empty { display: none; }
  .msg.error { background: var(--today-soft); color: #9b1c1c; border-left: 4px solid var(--today); }
  .msg.ok { background: var(--accent-soft); color: #1a3480; border-left: 4px solid var(--accent); }
  .editing-note { font-size: 0.9rem; color: var(--accent); font-weight: 700; margin: 0 0 8px; }
  .editing-note[hidden] { display: none; }

  /* 카드 목록 */
  ul.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .empty { color: var(--muted); font-size: 0.95rem; margin: 0; padding: 14px 16px; border: 1px dashed var(--line); border-radius: var(--radius); background: var(--card); }
  .task { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
  .task.is-today { border: 2px solid var(--today); background: var(--today-soft); }
  .task.is-over { border: 1px dashed #c9a43a; background: var(--over-soft); }
  .task.is-done { background: var(--done-bg); }
  .task.is-done .content, .task.is-done .due, .task.is-done .subject { text-decoration: line-through; }
  .task.is-done .content, .task.is-done .due { color: var(--muted); }
  .task.is-editing { outline: 3px solid var(--accent); outline-offset: 2px; }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .subject { display: inline-block; color: #fff; font-size: 0.85rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; max-width: 100%; }
  .dday { font-weight: 800; font-size: 1rem; padding: 2px 10px; border-radius: 8px; background: #eef0f4; color: var(--text); white-space: nowrap; }
  .is-today .dday { background: var(--today); color: #fff; }
  .is-over .dday { background: #fff; color: var(--over); border: 1px solid #c9a43a; }
  .is-done .dday { background: #e2e4ea; color: var(--muted); }
  .content { margin: 8px 0 2px; font-size: 1.02rem; font-weight: 600; }
  .due { margin: 0 0 10px; font-size: 0.88rem; color: var(--muted); }
  .over-note { color: var(--over); font-weight: 700; }
  .today-note { color: var(--today); font-weight: 700; }
  .confirm-box { margin-top: 10px; padding: 10px 12px; border-radius: 8px; background: #fff; border: 1px solid #e6b3b3; }
  .confirm-box p { margin: 0 0 8px; font-size: 0.92rem; font-weight: 600; color: #9b1c1c; }

  footer.reset { margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--line); }
  footer.reset p { font-size: 0.88rem; color: var(--muted); margin: 0 0 10px; }
  .store-warn { font-size: 0.85rem; color: var(--over); background: var(--over-soft); border-radius: 8px; padding: 8px 12px; margin: 12px 0 0; }
  .store-warn[hidden] { display: none; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><small>학번 20103</small>D-Day 수행평가 알림이</h1>
    <p class="today-line">오늘은 <strong id="todayText">-</strong></p>
    <p class="store-warn" id="storeWarn" hidden></p>
  </header>

  <form class="panel" id="taskForm" novalidate aria-labelledby="formTitle">
    <h2 id="formTitle">수행평가 등록 <span class="count" id="limitText"></span></h2>
    <p class="editing-note" id="editingNote" hidden>수정 중이에요. 내용을 고친 뒤 '수정 완료'를 눌러 주세요.</p>
    <div class="field">
      <label for="subjectInput">과목명</label>
      <input id="subjectInput" type="text" maxlength="20" autocomplete="off" placeholder="예: 정보">
    </div>
    <div class="field">
      <label for="contentInput">과제 내용</label>
      <input id="contentInput" type="text" maxlength="60" autocomplete="off" placeholder="예: 보고서 작성">
    </div>
    <div class="field">
      <label for="dateInput">마감 날짜</label>
      <input id="dateInput" type="date">
      <p class="hint">오늘보다 이전 날짜는 등록할 수 없어요.</p>
    </div>
    <div class="row">
      <button type="submit" class="primary" id="submitBtn">과제 추가</button>
      <button type="button" id="cancelEditBtn" hidden>수정 취소</button>
    </div>
    <p class="msg" id="formMsg" role="status" aria-live="polite"></p>
  </form>

  <section aria-labelledby="activeTitle">
    <h2 id="activeTitle">진행 중인 수행평가 <span class="count" id="activeCount"></span></h2>
    <ul class="list" id="activeList"></ul>
  </section>

  <section aria-labelledby="doneTitle">
    <h2 id="doneTitle">완료된 수행평가 <span class="count" id="doneCount"></span></h2>
    <ul class="list" id="doneList"></ul>
  </section>

  <footer class="reset">
    <p>예시 과제 2개만 남기고 처음 상태로 되돌려요.</p>
    <button type="button" class="danger" id="resetBtn">전체 데이터 초기화</button>
    <div class="confirm-box" id="resetConfirm" hidden>
      <p>저장된 모든 수행평가 데이터가 삭제됩니다. 계속할까요?</p>
      <div class="row">
        <button type="button" class="danger solid" id="resetYes">네, 초기화할게요</button>
        <button type="button" id="resetNo">취소</button>
      </div>
    </div>
    <p class="msg" id="resetMsg" role="status" aria-live="polite"></p>
  </footer>
</div>

<script>
(function () {
  "use strict";

  // ---- 저장소 설정 ----
  // 이 작품의 데이터는 "sih26:20103:" 으로 시작하는 이름으로만 저장해요.
  // (같은 사이트의 다른 학생 작품 데이터는 건드리지 않기 위해서예요.)
  var PREFIX = "sih26:20103:";
  var KEY = PREFIX + "tasks";
  var MAX = 30;

  // 과목 배지에 쓸 색 목록. 모두 흰 글자와의 대비가 4.5:1 이상인 진한 색이에요.
  // (빨강 계열은 '오늘 마감' 강조와 헷갈리지 않게 뺐어요.)
  var PALETTE = ["#1d4ed8", "#0f766e", "#7c3aed", "#b45309", "#15803d", "#4338ca",
                 "#0e7490", "#9333ea", "#475569", "#c2410c", "#a21caf", "#3f6212"];

  var tasks = [];          // 메모리에 있는 과제 목록 (저장이 안 돼도 이걸로 동작해요)
  var canStore = true;     // localStorage 사용 가능 여부
  var editingId = null;    // 지금 수정 중인 과제의 id
  var confirmDeleteId = null; // 삭제 확인을 띄운 과제의 id

  var $ = function (id) { return document.getElementById(id); };
  var form = $("taskForm"), subjectInput = $("subjectInput"), contentInput = $("contentInput"),
      dateInput = $("dateInput"), submitBtn = $("submitBtn"), cancelEditBtn = $("cancelEditBtn"),
      formMsg = $("formMsg"), editingNote = $("editingNote");

  // ---- 날짜 도우미 ----
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  // 오늘 날짜를 "YYYY-MM-DD" 문자열로 (내 컴퓨터 시간 기준)
  function todayStr() {
    var d = new Date();
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }
  function addDays(str, n) {
    var p = str.split("-");
    var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]) + n);
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }
  function isValidDate(str) {
    if (typeof str !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(str)) return false;
    var p = str.split("-").map(Number);
    var d = new Date(Date.UTC(p[0], p[1] - 1, p[2]));
    return d.getUTCFullYear() === p[0] && d.getUTCMonth() === p[1] - 1 && d.getUTCDate() === p[2];
  }
  // "YYYY-MM-DD"를 '1970년부터 며칠째인지' 숫자로 바꿔요. 시간·시차 영향 없이 날짜만 비교하려고요.
  function dayNumber(str) {
    var p = str.split("-").map(Number);
    return Math.round(Date.UTC(p[0], p[1] - 1, p[2]) / 86400000);
  }

  // ★ D-Day 계산: 마감 날짜 - 오늘 날짜 (일 단위)
  //   양수면 아직 남은 날(D-3), 0이면 오늘 마감(D-Day), 음수면 마감이 지난 날(D+2)
  function daysLeft(due) { return dayNumber(due) - dayNumber(todayStr()); }
  function ddayLabel(n) {
    if (n === 0) return "D-Day";
    return n > 0 ? "D-" + n : "D+" + (-n);
  }
  var WEEK = ["일", "월", "화", "수", "목", "금", "토"];
  function prettyDate(str, withYear) {
    var p = str.split("-").map(Number);
    var w = WEEK[new Date(Date.UTC(p[0], p[1] - 1, p[2])).getUTCDay()];
    return (withYear ? p[0] + "년 " : "") + p[1] + "월 " + p[2] + "일 (" + w + ")";
  }

  // 과목명이 같으면 항상 같은 색이 나오도록, 글자들로 숫자를 만들어 색 목록에서 골라요.
  function subjectColor(name) {
    var key = name.replace(/\s+/g, "").toLowerCase();
    var h = 2166136261;
    for (var i = 0; i < key.length; i++) {          // 글자 하나씩 섞어서 숫자 만들기
      h ^= key.charCodeAt(i);
      h = Math.imul(h, 16777619) >>> 0;
    }
    h ^= h >>> 16; h = Math.imul(h, 0x85ebca6b) >>> 0;  // 한 번 더 고루 섞기
    h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35) >>> 0;
    h ^= h >>> 16;
    return PALETTE[(h >>> 0) % PALETTE.length];
  }

  // ---- 예시 데이터 ----
  function sampleTasks() {
    var t = todayStr();
    return [
      { id: 1, subject: "정보", content: "프롬프트 작성", dueDate: addDays(t, 2), completed: false },
      { id: 2, subject: "수학", content: "학습지 풀이 제출", dueDate: addDays(t, 5), completed: false }
    ];
  }

  // 저장된 값이 올바른 과제 모양인지 확인하고, 이상한 항목은 걸러내요.
  function cleanList(arr) {
    var out = [], seen = {};
    for (var i = 0; i < arr.length && out.length < MAX; i++) {
      var x = arr[i];
      if (!x || typeof x !== "object") continue;
      var subject = String(x.subject == null ? "" : x.subject).trim().slice(0, 20);
      var content = String(x.content == null ? "" : x.content).trim().slice(0, 60);
      if (!subject || !content || !isValidDate(x.dueDate)) continue;
      var id = Number(x.id);
      if (!isFinite(id) || seen[id]) id = 0;
      out.push({ id: id, subject: subject, content: content, dueDate: x.dueDate, completed: x.completed === true });
      if (id) seen[id] = true;
    }
    // id가 없거나 겹친 항목에는 새 id를 붙여요.
    var maxId = 0;
    out.forEach(function (t) { if (t.id > maxId) maxId = t.id; });
    out.forEach(function (t) { if (!t.id) t.id = ++maxId; });
    return out;
  }

  // ★ localStorage 읽기: 저장된 JSON 글자를 배열로 바꿔요.
  //   처음 실행이라 아무것도 없으면 예시 데이터를 넣어요.
  function load() {
    var raw = null;
    try {
      raw = window.localStorage.getItem(KEY);
    } catch (e) {
      canStore = false;
    }
    if (!canStore) {
      showStoreWarn("이 화면에서는 저장 기능을 쓸 수 없어요. 새로고침하면 목록이 처음 상태로 돌아가요.");
      tasks = sampleTasks();
      return;
    }
    if (raw === null) {           // 처음 실행
      tasks = sampleTasks();
      save();
      return;
    }
    try {
      var parsed = JSON.parse(raw);
      if (!Array.isArray(parsed)) throw new Error("not array");
      tasks = cleanList(parsed);
    } catch (e) {
      tasks = [];
      showStoreWarn("저장된 데이터를 읽지 못했어요. 새로 과제를 추가하면 읽지 못한 데이터는 덮어써져요. 처음부터 하려면 맨 아래 '전체 데이터 초기화'를 눌러 주세요.");
    }
  }

  // ★ localStorage 쓰기: 과제 배열을 JSON 글자로 바꿔 저장해요.
  function save() {
    if (!canStore) return;
    try {
      window.localStorage.setItem(KEY, JSON.stringify(tasks));
    } catch (e) {
      canStore = false;
      showStoreWarn("저장하지 못했어요. 지금 목록은 이 화면을 닫기 전까지만 남아 있어요.");
    }
  }

  function showStoreWarn(text) {
    var el = $("storeWarn");
    el.textContent = text;
    el.hidden = false;
  }

  // ★ 정렬: 진행 중 목록은 마감이 가까운 순(D-Day 오름차순)으로 sort() 해요.
  //   단, 마감이 이미 지난 과제(D+)는 앞으로 할 과제를 가리지 않게 진행 중 목록 맨 아래로 보내요.
  //   날짜가 같으면 먼저 등록한 과제가 위에 와요.
  function sortByDue(list) {
    return list.slice().sort(function (a, b) {
      var da = daysLeft(a.dueDate), db = daysLeft(b.dueDate);
      var overA = da < 0 ? 1 : 0, overB = db < 0 ? 1 : 0;
      if (overA !== overB) return overA - overB;   // 지난 과제는 뒤로
      if (da !== db) return da - db;               // 남은 날이 적은 과제가 앞으로
      return a.id - b.id;
    });
  }

  // ---- 화면 그리기 ----
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function btn(text, cls, onClick, label) {
    var b = el("button", cls, text);
    b.type = "button";
    if (label) b.setAttribute("aria-label", label);
    b.addEventListener("click", onClick);
    return b;
  }

  function renderCard(t) {
    var n = daysLeft(t.dueDate);
    var li = el("li", "task");
    li.dataset.id = t.id;
    if (t.completed) li.classList.add("is-done");
    else if (n === 0) li.classList.add("is-today");
    else if (n < 0) li.classList.add("is-over");
    if (t.id === editingId) li.classList.add("is-editing");

    var top = el("div", "top");
    var badge = el("span", "subject", t.subject);
    badge.style.backgroundColor = subjectColor(t.subject);
    top.appendChild(badge);
    top.appendChild(el("span", "dday", ddayLabel(n)));
    li.appendChild(top);

    li.appendChild(el("p", "content", t.content));
    var due = el("p", "due", "마감 " + prettyDate(t.dueDate, false));
    if (!t.completed && n === 0) due.appendChild(el("span", "today-note", " · 오늘 마감이에요!"));
    if (!t.completed && n < 0) due.appendChild(el("span", "over-note", " · 마감이 지났어요. 제출했는지 확인해 보세요."));
    li.appendChild(due);

    var row = el("div", "row");
    var doneBtn = btn(t.completed ? "완료 취소" : "제출 완료", t.completed ? "" : "primary",
      function () { toggleDone(t.id); }, (t.completed ? "완료 취소: " : "제출 완료: ") + t.subject + " " + t.content);
    doneBtn.setAttribute("aria-pressed", t.completed ? "true" : "false");
    row.appendChild(doneBtn);
    row.appendChild(btn("수정", "", function () { startEdit(t.id); }, "수정: " + t.subject + " " + t.content));
    row.appendChild(btn("삭제", "danger", function () { askDelete(t.id); }, "삭제: " + t.subject + " " + t.content));
    li.appendChild(row);

    // 삭제 확인 (브라우저 확인창 대신 카드 안에서 한 번 더 물어봐요)
    if (confirmDeleteId === t.id) {
      var box = el("div", "confirm-box");
      box.appendChild(el("p", "", "이 과제를 정말 삭제할까요? 삭제하면 되돌릴 수 없어요."));
      var r2 = el("div", "row");
      r2.appendChild(btn("네, 삭제할게요", "danger solid", function () { doDelete(t.id); }));
      r2.appendChild(btn("취소", "", function () { confirmDeleteId = null; render(); focusCardButton(t.id, 2); }));
      box.appendChild(r2);
      li.appendChild(box);
    }
    return li;
  }

  function renderList(listEl, items, emptyText) {
    listEl.textContent = "";
    if (!items.length) {
      listEl.appendChild(el("li", "empty", emptyText));
      return;
    }
    items.forEach(function (t) { listEl.appendChild(renderCard(t)); });
  }

  function render() {
    var active = sortByDue(tasks.filter(function (t) { return !t.completed; }));
    var done = sortByDue(tasks.filter(function (t) { return t.completed; }));
    renderList($("activeList"), active, "진행 중인 수행평가가 없어요. 위에서 과제를 추가해 보세요.");
    renderList($("doneList"), done, "아직 제출 완료한 과제가 없어요.");
    $("activeCount").textContent = active.length + "개";
    $("doneCount").textContent = done.length + "개";
    $("limitText").textContent = "(" + tasks.length + " / " + MAX + "개)";
    $("todayText").textContent = prettyDate(todayStr(), true);
    dateInput.min = todayStr();
  }

  function focusCardButton(id, index) {
    var li = document.querySelector('.task[data-id="' + id + '"]');
    if (li) { var b = li.querySelectorAll(".row > button")[index]; if (b) b.focus(); }
  }

  function setMsg(text, kind) {
    formMsg.textContent = text;
    formMsg.className = "msg" + (kind ? " " + kind : "");
    $("resetMsg").textContent = "";
  }

  // ---- 추가 / 수정 ----
  function resetForm() {
    form.reset();
    editingId = null;
    submitBtn.textContent = "과제 추가";
    cancelEditBtn.hidden = true;
    editingNote.hidden = true;
    [subjectInput, contentInput, dateInput].forEach(function (i) { i.removeAttribute("aria-invalid"); });
  }

  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    var subject = subjectInput.value.trim();
    var content = contentInput.value.trim();
    var due = dateInput.value;
    var fields = [[subjectInput, subject], [contentInput, content], [dateInput, due]];
    var firstEmpty = null;
    fields.forEach(function (f) {
      if (!f[1]) { f[0].setAttribute("aria-invalid", "true"); if (!firstEmpty) firstEmpty = f[0]; }
      else f[0].removeAttribute("aria-invalid");
    });
    // 1) 빈 칸 검사
    if (firstEmpty) {
      setMsg("모든 항목을 입력해 주세요!", "error");
      firstEmpty.focus();
      return;
    }
    if (!isValidDate(due)) {
      dateInput.setAttribute("aria-invalid", "true");
      setMsg("마감 날짜를 달력에서 다시 골라 주세요.", "error");
      dateInput.focus();
      return;
    }
    // 2) 과거 날짜 검사 (수정할 때 원래 날짜를 그대로 두는 경우는 허용)
    var original = editingId != null ? findTask(editingId) : null;
    if (daysLeft(due) < 0 && !(original && original.dueDate === due)) {
      dateInput.setAttribute("aria-invalid", "true");
      setMsg("오늘보다 이전 날짜는 등록할 수 없어요. 마감 날짜를 다시 확인해 주세요.", "error");
      dateInput.focus();
      return;
    }

    if (original) {
      original.subject = subject;
      original.content = content;
      original.dueDate = due;
      var savedId = original.id;
      save();
      resetForm();
      render();
      setMsg("'" + subject + " · " + content + "' 과제를 수정했어요.", "ok");
      focusCardButton(savedId, 1);
      return;
    }

    // 3) 개수 제한
    if (tasks.length >= MAX) {
      setMsg("과제는 최대 " + MAX + "개까지 등록할 수 있어요. 끝난 과제를 삭제한 뒤 추가해 주세요.", "error");
      return;
    }
    var maxId = 0;
    tasks.forEach(function (t) { if (t.id > maxId) maxId = t.id; });
    tasks.push({ id: maxId + 1, subject: subject, content: content, dueDate: due, completed: false });
    save();
    resetForm();
    render();
    var n = daysLeft(due);
    setMsg("'" + subject + " · " + content + "' 과제를 추가했어요. (" + ddayLabel(n) + ")", "ok");
    subjectInput.focus();
  });

  cancelEditBtn.addEventListener("click", function () {
    var id = editingId;
    resetForm();
    setMsg("수정을 취소했어요.", "");
    render();
    focusCardButton(id, 1);
  });

  function findTask(id) {
    for (var i = 0; i < tasks.length; i++) if (tasks[i].id === id) return tasks[i];
    return null;
  }

  function startEdit(id) {
    var t = findTask(id);
    if (!t) return;
    editingId = id;
    confirmDeleteId = null;
    subjectInput.value = t.subject;
    contentInput.value = t.content;
    dateInput.value = t.dueDate;
    submitBtn.textContent = "수정 완료";
    cancelEditBtn.hidden = false;
    editingNote.hidden = false;
    setMsg("", "");
    render();
    form.scrollIntoView({ block: "start" });
    subjectInput.focus();
  }

  // ---- 제출 완료 / 완료 취소 ----
  function toggleDone(id) {
    var t = findTask(id);
    if (!t) return;
    t.completed = !t.completed;   // 완료 여부(true/false)를 뒤집어요
    save();
    render();
    focusCardButton(id, 0);
  }

  // ---- 삭제 ----
  function askDelete(id) {
    confirmDeleteId = id;
    render();
    var li = document.querySelector('.task[data-id="' + id + '"] .confirm-box button');
    if (li) li.focus();
  }
  function doDelete(id) {
    var t = findTask(id);
    tasks = tasks.filter(function (x) { return x.id !== id; });
    confirmDeleteId = null;
    if (editingId === id) resetForm();
    save();
    render();
    if (t) setMsg("'" + t.subject + " · " + t.content + "' 과제를 삭제했어요.", "ok");
  }

  // ---- 전체 초기화 ----
  $("resetBtn").addEventListener("click", function () {
    $("resetConfirm").hidden = false;
    $("resetMsg").textContent = "";
    $("resetYes").focus();
  });
  $("resetNo").addEventListener("click", function () {
    $("resetConfirm").hidden = true;
    $("resetBtn").focus();
  });
  $("resetYes").addEventListener("click", function () {
    // 이 작품("sih26:20103:")의 저장값만 골라 지워요.
    if (canStore) {
      try {
        var del = [];
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i);
          if (k && k.indexOf(PREFIX) === 0) del.push(k);
        }
        del.forEach(function (k) { localStorage.removeItem(k); });
      } catch (e) { canStore = false; }
    }
    tasks = sampleTasks();
    confirmDeleteId = null;
    resetForm();
    setMsg("", "");
    save();
    render();
    $("resetConfirm").hidden = true;
    $("storeWarn").hidden = !!canStore;
    $("resetMsg").textContent = "초기화했어요. 예시 과제 2개로 다시 시작해요.";
    $("resetMsg").className = "msg ok";
    $("resetBtn").focus();
  });

  // 화면을 켜 둔 채 날짜가 바뀌어도 D-Day가 맞도록, 다시 볼 때 새로 계산해요.
  var lastDay = todayStr();
  function refreshIfNewDay() {
    if (todayStr() !== lastDay) { lastDay = todayStr(); render(); }
  }
  document.addEventListener("visibilitychange", function () { if (!document.hidden) refreshIfNewDay(); });
  setInterval(refreshIfNewDay, 60000);

  load();
  render();
})();
</script>
</body>
</html>
